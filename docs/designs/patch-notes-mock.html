const KIND = { new: '새 기능', improved: '개선', fixed: '수정' };
const HISTORY_MAX = 12, COLLAPSE_AT = 5;

const s = { platform: 'desktop', dscreen: 'modal', mscreen: 'modal', behind: 1, theme: 'dark', mark: true, fit: true, show: true, dontShow: false, histMode: 'window', histOpen: false, exp: new Set() };

const sections = n => n.sections.map(x => `<span class="kind ${x.kind}">${KIND[x.kind]}</span>${x.items.map(i =>
  `<div class="item"><b>${i.title}</b>${(i.detail ?? []).map(line => `<span>${line}</span>`).join('')}</div>`).join('')}`).join('');
const full = n => `<div class="ver"><div class="ver-h"><b>${n.version}</b><span>${n.date}</span></div><p class="sum">${n.summary}</p>${sections(n)}</div>`;
// Collapsed card: version + summary, expand icon on the right.
const card = (ctx, n, i) => { const key = `${ctx}:${n.version}`, open = s.exp.has(key);
  return `<div class="vc ${open ? 'open' : ''}"><div class="vc-h" data-exp="${key}"><div class="grow"><div class="ver-h" style="margin:0"><b>${n.version}</b>${i === 0 && ctx.endsWith('hist') ? '<span class="badge">현재</span>' : ''}<span>${n.date}</span></div><p class="sum">${n.summary}</p></div><span class="ex">⌄</span></div>${open ? `<div class="vc-b">${sections(n)}</div>` : ''}</div>`; };
const list = (ctx, notes) => notes.length >= COLLAPSE_AT ? notes.map((n, i) => card(ctx, n, i)).join('') : notes.map(full).join('');
const current = p => NOTES[p][0].version;
const unseen = p => NOTES[p].slice(0, s.behind);
const eyebrow = p => s.behind > 1 ? `버전 ${current(p)} · 업데이트 ${s.behind}개` : `버전 ${current(p)}`;
const chk = () => `<label class="chk ${s.dontShow ? 'on' : ''}" data-act="dont"><i>${s.dontShow ? '✓' : ''}</i>다시 보지 않기</label>`;

function desktopFrame(inner, over = '') {
  return `<div class="desk-wrap ${s.fit ? 'fit' : ''}"><div class="desk theme-dark">
    <div class="topbar"><b>Thread</b><span>${current('desktop')}</span><span class="grow"></span><span>모두 동기화됨 · 방금</span></div>
    <div class="desk-body"><div class="side">
      <div class="it on"><span class="dot" style="background:#6294ff"></span>업무</div><div class="it"><span class="dot" style="background:#a18aff"></span>공부</div><div class="it"><span class="dot" style="background:#70d5a0"></span>개인</div></div>
      <div class="main"><h1>업무</h1>
        ${['분기 회고 자료 정리|2시간 남음', '주간 보고서 제출|3시간 지남', '스탠드업 메모|1일 남음', '디자인 리뷰 준비|3일 남음'].map(x => { const [t, m] = x.split('|'); return `<div class="drow"><span class="c"></span>${t}<span class="m">${m}</span></div>`; }).join('')}
      </div></div>
    <div class="back">${inner}</div>${over ? `<div class="back over">${over}</div>` : ''}</div></div>`;
}
function desktopModal() {
  return `<div class="pn chg"><div class="pn-head"><div class="sym">✦</div><div><div class="eyebrow">${eyebrow('desktop')}</div><h2>업데이트를 완료했어요</h2></div></div>
    <div class="pn-body">${list('dmodal', unseen('desktop'))}</div>
    <div class="pn-foot">${chk()}<span class="grow"></span><button class="dbtn ghost" data-go="dsettings">전체 내역</button><button class="dbtn">확인</button></div></div>`;
}
// History window opened from settings: same window, every version (up to 12).
function desktopHistory() {
  const notes = NOTES.desktop.slice(0, HISTORY_MAX);
  return `<div class="pn chg"><div class="pn-head"><div class="sym">✦</div><div><div class="eyebrow">버전 ${current('desktop')}</div><h2>업데이트 내역</h2></div></div>
    <div class="pn-body">${notes.map((n, i) => card('dhist', n, i)).join('')}</div>
    <div class="pn-foot"><span class="grow"></span><button class="dbtn" data-act="histclose">닫기</button></div></div>`;
}
function desktopSettings() {
  const nav = ['일반', '데이터', '사용자 맞춤', '계정', '시스템', '정보'].map(x => `<div class="mi ${x === '정보' ? 'on' : ''}">${x}</div>`).join('');
  const inline = s.histMode === 'inline' && s.histOpen;
  return `<div class="set"><div class="set-nav"><h4>설정</h4>${nav}</div><div class="set-x">✕</div>
    <div class="set-content"><h2>정보</h2><p class="pd">Thread 버전과 관련 정보입니다.</p>
      <div class="scard">
        <div class="srow"><div class="tx"><div class="lb">버전 ${current('desktop')}</div><div class="ds">최신 버전입니다 · 방금 확인</div></div><button class="sbtn">업데이트 확인</button></div>
        <div class="srow"><div class="tx"><div class="lb">베타 버전 받기</div><div class="ds">정식 출시 전 버전을 먼저 받아요.</div></div><button class="tog"></button></div>
        <div class="srow chg"><div class="tx"><div class="lb">업데이트 후 변경 내용 보기</div><div class="ds">새 버전으로 바뀐 뒤 처음 열 때 바뀐 점을 창으로 보여 줘요.</div></div><button class="tog ${s.show ? 'on' : ''}" data-act="show"></button></div>
        <div class="srow click chg ${inline ? 'open' : ''}" data-act="hist"><div class="tx"><div class="lb">업데이트 내역</div><div class="ds">최근 업데이트 ${HISTORY_MAX}개까지 볼 수 있어요.</div></div><span class="arr">›</span></div>
        ${inline ? `<div class="inline-list">${NOTES.desktop.slice(0, HISTORY_MAX).map((n, i) => card('dhist', n, i)).join('')}</div>` : ''}
      </div>
      <div class="sec"><div class="scard">
        <div class="srow"><div class="tx"><div class="lb">개인정보처리방침</div></div><button class="sbtn">열기</button></div>
        <div class="srow"><div class="tx"><div class="lb">문의</div></div><button class="sbtn">메일 보내기</button></div>
      </div></div>
    </div></div>`;
}

const statusBar = () => `<div class="status"><span>9:41</span><span>▂▄▆ ◔ ▮</span></div>`;
const tabbar = on => `<nav class="tabbar">${[['tasks', '☑', '할 일'], ['calendar', '▦', '캘린더'], ['timeline', '◷', '일정'], ['settings', '⚙', '설정']]
  .map(([id, ic, l]) => `<button class="${on === id ? 'on' : ''}"><span class="ic">${ic}</span>${l}</button>`).join('')}</nav>`;
function mobileTasks() {
  return `<div class="content"><div class="appbar"><h1>업무</h1></div>
    ${['분기 회고 자료 정리|2시간 남음', '주간 보고서 제출|3시간 지남', '토익 단어 50개|3일 남음 · ↻ 매일', '스탠드업 메모|1일 남음'].map(x => { const [t, m] = x.split('|'); return `<div class="task"><span class="check"></span><div><div class="t">${t}</div><div class="meta">${m}</div></div></div>`; }).join('')}
  </div>${tabbar('tasks')}`;
}
function mobileModal() {
  return mobileTasks() + `<div class="scrim"></div><div class="sheet chg"><div class="grab"></div>
    <div class="sh-head"><div class="sym">✦</div><div><div class="eyebrow">${eyebrow('mobile')}</div><h2>업데이트를 완료했어요</h2></div></div>
    <div class="sh-body">${list('mmodal', unseen('mobile'))}</div>
    <div class="sh-foot"><div style="display:flex;align-items:center;margin-bottom:12px">${chk()}<span style="flex:1"></span><button class="mbtn ghost" style="width:auto;padding:0 6px" data-go="mhistory">전체 내역</button></div>
      <button class="mbtn primary">확인</button></div></div>`;
}
function mobileSettings() {
  const item = (t, v, extra = '', cls = '') => `<div class="mi-row ${cls}"><div class="grow"><div class="tt">${t}</div></div>${v ? `<span class="val">${v}</span>` : ''}${extra}</div>`;
  return `<div class="content"><div class="appbar" style="padding:18px 16px 12px"><h1>설정</h1></div>
    <div class="profile"><span class="lg">T</span><div><div style="font-weight:700">user@example.com</div><div style="font-size:12px;color:var(--muted)">이 기기 · 연결됨</div></div></div>
    <div class="group-t">일반</div><div class="group">${item('시작 화면', '할 일', '<span class="chev">›</span>')}${item('테마', '시스템', '<span class="chev">›</span>', 'last')}</div>
    <div class="group-t">정보</div><div class="group">
      ${item('버전', current('mobile'))}
      <div class="mi-row chg" data-go="mhistory" style="cursor:pointer"><div class="grow"><div class="tt">업데이트 내역</div></div><span class="chev">›</span></div>
      ${item('개인정보처리방침', '', '<span class="chev">›</span>')}${item('문의', 'support@threadapp.kr', '', 'last')}</div>
  </div>${tabbar('settings')}`;
}
function mobileHistory() {
  const notes = NOTES.mobile.slice(0, HISTORY_MAX);
  const rows = notes.map((n, i) => {
    const key = `mhist:${n.version}`, open = s.exp.has(key), last = i === notes.length - 1;
    return `<div class="mi-row ${open ? 'open' : ''} ${last && !open ? 'last' : ''}" data-exp="${key}" style="cursor:pointer"><div class="grow"><div class="tt">${n.version}${i === 0 ? '<span class="badge">현재</span>' : ''}</div><div class="dt">${n.date} · ${n.summary}</div></div><span class="chev">›</span></div>
      ${open ? `<div class="mv-body ${last ? 'last' : ''}">${sections(n)}</div>` : ''}`;
  }).join('');
  return `<div class="content chg"><div class="hdr"><span class="back-btn" data-go="msettings">←</span><h1>업데이트 내역</h1></div>
    <div class="group" style="margin-top:6px"><div class="mi-row last"><div class="grow"><div class="tt">업데이트 후 변경 내용 보기</div><div class="dt">새 버전으로 바뀐 뒤 처음 열 때 바뀐 점을 보여 줘요.</div></div><button class="msw ${s.show ? 'on' : ''}" data-act="show"></button></div></div>
    <div class="group-t">최근 업데이트 (최대 ${HISTORY_MAX}개)</div><div class="group">${rows}</div>
    <div style="height:24px"></div></div>${tabbar('settings')}`;
}
function phone() {
  const body = { modal: mobileModal, settings: mobileSettings, history: mobileHistory }[s.mscreen]();
  return `<div class="phone theme-${s.theme}">${statusBar()}${body}<div class="gesture"></div></div>`;
}

const JSON_SAMPLE = `docs/patchNotes/desktop/win/2.0.16.json
{
  "version": "2.0.16",
  "date": "2026-12-01",
  "summary": "앱이 더 빠르고 안정적이에요.",
  "sections": [
    { "kind": "improved", "items": [
      { "title": "앱 실행이 빨라졌어요.",
        "detail": ["할 일이 많아도 처음 열 때 …"] } ] },
    { "kind": "fixed", "items": [
      { "title": "자잘한 문제를 고쳤어요." } ] }
  ]
}`;
function notes() {
  const d = s.platform === 'desktop';
  const where = d ? { modal: 'PC · 업데이트 후 처음 열었을 때', settings: 'PC · 설정 > 정보' }[s.dscreen] : { modal: '모바일 · 업데이트 후 처음 켰을 때', settings: '모바일 · 설정', history: '모바일 · 설정 > 업데이트 내역' }[s.mscreen];
  return `<div class="notes">
    <div class="now">${where}${(d ? s.dscreen : s.mscreen) === 'modal' ? `<br>· 밀린 업데이트 ${s.behind}개${s.behind >= COLLAPSE_AT ? ' → 접힌 카드' : ''}` : ''}</div>
    <h3>이번 피드백 반영</h3><ul class="fix">
      ${d ? `<li>설정 > 정보: 버전 목록 대신 <b>업데이트 내역</b> 카드 하나. 누르면 최근 ${HISTORY_MAX}개를 보여 줌(몇 개를 건너뛰었는지와 상관없음). 툴바 "내역 열기"로 두 방식 비교.</li>` : ''}
      <li>문구를 사용자 입장으로 다시 씀: 제목은 체감하는 변화 한 문장, 세부 내용은 있을 때만, 한 줄에 한 문장.</li>
      <li>밀린 업데이트가 ${COLLAPSE_AT}개 이상이면 같은 창에서 <b>버전 + 요약 카드</b>만 접어서 보여 줌. 오른쪽 ⌄로 펼침. 툴바 "밀린 업데이트 6개"로 확인.</li>
      <li>아이콘 40 → 48px(120%), 제목 "업데이트를 완료했어요". 버전은 제목 위 작은 글씨로.</li>
      <li>세부 내용 글자 12.5 → 12px, 색을 한 단계 흐리게(라이트 테마에서는 한 단계 밝게).</li>
    </ul>
    <h3>그대로인 것</h3><ul>
      <li>업데이트 후 처음 열 때 한 번만 창을 띄움. "다시 보지 않기" = 설정의 "업데이트 후 변경 내용 보기" 끄기.</li>
      <li>${d ? '새 버전 알림·설치 창, 버전 표시, 업데이트 확인, 베타 토글.' : '모바일 설정 > 정보 > 업데이트 내역 화면 구조.'}</li>
      <li>처음 설치한 경우에는 창을 띄우지 않음. 내역 파일이 없는 과거 버전은 나오지 않음.</li>
    </ul>
    <h3>파일 형식</h3><pre>${JSON_SAMPLE}</pre>
    <ul style="margin-top:8px"><li><code>detail</code>은 빼도 됨. 문장마다 배열 한 칸(= 한 줄).</li>
      <li>작성 규칙(출시 절차에 적어 둠): 사용자가 알아차리는 변화만. 내부 동작·수치·구현 설명은 쓰지 않음.</li></ul>
    <h3 class="q">정할 것</h3><ul class="q">
      ${d ? `<li>PC 업데이트 내역 열기: <b>창으로</b>(업데이트 후 창과 같은 모양) / <b>카드 안에서 펼치기</b>.</li>` : ''}
      <li>최대 ${HISTORY_MAX}개, 접히는 기준 ${COLLAPSE_AT}개 이상 — 이대로 괜찮은지.</li>
      <li>종류 순서: 새 기능 → 개선 → 수정(시안 데이터는 파일에 쓴 순서대로 보여 줌).</li>
    </ul></div>`;
}

function toolbar() {
  const b = (group, value, label) => `<button class="${s[group] === value ? 'on' : ''}" data-set="${group}:${value}">${label}</button>`;
  const lines = [`<div class="line"><strong>플랫폼</strong>${b('platform', 'desktop', 'PC (Windows·mac)')}${b('platform', 'mobile', '모바일 (Android·iOS)')}</div>`];
  if (s.platform === 'desktop') lines.push(`<div class="line"><strong>화면</strong>${b('dscreen', 'modal', '업데이트 후 창')}${b('dscreen', 'settings', '설정 > 정보')}<span class="sep"></span><strong>내역 열기</strong>${b('histMode', 'window', '창으로')}${b('histMode', 'inline', '카드 안에서 펼치기')}<span class="sep"></span><strong>크기</strong>${b('fit', true, '맞춤(62%)')}${b('fit', false, '실제 크기 1440×960')}</div>`);
  else lines.push(`<div class="line"><strong>화면</strong>${b('mscreen', 'modal', '업데이트 후 창')}${b('mscreen', 'settings', '설정')}${b('mscreen', 'history', '설정 > 업데이트 내역')}<span class="sep"></span><strong>테마</strong>${b('theme', 'dark', '다크')}${b('theme', 'light', '라이트')}</div>`);
  lines.push(`<div class="line"><strong>밀린 업데이트</strong>${b('behind', 1, '1개')}${b('behind', 2, '2개')}${b('behind', 6, '6개 (접힘)')}<span class="sep"></span><strong>표시</strong>${b('mark', true, '바뀌는 부분 표시')}${b('mark', false, '표시 끔')}</div>`);
  return lines.join('');
}
function render() {
  document.getElementById('toolbar').innerHTML = toolbar();
  let view;
  if (s.platform === 'desktop') {
    if (s.dscreen === 'modal') view = desktopFrame(desktopModal());
    else view = desktopFrame(desktopSettings(), s.histMode === 'window' && s.histOpen ? desktopHistory() : '');
  } else view = phone();
  const stage = document.getElementById('stage');
  stage.className = 'stage' + (s.mark ? ' mark' : '');
  stage.innerHTML = view + notes();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-go],[data-act],[data-exp]');
  if (!t) return;
  if (t.dataset.set) { const [k, v] = t.dataset.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? Number(v) : v; if (k === 'histMode') s.histOpen = false; }
  if (t.dataset.go === 'dsettings') { s.dscreen = 'settings'; s.histOpen = true; }
  if (t.dataset.go === 'mhistory') s.mscreen = 'history';
  if (t.dataset.go === 'msettings') s.mscreen = 'settings';
  if (t.dataset.act === 'dont') { s.dontShow = !s.dontShow; s.show = !s.dontShow; }
  if (t.dataset.act === 'show') { s.show = !s.show; s.dontShow = !s.show; }
  if (t.dataset.act === 'hist') s.histOpen = !s.histOpen;
  if (t.dataset.act === 'histclose') s.histOpen = false;
  if (t.dataset.exp) { const k = t.dataset.exp; s.exp.has(k) ? s.exp.delete(k) : s.exp.add(k); }
  render();
});
render();
</script>
</body>
</html>

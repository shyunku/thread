<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread 모바일 2.2.0 시작 로딩 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --page: #0b0d10;
    /* apps/mobile/src/ui/theme.tsx (dark). */
    --canvas: #101216; --panel: #15181e; --surface: #1c2028; --hover: #252b36; --border: #2b303b;
    --text: #edf1f7; --secondary: #a0aaba; --muted: #8792a4; --accent: #6294ff; --accent-text: #fff;
    --selected: #253858; --success: #70d5a0; --warning: #edbc72; --danger: #f0838b; --star: #f2c14e;
    /* Theme.AppCompat.DayNight (dark) window background: what Android draws before the app does. */
    --sys-grey: #303030;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--page); color: var(--text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; word-break: keep-all; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }

  /* One screen: the phone at real size (390 × 844), notes on the right at full height. */
  .stage { display: flex; gap: 20px; align-items: flex-start; height: 100%; padding: 16px; }
  .pieces { flex: 1; min-width: 0; height: 100%; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; scrollbar-width: none; }

  .notes { display: flex; flex-direction: column; width: 400px; height: 100%; min-height: 0; flex: none; padding: 14px 0 0; border: 1px solid #2b303b; border-radius: 12px; background: #12151b; color: #a0aaba; font-size: 13px; }
  .notes .n-top { display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; border-bottom: 1px solid #242a35; }
  .notes .n-copy { flex: none; padding: 6px 12px; border: 0; border-radius: 8px; background: #3d6fe0; color: #fff; font-size: 12.5px; font-weight: 600; }
  .notes .n-copy.done { background: #2f9e6a; }
  .notes .hint { margin: 0; color: #8b95a7; font-size: 12px; line-height: 1.45; }
  .notes kbd { padding: 0 4px; border: 1px solid #3a4252; border-radius: 4px; font: inherit; font-size: 11px; color: #cfd6e2; }
  .notes .n-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px; scrollbar-width: thin; scrollbar-color: #2b303b transparent; }
  .notes .n-item { padding: 12px 0 10px; }
  .notes .n-item + .n-item { border-top: 1px solid #2a303c; }
  .notes h4 { margin: 2px 6px 4px; font-size: 13px; color: #edf1f7; font-weight: 600; }
  .notes .n-row { display: grid; gap: 2px; width: 100%; cursor: pointer; margin: 2px 0; padding: 7px 8px; border-radius: 8px; color: #cfd6e2; font-size: 12.5px; }
  .notes .n-row:hover { background: #1c222c; }
  .notes .n-row.on { background: #22324f; color: #fff; }
  .notes .n-nm { font-weight: 600; }
  .notes .n-ds { color: #8b95a7; font-size: 12px; }
  .notes .n-row.on .n-ds { color: #b9c6dc; }
  .notes .n-cm { display: block; margin-top: 6px; width: 100%; min-height: 30px; padding: 5px 8px; border: 1px solid #3a4a66; border-radius: 6px; background: #151b26; color: #edf1f7; font-size: 12.5px; line-height: 1.5; outline: none; resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes .n-cm:focus { border-color: #6fa0ff; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 600; line-height: 17px; vertical-align: 1px; }
  .badge.old { background: #2c323d; color: #aab4c4; }
  .badge.rec { background: #1d4a35; color: #7fe0ae; }
  .notes .n-new { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid #242a35; cursor: pointer; user-select: none; }
  .notes .n-new input { accent-color: #3ddc84; }
  body.show-new .pieces .is-new { outline: 2px solid #3ddc84; outline-offset: -2px; }

  /* The launch player inside item 1. */
  .n-play { margin: 4px 6px 8px; padding: 9px 10px; border: 1px solid #2a303c; border-radius: 9px; background: #161a21; }
  .n-play .n-conds { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .n-play .n-cond { padding: 3px 9px; border: 1px solid #333b49; border-radius: 99px; background: transparent; color: #aab4c4; font-size: 12px; }
  .n-play .n-cond.on { border-color: #4f78c9; background: #22324f; color: #fff; }
  .n-play .n-pl { display: flex; align-items: center; gap: 10px; }
  .n-play .n-launch { flex: none; padding: 5px 12px; border: 0; border-radius: 7px; background: #2b3a57; color: #e3ebff; font-size: 12.5px; font-weight: 600; }
  .n-play .n-launch:hover { background: #34486d; }
  .n-play #pstat { flex: 1; min-width: 0; color: #cfd6e2; font-size: 12px; }
  .n-play #pstat b { color: #f2c14e; font-weight: 600; }
  .n-play .n-trail { margin-top: 6px; color: #8b95a7; font-size: 11.5px; line-height: 1.55; }
  .n-play .n-trail span { white-space: nowrap; }
  .n-play .n-trail i { font-style: normal; color: #5f6878; }

  /* Shift + hover pickers. */
  body.shift-on .pieces .hot { outline: 1px dashed #9aa4b699; outline-offset: -1px; }
  body.shift-on .pieces [data-opts] { outline: 2px dashed #6fa0ff; outline-offset: -3px; }
  .opt-pop { position: fixed; z-index: 500; display: none; min-width: 180px; max-width: 420px; padding: 8px; border: 1px solid #3a5486; border-radius: 10px; background: #161b24f5; box-shadow: 0 12px 32px #000b; font-size: 12.5px; color: #cfd6e2; }
  .opt-pop.on { display: block; }
  .opt-pop b { display: block; margin: 0 4px 6px; font-size: 11.5px; color: #8b95a7; font-weight: 600; }
  .opt-pop button { display: block; width: 100%; margin: 2px 0; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; text-align: left; }
  .opt-pop button:hover { background: #232a37; }
  .opt-pop button.on { background: #253858; color: #fff; }

  /* ---------- Phone: 390 × 844 logical px, Android edge to edge, gesture navigation ---------- */
  .phone, .phone button { font-family: "Noto Sans KR", Pretendard, "Malgun Gothic", sans-serif; }
  .phone { position: relative; box-sizing: content-box; flex: none; width: 390px; height: 844px; border: 10px solid #23272f; border-radius: 44px; background: var(--canvas); color: var(--text); overflow: hidden; font-size: 14px; line-height: 1.4; user-select: none; }
  :where(.phone) :where(button) { appearance: none; margin: 0; padding: 0; border: 0; background: none; text-align: left; }
  .status { position: absolute; top: 0; left: 0; right: 0; z-index: 40; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; color: var(--secondary); pointer-events: none; }
  .status.light { color: #fff; }
  .gesture { position: absolute; bottom: 8px; left: 50%; width: 110px; height: 4px; margin-left: -55px; border-radius: 4px; background: var(--muted); opacity: .6; z-index: 60; pointer-events: none; }
  #screen { position: absolute; inset: 0; }
  .full { position: absolute; inset: 0; }

  /* Home screen (launcher). */
  .home { background: radial-gradient(120% 80% at 20% 0%, #2d4a7a 0%, #141c2c 55%, #0c0f15 100%); }
  .h-clock { margin-top: 110px; text-align: center; color: #fff; font-size: 64px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
  .h-date { margin-top: 8px; text-align: center; color: #d6deeb; font-size: 14px; }
  .h-grid { position: absolute; left: 18px; right: 18px; bottom: 118px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 22px; }
  .h-app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #e8ecf3; font-size: 12px; }
  .h-ic { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .h-ic.thr { background: #fff; cursor: pointer; }
  .h-ic.thr img { width: 64%; }
  .h-dock { position: absolute; left: 30px; right: 30px; bottom: 34px; height: 62px; border-radius: 31px; background: #ffffff1a; }

  /* Android system splash (before the app's code runs). */
  .sys-old { background: var(--sys-grey); }
  .sys-old .circ { position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .sys-old .circ img { width: 64%; }
  .grey { background: var(--sys-grey); }
  /* The logo sits at the same place on the splash and on the app's loading screen. */
  .logo-c { position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; margin: -64px 0 0 -64px; }
  .w-spin { position: absolute; left: 50%; top: calc(50% + 96px); margin-left: -12px; }
  .w-txt { position: absolute; left: 24px; right: 24px; top: calc(50% + 134px); text-align: center; color: var(--muted); font-size: 13px; }
  .w-msg { position: absolute; left: 24px; right: 24px; top: calc(50% + 160px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .w-msg p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  .w-msg.sk { top: auto; bottom: 120px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: 0 10px 28px #0008; }

  /* ActivityIndicator (Android). */
  .spin-i { width: 24px; height: 24px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: rot .75s linear infinite; }
  .spin-i.sm { width: 20px; height: 20px; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* Buttons (ui/kit.tsx Button). */
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; margin: 0 18px 10px; padding: 0 16px; border: 1px solid transparent !important; border-radius: 14px; font-size: 15px; font-weight: 600; text-align: center !important; cursor: pointer; }
  .btn.pri { background: var(--accent) !important; color: var(--accent-text); }
  .btn.def { background: var(--surface) !important; border-color: var(--border) !important; color: var(--text); margin: 0; }
  .btn.ghost { color: var(--secondary); }

  /* Lock screen (screens/setup/LockScreen.tsx). */
  .lock { padding-top: 36px; background: var(--canvas); }
  .lk-top { display: flex; flex-direction: column; align-items: center; padding: 140px 24px 30px; }
  .lk-ic { width: 84px; height: 84px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 26px; background: var(--surface); display: grid; place-items: center; color: var(--warning); }
  .lk-t { margin-bottom: 6px; font-size: 24px; font-weight: 700; }
  .lk-b { color: var(--muted); font-size: 15px; }
  .err { margin: 0 20px 10px; color: var(--danger); font-size: 13px; }
  /* BiometricPrompt. */
  .scrim { position: absolute; inset: 0; z-index: 45; background: #0009; }
  .bio { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 46; padding: 26px 24px 16px; border-radius: 28px; background: #2a2e36; text-align: center; }
  .bio h5 { margin: 0 0 6px; font-size: 20px; font-weight: 500; }
  .bio p { margin: 0; color: var(--secondary); font-size: 14px; }
  .bio .fp { width: 72px; height: 72px; margin: 26px auto 10px; border-radius: 50%; display: grid; place-items: center; color: #8ab4f8; border: 2px solid #8ab4f855; cursor: pointer; }
  .bio .fp:hover { background: #8ab4f81a; }
  .bio .h { color: var(--muted); font-size: 13px; }
  .bio .bt { display: flex; justify-content: flex-start; margin-top: 18px; }
  .bio .bt button { height: 40px; padding: 0 14px; border-radius: 20px; color: #8ab4f8; font-size: 14px; font-weight: 600; }

  /* Task list (screens/app/TasksScreen.tsx). */
  .app { padding-top: 36px; display: flex; flex-direction: column; background: var(--canvas); }
  .abar { flex: none; display: flex; align-items: center; gap: 6px; min-height: 56px; padding: 8px 10px 0 18px; }
  .abar .t { font-size: 22px; font-weight: 700; }
  .cnt { padding: 1px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--secondary); font-size: 13px; font-weight: 600; }
  .abar .chev { color: var(--muted); }
  .abar .sr { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; color: var(--secondary); }
  .sline { flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 18px 10px; color: var(--muted); font-size: 12px; }
  .sline i { width: 6px; height: 6px; border-radius: 3px; flex: none; }
  .chips { flex: none; display: flex; gap: 6px; padding: 0 18px 6px; overflow: hidden; }
  .chip { flex: none; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--secondary); font-size: 13px; white-space: nowrap; }
  .chip.on { border-color: var(--accent); background: var(--selected); color: var(--text); }
  .lst { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .sh { display: flex; align-items: center; gap: 8px; padding: 14px 18px 8px; color: var(--secondary); font-size: 13px; font-weight: 600; }
  .sh .tri { color: var(--muted); font-size: 9px; }
  .card { display: flex; align-items: center; gap: 12px; margin: 0 12px 8px; padding: 13px 8px 13px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .card .ck { width: 22px; height: 22px; flex: none; border: 2px solid var(--muted); border-radius: 50%; }
  .card .nm { font-size: 15px; font-weight: 600; }
  .card .meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .card .meta i { width: 7px; height: 7px; border-radius: 4px; }
  .card .meta .late { color: var(--danger); }
  .card.chg, .sh.chg { animation: chg 1.8s ease-out; }
  @keyframes chg { 0%, 30% { background: #27406b; border-color: #4f78c9; } 100% { } }
  .empty-msg { position: absolute; top: 120px; left: 0; right: 0; text-align: center; color: var(--muted); }
  .fab { position: absolute; right: 18px; bottom: 104px; z-index: 5; width: 60px; height: 60px; border-radius: 18px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px #0008; }
  .fab.off { opacity: .45; }
  .tabs { flex: none; display: flex; height: 86px; padding: 6px 0 24px; border-top: 1px solid var(--border); background: var(--panel); }
  .tab { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .tab.on { color: var(--accent); font-weight: 700; }
  .tab.on::before { content: ""; position: absolute; top: -6px; left: 50%; width: 28px; height: 3px; margin-left: -14px; border-radius: 0 0 3px 3px; background: var(--accent); }
  /* The PC's loading cover (molecules/Loading.js): blurred app under a dark layer. */
  .pcov { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0006; backdrop-filter: blur(5px); color: var(--text); font-size: 14px; }

  /* Skeleton. */
  .sk-bar { display: block; border-radius: 6px; background: linear-gradient(90deg, #1a1e25 0%, #252a33 40%, #1a1e25 80%) 0 0 / 300% 100%; animation: shim 1.4s linear infinite; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .sk-card { display: flex; align-items: center; gap: 12px; margin: 0 12px 8px; padding: 15px 14px; border: 1px solid #20242c; border-radius: 14px; background: #15181e; }
</style>
</head>

    <div class="status" id="status"><span>9:41</span><span>▂▄▆ ◔ ▮</span></div>
    <div id="screen"></div>
    <div class="gesture"></div>
  </div></div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="opt-pop" id="optpop"></div>

// ---------- Launch conditions ----------
// resume: the silent reopen of the vault (Keystore + DB). sync: the first sync after unlocking.
const COND = {
  normal: { label: '보통', resume: 450, sync: 1500 },
  slow: { label: '동기화 느림', resume: 450, sync: 9000 },
  offline: { label: '오프라인', resume: 450, fail: 800 },
  reboot: { label: '재부팅 뒤 첫 실행', resume: 300, locked: true, sync: 1500 },
  fresh: { label: '처음 연결 직후', fresh: true, sync: 2500 },
};
const WAIT_LIMIT = 5000;

// ---------- State ----------
const s = { look: 'logo', when: 'every', slow: 'timeout', splash: 'logo', cond: 'normal', showNew: false };
let v = { scr: 'home' };       // what the phone shows
let rt = {};                   // the running launch
let vt = 0, runId = 0, trail = [], manual = false, shiftOn = false;
const waiters = [];
const STALE = {};
const fire = () => { for (const w of [...waiters]) if (w.f()) { waiters.splice(waiters.indexOf(w), 1); w.r(); } };
const until = f => new Promise(r => { waiters.push({ f, r }); });
const sleep = ms => { const end = vt + ms; return until(() => vt >= end); };
setInterval(() => { if (manual || shiftOn) return statusLine(); vt += 50; fire(); statusLine(); }, 50);

function show(view, label) {
  v = view;
  if (label) trail.push([vt, label]);
  renderPhone(); statusLine();
}
async function launch(seek) {
  const my = ++runId;
  waiters.length = 0; vt = 0; trail = [];
  const prev = rt;
  rt = { unlocked: false, prompt: false, openNow: false, unlockAt: null, openAt: null, endAt: null, need: '' };
  if (seek) { rt.seekUnlock = prev.unlockAt; rt.seekOpen = prev.openAt; }
  const C = COND[s.cond], old = s.look === 'old';
  const chk = () => { if (my !== runId) throw STALE; };
  const sl = async ms => { await sleep(ms); chk(); };
  const un = async f => { await until(f); chk(); };
  const end = () => { rt.endAt = vt; rt.need = ''; statusLine(); };
  const unlocked = () => rt.unlocked || (rt.seekUnlock != null && vt >= rt.seekUnlock);
  const opened = () => rt.openNow || (rt.seekOpen != null && vt >= rt.seekOpen);
  try {
    if (seek) seekTo(my, seek);
    if (!C.fresh) {
      show({ scr: 'home' }, '홈 화면에서 Thread 누름'); await sl(600);
      // 1. Android draws its splash and the window background before the app's code runs.
      if (s.splash === 'old') { show({ scr: 'sysOld' }, '시스템 스플래시'); await sl(450); show({ scr: 'grey' }, '회색 빈 화면'); await sl(250); }
      else { show({ scr: 'sysNew' }, '시스템 스플래시(로고)'); await sl(700); }
      // 2. Account restore, then the silent resume of the vault.
      if (old) {
        show({ scr: 'spin' }, '스피너'); await sl(300);
        show({ scr: 'lock', err: true }, '잠금 화면 + 빨간 오류'); await sl(C.resume);
      } else {
        show({ scr: 'wait', stage: 'open' }, '로딩 화면 (잠금 여는 중)'); await sl(300 + C.resume);
      }
      // 3. After a reboot the resume fails: the lock screen, then biometrics.
      if (C.locked) {
        if (old) show({ scr: 'lock', err: true }, '잠금 화면 · 빨간 오류가 남음, 인증 창 안 뜸');
        else { rt.prompt = true; show({ scr: 'lock', err: false }, '잠금 화면 + 인증 창 자동'); }
        rt.need = '지문 아이콘을 눌러 잠금 해제';
        await un(unlocked);
        rt.unlocked = true; rt.unlockAt = vt; rt.prompt = false; rt.need = '';
      }
    }
    // 4. Unlocked: the first sync starts.
    const t0 = vt;
    const done = () => C.sync != null && vt - t0 >= C.sync;
    const failed = () => C.fail != null && vt - t0 >= C.fail;
    const wait = !old && (s.when === 'every' || (s.when === 'first' && C.fresh));
    const openList = (data, line, label, extra = {}) => show({ scr: 'list', data, line, ...extra }, label);
    if (!wait) {
      if (C.fresh) openList('empty', 'syncing', old ? '빈 목록 + "처음 동기화를 기다리는 중…"' : '빈 목록 (저장된 데이터 없음)');
      else openList('stored', 'syncing', '저장된 목록 + 동기화 중');
      await un(() => done() || failed());
      if (done()) openList('synced', 'synced', '동기화 끝 → 목록이 바뀜', { flash: true });
      else openList(v.data, 'offline', '동기화 실패 → 오프라인');
      return end();
    }
    show({ scr: 'wait', stage: 'sync' }, '로딩 화면 (동기화 기다림)');
    await un(() => done() || failed() || (!C.fresh && vt - t0 >= WAIT_LIMIT));
    if (done()) { openList('synced', 'synced', '동기화 끝 → 목록'); return end(); }
    if (failed()) {
      if (s.slow === 'timeout' || s.slow === 'pc') { openList('stored', 'offline', '연결 실패 → 바로 저장된 목록 + 오프라인'); return end(); }
      show({ scr: 'wait', stage: 'offline' }, '연결 실패 · 계속 다시 시도');
      if (s.slow === 'none') { rt.need = '연결될 때까지 안 열림'; rt.endAt = vt; return statusLine(); }
      await un(() => vt - t0 >= WAIT_LIMIT);
      show({ scr: 'wait', stage: 'offline', btn: true }, '5초 → "저장된 데이터로 열기" 버튼');
      rt.need = '버튼을 눌러 열기';
      await un(opened);
      rt.openAt = vt; openList('stored', 'offline', '저장된 목록 + 오프라인'); return end();
    }
    // Still syncing after 5 s.
    if (s.slow === 'timeout') openList('stored', 'syncing', '5초 → 저장된 목록 + 동기화 중');
    else if (s.slow === 'pc') openList('stored', 'syncing', '5초 → 흐린 목록 + 가림막', { pc: true });
    else if (s.slow === 'button') {
      show({ scr: 'wait', stage: 'sync', btn: true }, '5초 → "저장된 데이터로 열기" 버튼');
      rt.need = '버튼을 누르거나 기다리기';
      await un(() => done() || opened());
      rt.need = '';
      if (done()) { openList('synced', 'synced', '동기화 끝 → 목록'); return end(); }
      rt.openAt = vt; openList('stored', 'syncing', '저장된 목록 + 동기화 중');
    } else { await un(done); openList('synced', 'synced', '동기화 끝 → 목록'); return end(); }
    await un(done);
    openList('synced', 'synced', v.pc ? '동기화 끝 → 가림막 걷힘' : '동기화 끝 → 목록이 바뀜', { flash: !v.pc });
    end();
  } catch (e) { if (e !== STALE) throw e; }
}
// Replays to the same moment (an option changed mid-launch): fast virtual time.
async function seekTo(my, target) {
  const was = manual; manual = true;
  for (let n = 0; n < 2000 && vt < target && my === runId; n++) { vt += 50; fire(); for (let i = 0; i < 20; i++) await null; }
  if (my === runId) manual = was;
}
function relaunch(keep) {
  if (v.scr === 'home' && !keep) return;
  let target = 0;
  if (keep) target = rt.endAt != null ? rt.endAt : Math.min(vt, 15000);
  launch(keep ? target : 0);
}

  return `<div class="n-top"><button class="n-copy" data-ncopy>결과 복사</button><p class="hint">정할 것은 모두 정했어요. 확정된 모습이에요.</p></div>
    <div class="n-scroll"><section class="n-item">${playBox()}</section></div>
    <label class="n-new"><input type="checkbox" data-nnew ${s.showNew ? 'checked' : ''}>새로 생기는 부분 표시</label>`;
}
const grow = el => { const box = el.closest('.n-scroll'), top = box ? box.scrollTop : 0; el.style.height = 'auto'; el.style.height = el.scrollHeight + (el.offsetHeight - el.clientHeight) + 'px'; if (box) box.scrollTop = top; };
function renderNotes() {
  const a = document.activeElement, cm = a && a.dataset && a.dataset.cm ? [a.dataset.cm, a.selectionStart, a.selectionEnd] : null;
  const top = document.querySelector('.n-scroll')?.scrollTop ?? 0;
  document.getElementById('notes').innerHTML = notes();
  document.querySelectorAll('.n-cm').forEach(grow);
  const sc = document.querySelector('.n-scroll'); if (sc) sc.scrollTop = top;
  if (cm) { const el = document.querySelector(`.n-cm[data-cm="${cm[0]}"]`); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(cm[1], cm[2]); } catch (e) {} } }
  document.body.classList.toggle('show-new', s.showNew);
  statusLine();
}

// ---------- Phone events ----------
const phone = document.getElementById('phone');
phone.addEventListener('click', e => {
  if (e.target.closest('.opt-pop') || shiftOn) return;
  const a = e.target.closest('[data-act]'); if (!a) return;
  const k = a.dataset.act;
  if (k === 'launch') return launch(0);
  if (k === 'bio') { rt.prompt = true; renderPhone(); }
  else if (k === 'cancel') { rt.prompt = false; renderPhone(); }
  else if (k === 'unlock') { rt.unlocked = true; fire(); }
  else if (k === 'open') { rt.openNow = true; fire(); }
});

// ---------- Shift + hover pickers and the notes ----------
const choose = (o, val) => { s[o.key] = val; renderNotes(); relaunch(true); };
function markHot() {
  document.querySelectorAll('.pieces .hot').forEach(el => el.classList.remove('hot'));
  document.querySelectorAll('.pieces [data-opts]').forEach(el => delete el.dataset.opts);
  OPTS.forEach((o, i) => document.querySelectorAll(o.at).forEach(el => { if (!el.dataset.opts && el.closest('.pieces')) el.dataset.opts = i; }));
  if (!shiftOn) return;
  document.querySelectorAll('.phone [data-act]').forEach(el => { if (!el.dataset.opts && !el.classList.contains('scrim')) el.classList.add('hot'); });
}
// Shift + hover opens the candidates where the mouse is; it stays open when the mouse moves onto
// it or Shift is released; a click elsewhere, Esc or another area closes it.
const optPop = document.getElementById('optpop');
let optAt = null;
const hideOpt = () => { optPop.classList.remove('on'); optAt = null; };
function showOpt(el, x, y) {
  const i = +el.dataset.opts, o = OPTS[i]; optAt = el;
  optPop.innerHTML = '<b>' + o.title + '</b>' + o.items.map(it => '<button class="' + (s[o.key] === it[0] ? 'on' : '') + '" data-v="' + it[0] + '">' + it[1] + tags(it) + '</button>').join('');
  optPop.dataset.o = i; optPop.classList.add('on');
  const w = optPop.offsetWidth, h = optPop.offsetHeight;
  optPop.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - 12)) + 'px';
  optPop.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - 12)) + 'px';
}
(() => {
  const setShift = on => { if (shiftOn === on) return; shiftOn = on; document.body.classList.toggle('shift-on', on); markHot(); statusLine(); };
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setShift(true); if (e.key === 'Escape') hideOpt(); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setShift(false); });
  window.addEventListener('blur', () => setShift(false));
  document.addEventListener('mousemove', e => {
    if (!e.shiftKey || optPop.contains(e.target)) return;
    if (!shiftOn) setShift(true);
    const el = e.target.closest && e.target.closest('.pieces [data-opts]');
    if (el && el !== optAt) showOpt(el, e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', e => { if (optAt && !optPop.contains(e.target)) hideOpt(); }, true);
  optPop.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    const i = +optPop.dataset.o, x = parseFloat(optPop.style.left) + 12, y = parseFloat(optPop.style.top) + 12;
    choose(OPTS[i], b.dataset.v);
    // The replay reaches the same moment shortly; reopen over the same area if it is there.
    setTimeout(() => { const el = document.querySelector('.pieces [data-opts="' + i + '"]'); if (el) showOpt(el, x, y); else hideOpt(); }, 120);
  });
})();
document.addEventListener('input', e => { if (e.target.matches('.n-cm')) { comments[e.target.dataset.cm] = e.target.value; grow(e.target); } });
document.addEventListener('click', e => {
  if (e.target.closest('[data-launch]')) return launch(0);
  const c = e.target.closest('[data-cond]');
  if (c) { s.cond = c.dataset.cond; renderNotes(); return launch(0); }
  if (e.target.closest('.n-cm')) return;
  const row = e.target.closest('.n-row');
  if (!row) return;
  const o = OPTS[+row.dataset.no];
  if (!row.classList.contains('on')) choose(o, row.dataset.v);
  const f = document.querySelector(`.n-cm[data-cm="${row.dataset.no}:${row.dataset.v}"]`);
  if (f) { f.focus({ preventScroll: true }); f.setSelectionRange(f.value.length, f.value.length); }
});
function resultText() {
  return '모바일 2.2.0 시작 로딩 시안 (확정)\n' + FINAL.map(([t, v], i) => `${i + 1}. ${t}: ${v}`).join('\n');
}
document.addEventListener('click', e => {
  const copy = e.target.closest('[data-ncopy]');
  if (!copy) return;
  const text = resultText();
  const done = () => { copy.textContent = '복사됨'; copy.classList.add('done'); setTimeout(() => { copy.textContent = '결과 복사'; copy.classList.remove('done'); }, 1400); };
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
});
document.addEventListener('change', e => { if (e.target.matches('[data-nnew]')) { s.showNew = e.target.checked; renderNotes(); } });

// For the capture script: fixed time instead of the running clock.
window.mock = {
  s, get v() { return v; }, get rt() { return rt; },
  manual(on) { manual = on; },
  async play(opts, ms, act) {
    Object.assign(s, opts); renderNotes(); manual = true;
    launch(0);
    await new Promise(r => setTimeout(r, 0));
    const my = runId;
    for (let n = 0; n < 2000 && vt < ms && my === runId; n++) {
      if (act && act.at != null && vt >= act.at && !act.did) { act.did = true; rt[act.key] = true; }
      vt += 50; fire(); for (let i = 0; i < 20; i++) await null;
    }
    statusLine();
    return { scr: v.scr, trail: trail.map(t => t[1]) };
  },
};
renderNotes();
renderPhone();
launch(0);
</script>
</body>
</html>

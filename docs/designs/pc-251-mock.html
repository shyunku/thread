<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread PC 2.5.1 시안 (#107)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* Oxanium with the vertical metrics the app uses (fonts.scss), so Korean from Noto Sans KR sits centred. */
  @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 300 700; font-display: swap;
    ascent-override: 95%; descent-override: 5%; line-gap-override: 0%;
    src: url(https://fonts.gstatic.com/s/oxanium/v21/RrQQboN_4yJ0JmiMe2zE0YBB.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 300 700; font-display: swap;
    ascent-override: 95%; descent-override: 5%; line-gap-override: 0%;
    src: url(https://fonts.gstatic.com/s/oxanium/v21/RrQQboN_4yJ0JmiMe2LE0Q.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --page: #0b0d10;
    /* apps/desktop/src/styles/index.scss with the main-screen (.main-scope) values. */
    --canvas: #101216; --panel: #14171d; --surface: #1a1e25; --hover: #1d2129; --border: #2b303b;
    --text: #edf1f7; --secondary: #a3acbb; --muted: #7f8a9c; --accent: #6294ff; --selected: #253858;
    --success: #70d5a0; --warning: #edbc72; --danger: #f0838b;
    --raise: #222731; --line: #232831; --faint: #5f697a; --accent-soft: #1b2741; --star: #f2c14e;
    --side-x: 20px; --main-x: 40px; --row-x: 22px; --ck: 20px; --ck-gap: 12px; --panel-x: 20px; --in: 12px;
    --gw: 20px; /* subtask grip gutter (item 1) */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }

  /* One screen: the main window at real size, notes on the right at full height. */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .stage { display: flex; gap: 28px; align-items: flex-start; height: 100%; padding: 24px; }
  .pieces { display: flex; gap: 28px; align-items: flex-start; flex: none; }

  .notes { display: flex; flex-direction: column; width: 400px; height: 100%; min-height: 0; flex: none; padding: 14px 0 0; border: 1px solid #2b303b; border-radius: 12px; background: #12151b; color: #a0aaba; font-size: 13px; }
  .notes .n-top { display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; border-bottom: 1px solid #242a35; }
  .notes .n-copy { flex: none; padding: 6px 12px; border: 0; border-radius: 8px; background: #3d6fe0; color: #fff; font-size: 12.5px; font-weight: 600; }
  .notes .n-copy.done { background: #2f9e6a; }
  .notes .hint { margin: 0; color: #8b95a7; font-size: 12px; line-height: 1.45; }
  .notes kbd { padding: 0 4px; border: 1px solid #3a4252; border-radius: 4px; font: inherit; font-size: 11px; color: #cfd6e2; }
  .notes .n-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px; }
  .notes .n-item { padding: 12px 0 10px; }
  .notes .n-item + .n-item { border-top: 1px solid #2a303c; }
  .notes h4 { margin: 2px 6px 4px; font-size: 13px; color: #edf1f7; font-weight: 600; }
  .notes .n-why { margin: 0 6px 6px; color: #8b95a7; font-size: 12px; line-height: 1.5; }
  .notes .n-row { display: grid; grid-template-columns: 1fr; gap: 2px; width: 100%; cursor: pointer; margin: 2px 0; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: #cfd6e2; text-align: left; font-size: 12.5px; }
  .notes .n-row:hover { background: #1c222c; }
  .notes .n-row.on { background: #22324f; color: #fff; }
  .notes .n-nm { font-weight: 600; }
  .notes .n-ds { color: #8b95a7; font-size: 12px; }
  .notes .n-row.on .n-ds { color: #b9c6dc; }
  .notes .n-cm { display: block; margin-top: 6px; width: 100%; min-height: 30px; padding: 5px 8px; border: 1px solid #3a4a66; border-radius: 6px; background: #151b26; color: #edf1f7; font-size: 12.5px; line-height: 1.5; outline: none; cursor: text; resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes .n-cm:focus { border-color: #6fa0ff; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 600; line-height: 17px; vertical-align: 1px; }
  .badge.old { background: #2c323d; color: #aab4c4; }
  .badge.rec { background: #1d4a35; color: #7fe0ae; }
  .notes .n-new { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid #242a35; cursor: pointer; user-select: none; }
  .notes .n-new input { accent-color: #3ddc84; }
  body.show-new .win :is(.undo-toast, .memo-foot, .rp-subt.wrapped .nm, .rp-sub-in.ml) { outline: 2px solid #3ddc84; outline-offset: 1px; }

  /* Shift + hover pickers (same as pc-250-mock.html). */
  body.shift-on .win .hot { outline: 1px dashed #9aa4b699; outline-offset: -1px; }
  body.shift-on .win [data-opts] { outline: 2px dashed #6fa0ff; outline-offset: -2px; }
  body.shift-on .win .ck.hot { outline-offset: 2px; }
  body.shift-on .win .rp-subt[data-sid] .sgrip { display: grid; }
  body.shift-on .win :is(.dlg-wrap, .tp-scrim) { pointer-events: none; }
  body.shift-on .win .tp-dialog { pointer-events: auto; }
  .opt-pop { position: fixed; z-index: 500; display: none; min-width: 180px; max-width: 420px; padding: 8px; border: 1px solid #3a5486; border-radius: 10px; background: #161b24f5; box-shadow: 0 12px 32px #000b; font-size: 12.5px; color: #cfd6e2; }
  .opt-pop.on { display: block; }
  .opt-pop b { display: block; margin: 0 4px 6px; font-size: 11.5px; color: #8b95a7; font-weight: 600; }
  .opt-pop button { display: block; width: 100%; margin: 2px 0; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .opt-pop button:hover { background: #232a37; }
  .opt-pop button.on { background: #253858; color: #fff; }

  /* App tooltip (Tooltip.scss). .wrap: the full subtask name (item 2 "마우스 올리면 전체 이름"). */
  .thread-tooltip { position: fixed; z-index: 400; padding: 6px 9px; border: 1px solid #46536a; border-radius: 6px; background: #101720; color: #edf1f7; font: 12px/1.4 "Oxanium", "Noto Sans KR", sans-serif; white-space: nowrap; pointer-events: none; display: none; }
  .thread-tooltip.on { display: block; }
  .thread-tooltip.demo { position: absolute; display: block; }
  .thread-tooltip.wrap { white-space: normal; max-width: 300px; word-break: keep-all; overflow-wrap: anywhere; }

  /* ---------- Window ---------- */
  .win, .win button, .win input, .win textarea { font-family: "Oxanium", "Noto Sans KR", sans-serif; }
  .win { position: relative; display: flex; flex-direction: column; border: 1px solid #2b303b; border-radius: 10px; overflow: hidden; background: var(--canvas); color: var(--text); flex: none; word-break: keep-all; overflow-wrap: break-word; font-size: 14px; line-height: 1.5; }
  .win button { appearance: none; margin: 0; padding: 0; border: 0; background: none; text-align: left; }

  .top { height: 42px; flex: none; display: flex; align-items: center; background: #13161b; border-bottom: 1px solid var(--border); position: relative; }
  .top .brand { display: flex; align-items: center; gap: 9px; padding: 0 12px; }
  .top .brand img { width: 26px; height: 26px; object-fit: contain; }
  .top .ver { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .top .search { position: absolute; left: 50%; transform: translateX(-50%); width: 470px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--secondary); font-size: 12px; }
  .top .search .ph { flex: 1; color: var(--muted); }
  .top kbd { font: inherit; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; line-height: 1; }
  .top .lock { position: absolute; top: 7px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: #7da8ff; background: #6294ff24; cursor: pointer; }
  .top .wc { display: flex; align-self: stretch; margin-left: auto; }
  .top .wc span { width: 44px; display: grid; place-items: center; color: var(--secondary); }
  .body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* Sidebar (LeftSidebar.scss, Clock.scss). */
  .side { position: relative; width: 232px; flex: none; display: flex; flex-direction: column; background: var(--panel); padding: 12px calc(var(--side-x) - 10px) 10px; overflow: hidden; }
  .side-clock { flex: none; margin: 0 0 14px; padding: 12px 14px 9px; border-radius: 10px; background: var(--surface); }
  .side-clock .cd { display: block; font-size: 12px; line-height: 18px; color: var(--muted); white-space: nowrap; }
  .side-clock b { display: block; margin-top: 6px; font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
  .side-clock b small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 1px; }
  .side-scroll { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .grp { display: flex; align-items: center; flex: none; height: 28px; margin-top: 16px; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .grp-add { margin-left: auto; width: 16px; height: 28px; display: grid; justify-items: end; align-items: center; cursor: pointer; }
  .side-row { display: flex; align-items: center; flex: none; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--secondary); font-size: 13.5px; white-space: nowrap; cursor: pointer; position: relative; user-select: none; }
  .side-row:hover { background: var(--hover); }
  .side-row.on { background: var(--raise); color: var(--text); }
  .side-row .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .side-row.on .ic { color: var(--text); }
  .side-row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .side-row .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 16px; text-align: right; }
  .side-row .n.due { color: var(--danger); }
  .side-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .side-row.cat-row { gap: 7px; }
  .side .foot { flex: none; margin: 0 calc(10px - var(--side-x)) -10px; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 var(--side-x); border-top: 1px solid var(--line); background: #0e1014; }
  .side .foot .av-w { position: relative; flex: none; display: grid; }
  .side .foot .av { width: 32px; height: 32px; border-radius: 50%; background: #2a3242; display: grid; place-items: center; font-size: 13px; color: var(--secondary); }
  .side .foot .sync-dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 2px #0e1014; }
  .side .foot .who { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.3; }
  .side .foot .who .name { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
  .side .foot .who small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .foot .gear { width: 28px; height: 28px; margin-right: -5px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); cursor: pointer; }

  /* List pane (TodoContent.scss, TaskListView.scss, TaskRow.scss). */
  .tc { position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: hidden; }
  .tc-head { flex: none; padding: var(--main-x) var(--main-x) 0; }
  .tc-row1 { display: flex; align-items: center; gap: 8px; height: 32px; }
  .tc-title { margin: 0; font-size: 22px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .tc-finding { margin: 2px 0 0; font-size: 13px; line-height: 20px; color: var(--secondary); white-space: nowrap; }
  .tc-finding b { color: var(--danger); font-weight: 600; }
  .tc-push { margin-left: auto; }
  .tc-seg { display: flex; gap: 2px; height: 32px; padding: 2px; border-radius: 8px; background: var(--surface); }
  .tc-seg span { display: grid; place-items: center; width: 32px; border-radius: 6px; color: var(--secondary); cursor: pointer; }
  .tc-seg span.on { background: var(--raise); color: var(--text); }
  .tc-ghost { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--secondary); cursor: pointer; }
  .tc-ghost:hover { background: var(--hover); }
  .tc-row1 > .tc-ghost:last-child { margin-right: -8px; }
  .tc-scroll { flex: 1; min-height: 0; overflow: hidden; padding: 12px var(--main-x) 0; }
  .tl-sec { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; margin-top: 20px; padding: 0 var(--row-x) 0 0; font-size: 13.5px; font-weight: 700; color: var(--text); cursor: pointer; }
  .tl-group:first-child > .tl-sec { margin-top: 4px; }
  .tl-sec .tl-c { min-width: 22px; height: 20px; padding: 2px 7px 0; display: grid; place-items: center; border-radius: 10px; background: var(--raise); color: var(--secondary); font-size: 11.5px; font-weight: 600; }
  .tl-sec .tl-tog { margin-left: auto; width: 28px; height: 28px; margin-right: -6px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .tl-sec.over { color: var(--danger); }
  .tl-sec.over .tl-c { background: #3a2226; color: var(--danger); }
  .tl-box { border-radius: 10px; background: var(--surface); overflow: hidden; }
  .task-row { display: flex; align-items: flex-start; gap: var(--ck-gap); min-height: 64px; padding: 12px var(--row-x); cursor: pointer; position: relative; }
  .task-row:hover { background: var(--raise); }
  .task-row.sel { background: var(--accent-soft); }
  .task-row + .task-row::before { content: ""; position: absolute; left: calc(14px + var(--ck) + var(--ck-gap)); right: 14px; top: 0; height: 1px; background: var(--line); }
  .task-row.sel::before, .task-row.sel + .task-row::before { display: none; }
  .ck { width: var(--ck); height: var(--ck); flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid #5a6475 !important; color: #fff; cursor: pointer; }
  .ck svg { opacity: 0; }
  .ck:not(.done):hover { border-color: var(--accent) !important; background: #6294ff1f !important; color: var(--accent); }
  .ck:not(.done):hover svg { opacity: .7; }
  .ck.done { background: var(--accent) !important; border-color: var(--accent) !important; }
  .ck.done svg { opacity: 1; }
  .task-row > .ck { align-self: center; }
  .task-row .tx { flex: 1; min-width: 0; }
  .task-row .t { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row.done .t { color: var(--muted); text-decoration: line-through; }
  .task-row .meta { display: flex; align-items: center; gap: 12px; margin-top: 2px; height: 18px; font-size: 12px; line-height: 18px; color: var(--muted); white-space: nowrap; }
  .task-row .meta > span { display: inline-flex; align-items: center; gap: 5px; }
  .task-row .meta i { font-style: normal; }
  .task-row .meta .dot { width: 7px; height: 7px; border-radius: 50%; }
  .task-row .meta b { font-weight: 400; }
  .task-row .rcol { min-width: 112px; flex: none; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .task-row .rcol .when { display: block; font-size: 13px; line-height: 20px; color: var(--secondary); }
  .task-row .rcol .left { display: block; font-size: 12px; line-height: 18px; margin-top: 2px; color: var(--muted); }
  .task-row .rcol .when.over { color: var(--danger); } .task-row .rcol .left.over { color: #cf7a81; }
  .st { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 7px; color: #4d5666; cursor: pointer; }
  .st.on { color: var(--star); }
  .task-row > .st { margin: 0 -6px 0 0; align-self: center; }

  /* Quick add (QuickAdd.scss). */
  .tc-quick { flex: none; margin: 12px var(--main-x) var(--main-x); padding: 0 22px; border-radius: 10px; background: var(--surface); position: relative; }
  .qa-in { display: flex; align-items: center; gap: var(--ck-gap); height: 44px; color: var(--muted); font-size: 13.5px; }
  .qa-plus { width: var(--ck); height: var(--ck); display: grid; place-items: center; color: var(--accent); flex: none; }
  .qa-in input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: none; color: var(--text); font-size: 13.5px; }
  .qa-in input::placeholder { color: var(--muted); }
  .qa-in kbd { font: inherit; font-size: 11px; line-height: 1; color: var(--muted); border: 1px solid #2b303b; border-radius: 4px; padding: 3px 5px; }
  .qa-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 12px calc(var(--ck) + var(--ck-gap)); }
  .qa-chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--raise) !important; color: var(--secondary); font-size: 12px; white-space: nowrap; cursor: pointer; }
  .qa-chip:hover { background: #2d3442 !important; color: var(--text); }
  .qa-chip .qa-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* Right panel (Home.layout.scss, RightPanel.scss). */
  .splitter { width: 1px; flex: none; background: var(--line); }
  .home-panel { flex: none; width: 360px; display: flex; flex-direction: column; background: var(--panel); position: relative; }
  .rp-tabs { display: flex; align-items: center; gap: 4px; height: 32px; flex: none; margin: 20px 0 12px; padding: 0 calc(var(--panel-x) - 8px); }
  .rp-tab { height: 32px; display: grid; place-items: center; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--secondary); white-space: nowrap; cursor: pointer; }
  .rp-tab:first-child { padding-left: 8px; }
  .rp-tab.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .rp-x { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); cursor: pointer; }
  .rp-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #2b303b transparent; padding: 6px var(--panel-x) 20px; }
  .rp-box { border-radius: 10px; background: var(--surface); }
  .rp-block-h { display: flex; align-items: center; height: 20px; margin: 20px 0 8px; font-size: 12.5px; color: var(--secondary); font-weight: 600; }
  .rp-block-h span { margin-left: auto; color: var(--muted); font-weight: 400; }
  .rp-dt-title { display: flex; gap: var(--ck-gap); align-items: flex-start; margin: 0 0 16px; padding: 0 var(--in); }
  .rp-dt-title > .ck { margin-top: 3px; }
  .rp-dt-title > .st { margin: -1px -6px -1px 0; }
  .rp-title { flex: 1; min-width: 0; font-size: 18px; line-height: 26px; font-weight: 700; cursor: text; }
  .rp-prop { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 8px var(--in); font-size: 13px; cursor: pointer; }
  .rp-prop + .rp-prop { border-top: 1px solid var(--line); }
  .rp-prop:first-child { border-radius: 10px 10px 0 0; } .rp-prop:last-child { border-radius: 0 0 10px 10px; }
  .rp-prop:hover { background: var(--raise); }
  .rp-prop .k { width: 60px; flex: none; color: var(--muted); font-size: 12.5px; }
  .rp-prop .v { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .rp-prop .v .sub { color: var(--muted); font-size: 12px; }
  .rp-chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--raise); color: var(--secondary); font-size: 12px; white-space: nowrap; }
  .rp-chip .rp-dot { width: 7px; height: 7px; border-radius: 50%; }
  .rp-bar { height: 3px; background: var(--raise); overflow: hidden; border-radius: 10px 10px 0 0; }
  .rp-bar i { display: block; height: 100%; background: var(--accent); }

  /* Subtasks: no due dates any more (confirmed); hover shows the grip and the delete ×. */
  .rp-subs { position: relative; }
  .rp-subt { position: relative; display: flex; align-items: center; gap: var(--ck-gap); min-height: 36px; padding: 0 var(--in); font-size: 13px; background: var(--surface); }
  .rp-subs .rp-subt { padding-left: var(--gw); }
  .rp-subt + .rp-subt { border-top: 1px solid var(--line); }
  .rp-subt:hover:not(.add), .rp-subt.hov { background: var(--raise); }
  .rp-subt:last-child { border-radius: 0 0 10px 10px; }
  .rp-subt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; line-height: 34px; }
  .rp-subt.done .nm { color: var(--muted); text-decoration: line-through; }
  .rp-subt .sacts-w { display: none; gap: 2px; flex: none; margin-right: -6px; }
  .rp-subt:hover .sacts-w, .rp-subt.hov .sacts-w, .rp-subt.cut .sacts-w:has(> .sexp), .rp-subt.open .sacts-w { display: flex; }
  .rp-subt .sacts { display: none; gap: 2px; }
  .rp-subt:hover .sacts, .rp-subt.hov .sacts { display: flex; }
  .rp-subt .sacts-w:empty { display: none; }
  .rp-ghost { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--secondary); cursor: pointer; }
  .rp-ghost:hover { background: #2a303c; color: var(--text); }
  .sgrip { position: absolute; left: 0; top: 0; bottom: 0; width: var(--gw); display: none; place-items: center; color: var(--faint); cursor: grab; }
  .sgrip:hover { color: var(--secondary); }
  .rp-subt:hover .sgrip, .rp-subt.hov .sgrip { display: grid; }
  /* Item 1, grip only on hover: no gap kept for it (rows line up with the add row). */
  body[data-grip="out"] .sgrip { display: grid; left: -18px; width: 18px; opacity: 0; }
  body[data-grip="out"] .rp-subt:hover .sgrip, body[data-grip="out"] .rp-subt.hov .sgrip, body.shift-on[data-grip="out"] .win .rp-subt[data-sid] .sgrip { opacity: 1; }
  body[data-grip="in"] .sgrip { width: 12px; }
  .rp-subt.add { color: var(--muted); cursor: text; }
  .rp-subt.add i { width: var(--ck); display: grid; place-items: center; font-style: normal; flex: none; }
  .rp-subt.add input { flex: 1; min-width: 0; height: 34px; padding: 0; border: 0; background: transparent; color: var(--text); font-size: 13px; outline: none; }
  .rp-subt.add input::placeholder { color: var(--muted); }
  .rp-sub-in { flex: 1; min-width: 0; height: 28px; margin: 4px 0; padding: 0 8px; border-radius: 7px; background: var(--canvas); border: 1px solid var(--accent); color: var(--text); font-size: 13px; outline: none; }
  /* Item 2: whole names on several lines (all rows for "줄바꿈", an opened row for "펼침 버튼"). */
  .rp-subt.ml { align-items: flex-start; }
  .rp-subt.ml .nm { white-space: normal; overflow: visible; text-overflow: clip; line-height: 20px; padding: 8px 0; }
  .rp-subt.ml > .ck { margin-top: 8px; }
  .rp-subt.ml .sacts-w { margin-top: 5px; }
  .rp-subt.ml .sgrip { bottom: auto; height: 35px; }
  .rp-sub-in.ml { display: block; height: auto; min-height: 28px; padding: 3px 8px; line-height: 20px; resize: none; overflow: hidden; white-space: pre-wrap; }
  .sexp { display: none !important; }
  .rp-subt.cut .sexp, .rp-subt.open .sexp { display: grid !important; }
  .rp-subt.open .sexp svg { transform: rotate(180deg); }

  /* Memo (an auto-height textarea) and, new, the count under it (item 5). */
  .rp-memo { display: block; width: 100%; min-height: 64px; margin: 0; padding: 12px var(--in); border: 0; resize: none; overflow: hidden; font-size: 13px; line-height: 1.6; color: var(--secondary); outline: none; }
  .rp-memo::placeholder { color: var(--faint); }
  .rp-memo:focus { box-shadow: inset 0 0 0 1px var(--accent); color: var(--text); }
  .memo-foot { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; padding: 0 var(--in); font-size: 11.5px; line-height: 16px; color: var(--muted); }
  .memo-foot .mf-note { flex: 1; min-width: 0; color: var(--warning); }
  .memo-foot .mf-n { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
  .memo-foot.full .mf-n { color: var(--warning); }
  .rp-stamp { margin-top: 16px; padding: 0 var(--in); font-size: 11.5px; color: var(--muted); }

  /* New: the undo notice (item 3). */
  .undo-toast { position: absolute; z-index: 70; top: 46px; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 12px; border-radius: 10px; background: #1e2430; box-shadow: 0 10px 28px #000a, inset 0 0 0 1px #2f3644; color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; }
  .undo-toast.center { left: 50%; translate: -50% 0; }
  .undo-toast .ut-msg { display: flex; min-width: 0; }
  .undo-toast .ut-nm { font-weight: 600; } /* names past 22 characters end in … */
  /* Item 2: coming and going. */
  .undo-toast.anim-slide.in { animation: utInSlide .2s cubic-bezier(.2, .8, .2, 1) both; }
  .undo-toast.anim-slide.out { animation: utOutSlide .16s ease-in both; }
  .undo-toast.anim-fade.in { animation: utInFade .16s ease-out both; }
  .undo-toast.anim-fade.out { animation: utOutFade .14s ease-in both; }
  @keyframes utInSlide { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes utOutSlide { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
  @keyframes utInFade { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes utOutFade { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.94); } }
  .undo-toast .ut-i { display: grid; place-items: center; width: 16px; color: var(--success); }
  .undo-toast .ut-i.del { color: var(--muted); }
  .undo-toast .ut-i.add { color: var(--accent); }
  .undo-toast .ut-btn { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px; border-radius: 7px; color: #a9c3ff; font-weight: 600; }
  .undo-toast .ut-btn:hover { background: var(--raise); }
  .undo-toast .ut-btn kbd { font: inherit; font-size: 11px; font-weight: 400; line-height: 1; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; }
  .undo-toast .ut-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); transform-origin: left; animation: utDrain 5s linear both; }
  @keyframes utDrain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  /* Where the notice would be, for Shift + hover while it is off. */
  .undo-slot { position: absolute; z-index: 69; top: 46px; left: 50%; width: 250px; height: 34px; margin-left: -125px; border-radius: 10px; pointer-events: none; }
  .undo-slot.right { left: auto; right: 50px; margin-left: 0; }
  body.shift-on .undo-slot { pointer-events: auto; }

  /* Confirm dialog (ConfirmDialog, pickers.scss). */
  .tp-pop { position: absolute; z-index: 40; background: #1e2430; box-shadow: 0 14px 36px #000a; color: var(--text); font-size: 13px; line-height: 1.5; word-break: keep-all; }
  .tp-pop p { margin: 0; }
  .dlg-wrap { position: absolute; inset: 42px 0 0; z-index: 60; display: grid; place-items: center; }
  .tp-scrim { position: absolute; inset: 0; background: #0006; }
  .tp-pop.tp-dialog { position: relative; width: 340px; padding: 20px; border-radius: 14px; box-shadow: 0 18px 44px #000b; text-align: center; }
  .tp-dialog-i { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; color: var(--danger); }
  .tp-dialog-t { display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .tp-dialog-b { margin: 0 0 4px !important; font-size: 13px; color: var(--secondary); line-height: 1.55; white-space: pre-line; }
  .tp-dialog-f { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 12px; }
  .dp-btn { height: 30px; padding: 0 12px !important; display: grid !important; place-items: center; border-radius: 8px; background: var(--raise) !important; font-size: 12.5px; }
  .dp-btn:hover { background: #2d3442 !important; }
  .dp-btn.danger { background: #3a2226 !important; color: var(--danger); font-weight: 600; }
  .dp-btn.danger:hover { background: #4a2a2f !important; }
</style>

  else if (k === 'tck') { const t = task(tid); if (t.done) { t.done = false; render(); } else act(t.t, '완료했어요', 'done', () => { t.done = true; }); }
  else if (k === 'undo') undo();
  else if (k === 'dlgX') { s.dlg = null; render(); }
  else if (k === 'dlgOk') doDelete(s.dlg.id);
  else if (k === 'sexp') { s.open.has(sid) ? s.open.delete(sid) : s.open.add(sid); render(); }
  else if (k === 'ren') {
    s.edit = sid; render();
    const f = document.querySelector(`[data-ren="${sid}"]`); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
});
function endRename(save) {
  const f = document.querySelector('[data-ren]'); if (!f) return;
  const x = s.subs.find(y => y.id === f.dataset.ren), v = f.value.replace(/\s*[\r\n]+\s*/g, ' ').trim();
  if (save && x && v) x.t = v;
  s.edit = null; render();
}
document.addEventListener('focusout', e => { if (!rendering && e.target.matches && e.target.matches('[data-ren]')) endRename(true); });
document.addEventListener('keydown', e => {
  const t = e.target, typing = t.matches && t.matches('input, textarea');
  if (e.isComposing || e.keyCode === 229) return;
  if (t.matches && t.matches('[data-ren]')) {
    if (e.key === 'Enter') { e.preventDefault(); endRename(true); } else if (e.key === 'Escape') { e.preventDefault(); endRename(false); }
    return;
  }
  if (t.matches && t.matches('[data-fk="qa"]') && e.key === 'Enter' && t.value.trim()) {
    const v = t.value.trim(); t.value = '';
    act(v, '추가했어요', 'add', () => { s.tasks.push({ id: 't' + Date.now(), g: 'today', t: v, when: '오늘', left: '9시간 39분 남음' }); });
    return;
  }
  if (t.matches && t.matches('[data-fk="subadd"]') && e.key === 'Enter' && t.value.trim()) {
    const v = t.value.trim(); t.value = '';
    act(v, '추가했어요', 'add', () => { s.subs.push({ id: 's' + Date.now(), t: v, done: false }); });
    return;
  }
  if (t.matches && t.matches('[data-fk="memo"]') && e.key === 'Escape') { t.blur(); return; }
  // Ctrl+Z undoes the last action while the notice is up (text fields keep their own undo).
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing && s.toast) { e.preventDefault(); undo(); return; }
  // Delete on a hovered task row (the mock's stand-in for the row menu's 삭제 and the Del key).
  if (e.key === 'Delete' && !typing) {
    const row = document.querySelector('.task-row:hover');
    if (row && !task(row.dataset.tid).sel) askDelete(row.dataset.tid);
  }
  if (e.key === 'Escape' && s.dlg) { s.dlg = null; render(); }
});
// Memo: typing stops at the limit (maxlength); a paste that goes over is cut and says so.
document.addEventListener('paste', e => {
  const t = e.target; if (!t.matches || !t.matches('[data-fk="memo"]')) return;
  const cap = CAP[s.memo]; if (!cap) return;
  const add = (e.clipboardData && e.clipboardData.getData('text')) || '';
  const over = t.value.length - (t.selectionEnd - t.selectionStart) + add.length - cap;
  s.memoPasteOver = over > 0 ? over : 0;
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-fk="memo"]')) {
    s.memoText = t.value; grow(t);
    const cap = CAP[s.memo];
    s.memoNote = s.memoPasteOver ? `넘는 ${num(s.memoPasteOver)}자는 빼고 붙였어요` : '';
    s.memoPasteOver = 0;
    const old = t.parentElement.querySelector('.memo-foot'), html = memoFoot();
    if (old) old.remove();
    if (html) t.insertAdjacentHTML('afterend', html);
  } else if (t.matches('.rp-sub-in.ml')) grow(t);
});
document.addEventListener('mouseover', e => {
  // The pinned hover goes away once the mouse is on the subtasks.
  if (s.demoHov && e.target.closest('.rp-subs')) { s.demoHov = false; document.querySelectorAll('.demo-hov').forEach(r => r.classList.remove('hov', 'demo-hov')); document.querySelectorAll('.thread-tooltip.demo').forEach(t => t.remove()); }
});

// App tooltips ([data-tip]).
const tipEl = document.getElementById('tip');
let tipTimer = 0, tipAt = null;
const hideTip = () => { clearTimeout(tipTimer); tipEl.classList.remove('on'); tipAt = null; };
document.addEventListener('mouseover', e => {
  const el = e.target.closest('.win [data-tip]');
  if (el === tipAt) return;
  hideTip();
  if (!el || document.body.classList.contains('shift-on')) return;
  tipAt = el;
  tipTimer = setTimeout(() => {
    tipEl.textContent = el.dataset.tip; tipEl.classList.toggle('wrap', !!el.dataset.tipWrap); tipEl.classList.add('on');
    const r = el.getBoundingClientRect(), w = tipEl.offsetWidth;
    tipEl.style.left = Math.max(4, Math.min(innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + 'px';
    tipEl.style.top = (r.bottom + 6) + 'px';
  }, 350);
});

// ---------- Shift + hover pickers and the notes ----------
// at: where they sit; key: the state they set (cur/set when it depends on another item).
// items: [value, name, one-line description, 'old' | 'rec']. The first is always 기존.
// show(): opens what the choice changes, when it is picked.
const resetDemo = () => { s.tasks = TASKS0.map(x => ({ ...x })); s.dlg = null; s.toast = null; s.edit = null; };
const OPTS = [
  { at: '.sgrip', key: 'grip', title: '하위 할 일 손잡이', show: () => { s.demoHov = true; s.scrollTo = 'top'; },
    items: [['16', '늘 자리 둠 · 4px씩', '지금 모습. 손잡이 자리 16px을 늘 비워 둠', 'old'],
      ['20', '늘 자리 둠 · 6px씩', '자리 20px. 점 양옆이 2px씩 넓어짐'],
      ['out', '올릴 때만 · 박스 바깥', '평소 여백 없음. 올리면 박스 왼쪽 바깥에', 'rec'],
      ['in', '올릴 때만 · 박스 안', '평소 여백 없음. 올리면 체크 원 옆 12px 안에']] },
  { at: '.undo-toast, .undo-slot', key: 'anim', title: '되돌리기 알림 나타나고 사라지는 모습',
    show: () => { resetDemo(); act(task('t3').t, '완료했어요', 'done', () => { task('t3').done = true; }); },
    items: [['none', '애니메이션 없음', '바로 나타나고 5초 뒤 바로 사라짐', 'old'],
      ['slide', '위에서 내려옴', '살짝 내려오며 나타나고 올라가며 사라짐', 'rec'],
      ['fade', '제자리에서 또렷해짐', '살짝 커지며 나타나고 작아지며 흐려짐']] },
  { at: '.memo-wrap', key: 'memo', title: '메모 글자 수 제한', set: v => { s.memo = v; s.memoNote = ''; },
    show: () => { s.scrollTo = 'memo'; },
    items: [['none', '기능 없음', '지금처럼 무제한. 아주 길면 동기화가 막힐 수 있음', 'old'],
      ['1k', '1천 자', 'A4 반 쪽 남짓. 긴 회의 메모는 모자람'],
      ['5k', '5천 자', 'A4 3쪽쯤'],
      ['10k', '1만 자', 'A4 6쪽쯤. 동기화 · 로딩 영향 거의 없음', 'rec']] },
];
const curOf = o => o.cur ? o.cur() : s[o.key];
const choose = (o, v) => { if (o.set) o.set(v); else s[o.key] = v; o.show(); render(); };
let shiftOn = false;
function markHot() {
  document.querySelectorAll('.win .hot').forEach(el => el.classList.remove('hot'));
  document.querySelectorAll('.win [data-opts]').forEach(el => delete el.dataset.opts);
  OPTS.forEach((o, i) => document.querySelectorAll(o.at).forEach(el => { if (!el.dataset.opts) el.dataset.opts = i; }));
  if (!shiftOn) return;
  document.querySelectorAll('.win *').forEach(el => {
    if (el.dataset.opts) return;
    const cs = getComputedStyle(el);
    if (el.matches('input, textarea, button, .rp-title, .top .search, .top .wc > span') || (cs.cursor === 'pointer' || cs.cursor === 'grab') && !['pointer', 'grab'].includes(getComputedStyle(el.parentElement).cursor)) el.classList.add('hot');
  });
}
// Shift + hover opens the candidates where the mouse is (inside the area). It stays open when the
// mouse moves onto it or Shift is released; a click elsewhere, Esc or another area closes it.
const optPop = document.getElementById('optpop');
let optAt = null;
const hideOpt = () => { optPop.classList.remove('on'); optAt = null; };
function showOpt(el, x, y) {
  const i = +el.dataset.opts, o = OPTS[i]; optAt = el;
  optPop.innerHTML = '<b>' + o.title + '</b>' + o.items.map(([v, nm, , tag]) => '<button class="' + (curOf(o) === v ? 'on' : '') + '" data-v="' + v + '">' + nm + (tag === 'old' ? '<span class="badge old">기존</span>' : tag === 'rec' ? '<span class="badge rec">추천</span>' : '') + '</button>').join('');
  optPop.dataset.o = i; optPop.classList.add('on');
  const w = optPop.offsetWidth, h = optPop.offsetHeight;
  optPop.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - 12)) + 'px';
  optPop.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - 12)) + 'px';
}
(() => {
  const setShift = on => { if (shiftOn === on) return; shiftOn = on; document.body.classList.toggle('shift-on', on); if (on) hideTip(); markHot(); };
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setShift(true); if (e.key === 'Escape') hideOpt(); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setShift(false); });
  window.addEventListener('blur', () => setShift(false));
  document.addEventListener('mousemove', e => {
    if (!e.shiftKey || optPop.contains(e.target)) return;
    const el = e.target.closest('.win [data-opts]');
    if (el && el !== optAt) showOpt(el, e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', e => { if (optAt && !optPop.contains(e.target)) hideOpt(); }, true);
  optPop.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    const i = +optPop.dataset.o, x = parseFloat(optPop.style.left) + 12, y = parseFloat(optPop.style.top) + 12;
    choose(OPTS[i], b.dataset.v);
    // Keep the list open on the new state (the area was drawn again).
    const el = document.querySelector('.win [data-opts="' + i + '"]');
    if (el) showOpt(el, x, y); else hideOpt();
  });
})();
// Notes: options change the mock; the chosen one takes an extra comment; copy gives both as text.
const comments = {};
document.addEventListener('input', e => { if (e.target.matches('.n-cm')) { comments[e.target.dataset.cm] = e.target.value; grow(e.target); } });
document.addEventListener('click', e => {
  if (e.target.closest('.n-cm')) return;
  const row = e.target.closest('.n-row');
  if (!row) return;
  const o = OPTS[+row.dataset.no];
  // Picking the chosen one again shows it again (the notice, the dialog, the memo end).
  if (row.classList.contains('on')) { o.show(); render(); } else choose(o, row.dataset.v);
  const f = document.querySelector(`.n-cm[data-cm="${row.dataset.no}:${row.dataset.v}"]`);
  if (f) { f.focus({ preventScroll: true }); f.setSelectionRange(f.value.length, f.value.length); }
});
function resultText() {
  return '#107 PC 2.5.1 시안 선택\n' + OPTS.map((o, i) => { const k = o.items.findIndex(([v]) => v === curOf(o)); const c = (comments[i + ':' + o.items[k][0]] || '').trim(); return `${i + 1}. ${o.title}: ${o.items[k][1]}${c ? ` (의견: ${c})` : ''}`; }).join('\n');
}
document.addEventListener('click', e => {
  const copy = e.target.closest('[data-ncopy]');
  if (!copy) return;
  const text = resultText();
  const done = () => { copy.textContent = '복사됨'; copy.classList.add('done'); setTimeout(() => { copy.textContent = '결과 복사'; copy.classList.remove('done'); }, 1400); };
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
});
document.addEventListener('change', e => { if (e.target.matches('[data-nnew]')) document.body.classList.toggle('show-new', e.target.checked); });
OPTS[1].show();
render();
// Names are measured for cutting once the fonts are in.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
</script>
</body>

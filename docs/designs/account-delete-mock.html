<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread 계정 삭제 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* Oxanium with the vertical metrics the app uses (fonts.scss), so Korean from Noto Sans KR sits centred. */
  @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 300 700; font-display: swap;
    ascent-override: 95%; descent-override: 5%; line-gap-override: 0%;
    src: url(https://fonts.gstatic.com/s/oxanium/v21/RrQQboN_4yJ0JmiMe2zE0YBB.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 300 700; font-display: swap;
    ascent-override: 95%; descent-override: 5%; line-gap-override: 0%;
    src: url(https://fonts.gstatic.com/s/oxanium/v21/RrQQboN_4yJ0JmiMe2LE0Q.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --page: #0b0d10;
    /* Desktop tokens (apps/desktop/src/styles/index.scss) = mobile dark theme (ui/theme.tsx). */
    --canvas: #101216; --panel: #15181e; --surface: #1c2028; --hover: #252b36; --border: #2b303b;
    --text: #edf1f7; --secondary: #a0aaba; --muted: #8792a4; --accent: #6294ff; --selected: #253858;
    --success: #70d5a0; --warning: #edbc72; --danger: #f0838b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }

  .stage { display: flex; flex-wrap: wrap; gap: 44px 36px; align-items: flex-start; padding: 32px 28px 72px; }
  .brk { flex-basis: 100%; height: 0; }
  .fr { display: flex; flex-direction: column; gap: 10px; flex: none; }
  .cap { color: #a0aaba; font-size: 13px; max-width: 100%; }
  .cap b { color: #edf1f7; margin-right: 6px; font-weight: 600; }
  .pair { display: flex; gap: 24px; }

  .notes { width: 400px; padding: 16px 18px; border: 1px dashed #3a4252; border-radius: 12px; color: #a0aaba; font-size: 13px; }
  .notes h3 { margin: 0 0 8px; font-size: 13px; color: #edf1f7; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 5px 0; }
  .notes .hint { margin: 0 0 10px; color: #8b95a7; font-size: 12.5px; }
  .notes kbd { padding: 1px 5px; border: 1px solid #3a4252; border-radius: 4px; font: inherit; font-size: 11.5px; color: #cfd6e2; }

  /* Shift + hover pickers (same as pc-main-redesign-mock.html). */
  body.shift-on .win .hot { outline: 1px dashed #9aa4b699; outline-offset: -1px; }
  body.shift-on .win [data-opts] { outline: 2px dashed #6fa0ff; outline-offset: -2px; }
  .opt-pop { position: fixed; z-index: 500; display: none; min-width: 180px; padding: 8px; border: 1px solid #3a5486; border-radius: 10px; background: #161b24f5; box-shadow: 0 12px 32px #000b; font-size: 12.5px; color: #cfd6e2; }
  .opt-pop.on { display: block; }
  .opt-pop b { display: block; margin: 0 4px 6px; font-size: 11.5px; color: #8b95a7; font-weight: 600; }
  .opt-pop button { display: block; width: 100%; margin: 2px 0; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .opt-pop button:hover { background: #232a37; }
  .opt-pop button.on { background: #253858; color: #fff; }

  .win { position: relative; flex: none; }
  .gone { display: grid; place-items: center; min-height: 64px; padding: 14px; border: 1px dashed #3a4252; border-radius: 10px; color: #8792a4; font-size: 12.5px; text-align: center; }

  /* ---------- PC settings modal (Settings.modal.scss, SettingsUI.scss) ---------- */
  .set { width: 1080px; height: 800px; display: flex; overflow: hidden; border: 1px solid #354051; border-radius: 14px; background: #151a23; box-shadow: 0 20px 60px #0008; }
  .set, .set button, .set input, .login, .login button, .login input { font-family: "Oxanium", "Noto Sans KR", "Pretendard", sans-serif; }
  .set .close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: none; color: var(--secondary); }
  .set .close:hover { background: var(--hover); color: var(--text); }
  .set .side { width: 196px; flex: 0 0 196px; display: flex; flex-direction: column; padding: 18px 10px; border-right: 1px solid #262d39; background: #12161d; }
  .set .side .st { padding: 2px 10px 14px; font-size: 15px; font-weight: 700; }
  .set .menu { display: flex; flex-direction: column; gap: 2px; }
  .set .mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--secondary); font-size: 14px; text-align: left; }
  .set .mi:hover { background: var(--hover); color: var(--text); }
  .set .mi.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .set .mi svg { width: 16px; height: 16px; }
  .set .mc { position: relative; flex: 1; min-width: 0; padding: 22px 28px 32px; overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable; }
  .sp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 44px 18px 0; }
  .sp-head h2 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; }
  .sp-head p { margin: 2px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.5; }
  .sec { margin-top: 20px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; margin-bottom: 8px; }
  .sec-head h3 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .card.dz { border-color: #4a2d33; }
  .srow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; }
  .srow + .srow { border-top: 1px solid var(--border); }
  .srow .ic { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; background: var(--hover); color: var(--secondary); }
  .srow .ic svg { width: 16px; height: 16px; }
  .srow .ic.av { width: 40px; height: 40px; flex-basis: 40px; border-radius: 50%; background: #2d3a55; color: #cfe0ff; font-size: 15px; font-weight: 700; }
  .srow.prof { min-height: 66px; }
  .srow .tx { flex: 1; min-width: 0; }
  .srow .lb { color: var(--text); font-size: 14px; font-weight: 600; line-height: 1.4; }
  .srow .lb.dg { color: var(--danger); }
  .srow .ds { color: var(--secondary); font-size: 12.5px; line-height: 1.5; }
  .srow .ctl { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .btn { height: 32px; padding: 0 12px; border: 1px solid #39414f; border-radius: 8px; background: #232a35; color: var(--text); font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover:not(:disabled) { background: #2b3441; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.danger { border-color: #5a3238; background: none; color: var(--danger); }
  .btn.danger:hover:not(:disabled) { background: #2a1c20; }
  .btn.ghost { border-color: transparent; background: none; color: var(--secondary); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .btn.ghost.sm { padding: 0 8px; font-size: 12px; }
  /* New: the final destructive button (red fill). */
  .btn.kill { border-color: var(--danger); background: var(--danger); color: #2a0b0f; font-weight: 700; }
  .btn.kill:hover:not(:disabled) { background: #f59aa1; }
  .btn svg { width: 14px; height: 14px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 11.5px; line-height: 16px; font-weight: 600; white-space: nowrap; background: #1f3a2d; color: var(--success); }

  /* StepDialog (data/StepDialog.scss) over the settings window. */
  .scrim { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: #05070acc; }
  .sd { display: flex; flex-direction: column; width: 540px; max-height: calc(100% - 40px); border: 1px solid #3a4456; border-radius: 14px; background: #181d26; box-shadow: 0 24px 70px #000a; color: var(--text); }
  .sd-head { position: relative; padding: 18px 56px 0 22px; }
  .sd-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .sd-x { position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--secondary); }
  .sd-x:hover { background: var(--hover); color: var(--text); }
  .sd-x svg { width: 18px; height: 18px; }
  .sd-body { min-height: 0; padding: 16px 22px; overflow: auto; font-size: 14px; line-height: 1.6; }
  .sd-body p { margin: 0 0 12px; color: var(--secondary); }
  .sd-body b { color: var(--text); }
  .sd-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
  .auth-act { display: flex; align-items: center; gap: 6px; }
  .sd-in { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #10141a; color: var(--text); font-size: 14px; outline: none; }
  .sd-in:focus { border-color: var(--accent); }
  .sd-in.sm { width: 140px; height: 32px; font-size: 13px; }
  .sd-lbl { margin: 14px 0 6px; color: var(--text); font-size: 13px; }
  .sd-lbl code, .m-flabel code { padding: 1px 6px; border-radius: 5px; background: #2a1c20; color: var(--danger); font: inherit; font-weight: 600; }
  .sd-fieldrow { display: flex; gap: 8px; }
  .sd-hint { margin: 6px 0 0 !important; color: var(--muted) !important; font-size: 12px; }
  .callout { margin: 12px 0; padding: 10px 12px; border-radius: 9px; font-size: 12.5px; line-height: 1.55; display: flex; align-items: center; gap: 10px; }
  .callout.info { border: 1px solid #2b3d5d; background: #182234; color: #c7d7f5; }
  .callout .grow { flex: 1; }
  .lose { margin: 0 0 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .lose .r { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; }
  .lose .r + .r { border-top: 1px solid var(--border); }
  .lose .r svg { width: 16px; height: 16px; margin-top: 3px; color: var(--danger); }
  .lose .r b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.5; }
  .lose .r span { display: block; color: var(--secondary); font-size: 12.5px; line-height: 1.5; }
  /* CheckCard (SettingsUI.scss .settings-check). */
  .chk { position: relative; display: flex; align-items: flex-start; gap: 10px; margin-top: 12px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 13px; line-height: 1.5; cursor: pointer; }
  .chk:hover { border-color: #3a4456; }
  .chk.on { border-color: #6b3a41; background: #2a1c20; }
  .chk .bx { display: grid; place-items: center; width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; border: 1.5px solid #4a5466; border-radius: 5px; background: #10141a; color: #2a0b0f; }
  .chk.on .bx { border-color: var(--danger); background: var(--danger); }
  .chk .bx svg { width: 13px; height: 13px; }

  /* ---------- PC login (pages/Login.scss) ---------- */
  .login { width: 1280px; height: 900px; overflow: hidden; border: 1px solid #2b303b; border-radius: 8px; background: #101216 center / cover no-repeat; color: rgb(226, 231, 239); }
  .login .cover { position: absolute; inset: 0; background: linear-gradient(70deg, #101216 45%, rgba(16, 18, 22, .4)); }
  .login .tb { position: absolute; top: 0; right: 0; display: flex; height: 30px; }
  .login .tb span { width: 45px; display: grid; place-items: center; color: #cfd6e2; }
  .login .tb svg { width: 15px; height: 15px; }
  .login .form { position: absolute; left: 100px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; width: 350px; }
  .login .addition { font-weight: 200; margin-bottom: 20px; font-size: 15px; }
  .login .title { font-size: 40px; font-weight: bold; margin-bottom: 40px; }
  .login .iw { display: flex; flex-direction: column; margin-bottom: 15px; }
  .login .iw .label { font-size: 13px; color: rgba(255, 255, 255, .211); margin-bottom: 10px; }
  .login .iw input { width: 350px; height: 40px; padding: 0 15px; border: 0; border-radius: 3px; background: rgba(255, 255, 255, .07); color: rgb(202, 210, 223); font-size: 16px; outline: none; }
  .login .lbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 36px; border-radius: 3px; font-size: 15px; border: 1px solid rgb(72, 72, 72); color: rgb(206, 206, 206); background: none; }
  .login .lbtn.in { margin-top: 5px; background: rgb(37, 60, 106); border: none; color: rgb(225, 225, 225); }
  .login .lbtn.up { margin-top: 15px; background: rgb(70, 58, 83); border: none; color: rgb(225, 225, 225); }
  .login .lbtn img { width: 18px; height: 18px; }
  .login .split { display: flex; align-items: center; height: 70px; }
  .login .split i { flex: 1; height: 1px; background: rgba(255, 255, 255, .15); }
  .login .split span { margin: 0 10px; font-size: 13px; color: rgba(255, 255, 255, .35); }
  /* New: the notice after deleting. */
  .gone-note { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 32px; padding: 14px 16px; border: 1px solid #2b3d5d; border-radius: 10px; background: #182234e6; color: #c7d7f5; font-size: 13px; line-height: 1.55; }
  .gone-note svg { width: 18px; height: 18px; margin-top: 1px; color: var(--success); }
  .gone-note b { display: block; color: var(--text); font-size: 14px; }
  .gone-note button { margin-left: auto; border: 0; background: none; color: var(--muted); padding: 0; }
  .login .gone { margin-bottom: 32px; background: #0b0d10aa; }

  /* ---------- Phones (390x844, Android) ---------- */
  .phone { position: relative; width: 390px; height: 844px; box-sizing: content-box; border: 10px solid #222730; border-radius: 44px; background: var(--canvas); color: var(--text); overflow: hidden; display: flex; flex-direction: column; font-family: Roboto, "Noto Sans KR", sans-serif; }
  .phone button, .phone input { font-family: inherit; }
  .stbar { height: 36px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; color: var(--secondary); }
  .stbar .icons { display: flex; gap: 6px; align-items: center; }
  .gesture { position: absolute; bottom: 8px; left: 50%; width: 108px; height: 4px; margin-left: -54px; border-radius: 4px; background: var(--muted); opacity: .6; z-index: 60; }
  .pc-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; position: relative; padding-bottom: 40px; }
  .pc-scroll::-webkit-scrollbar { display: none; }
  .m-title { padding: 16px 18px 12px; font-size: 22px; font-weight: 700; flex: none; }
  .m-acc { display: flex; align-items: center; gap: 12px; margin: 0 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .m-logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #1a1f2a; }
  .m-logo img { width: 32px; height: 32px; }
  .m-gt { padding: 18px 18px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .m-grp { margin: 0 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .m-it { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .m-it:last-child { border-bottom: 0; }
  .m-it:active { background: var(--hover); }
  .m-it .g { flex: 1; min-width: 0; }
  .m-it .t { font-size: 15px; line-height: 20px; } .m-it .t.dg { color: var(--danger); }
  .m-it .d { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 16px; }
  .m-it .v { color: var(--muted); font-size: 13px; }
  .m-it .chev { width: 16px; height: 16px; color: var(--muted); }
  .m-it.off { cursor: default; } .m-it.off .t { opacity: .45; }
  .m-it.sw { gap: 12px; padding: 12px 14px; }
  .m-grp .gone { margin: 8px; min-height: 48px; }
  .aswitch { position: relative; width: 36px; height: 20px; flex: none; }
  .aswitch::before { content: ""; position: absolute; left: 2px; right: 2px; top: 3px; height: 14px; border-radius: 7px; background: #6294ff99; }
  .aswitch::after { content: ""; position: absolute; top: 0; left: 16px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0008; }
  .m-syncline { display: flex; align-items: center; gap: 6px; padding: 6px 14px 10px; color: var(--muted); font-size: 12px; }
  .m-syncline i { width: 6px; height: 6px; border-radius: 3px; background: var(--success); }
  .m-tab { flex: none; display: flex; height: 78px; padding: 6px 0 16px; background: var(--panel); border-top: 1px solid var(--border); }
  .m-tab button { position: relative; flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .m-tab button svg { width: 20px; height: 20px; }
  .m-tab button.on { color: var(--accent); font-weight: 700; }
  .m-tab button.on::before { content: ""; position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
  /* Full-screen flow like KeyChangeScreen (ui/kit Screen, Title, Body, Card, Option, Field, Button). */
  .m-hd { display: flex; align-items: center; padding: 8px 8px 0; flex: none; }
  .m-hd .ib { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--secondary); border-radius: 12px; }
  .m-hd .ib svg { width: 22px; height: 22px; }
  .m-hd span { color: var(--muted); font-size: 12.5px; }
  .m-head { padding: 0 18px 8px; }
  .m-head h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; line-height: 1.3; }
  .m-head p { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 21px; }
  .m-head p b { color: var(--text); font-weight: 600; }
  .m-card { margin: 0 18px 12px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .m-card .ct { color: var(--text); font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .m-card .li { color: var(--muted); font-size: 12.5px; line-height: 19px; }
  .m-card.info { border-color: #2b3d5d; background: #182234; }
  .m-card.info .li { color: #c7d7f5; }
  .m-opt { display: flex; gap: 12px; margin: 0 18px 10px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; }
  .m-opt.on { border-color: var(--danger); background: #2a1c20; }
  .m-opt .bx { width: 20px; height: 20px; margin-top: 1px; flex: none; display: grid; place-items: center; border: 2px solid var(--muted); border-radius: 6px; color: #2a0b0f; }
  .m-opt.on .bx { border-color: var(--danger); background: var(--danger); }
  .m-opt .bx svg { width: 14px; height: 14px; }
  .m-opt .t { color: var(--text); font-size: 15px; font-weight: 600; line-height: 21px; }
  .m-flabel { margin: 4px 20px 6px; color: var(--secondary); font-size: 13px; }
  .m-field { display: block; width: calc(100% - 36px); margin: 0 18px 12px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 15px; outline: none; }
  .m-field:focus { border-color: var(--accent); }
  .m-field::placeholder { color: var(--muted); }
  .m-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: calc(100% - 36px); min-height: 50px; margin: 0 18px 10px; padding: 0 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; }
  .m-btn.ghost { border-color: transparent; background: none; color: var(--secondary); font-weight: 500; }
  .m-btn.kill { border-color: var(--danger); background: var(--danger); color: #2a0b0f; font-weight: 700; }
  .m-btn:disabled { opacity: .55; cursor: default; }
  .m-small { margin: -2px 20px 12px; color: var(--muted); font-size: 12.5px; line-height: 18px; text-align: center; }
  .phone > .gone, .pc-scroll > .gone { margin: 20px 18px; }

  /* ---------- Site (apps/web/site/src/styles/index.scss, dark) ---------- */
  .browser { width: 1280px; overflow: hidden; border: 1px solid #2b303b; border-radius: 10px; background: #0f1115; box-shadow: 0 20px 60px #0008; }
  .bchrome { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #1b1e24; border-bottom: 1px solid #262b35; color: #a7b0bf; font-size: 13px; }
  .bchrome .dots { display: flex; gap: 7px; } .bchrome .dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a404b; }
  .bchrome .url { flex: 1; max-width: 640px; margin-left: 10px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 15px; background: #0f1115; color: #cfd6e2; }
  .bchrome .url svg { width: 13px; height: 13px; color: #7f8898; }
  .site { --bg: #0f1115; --surface: #14171d; --card: #181b22; --text: #edf1f7; --secondary: #a7b0bf; --muted: #7f8898; --border: #262b35; --accent: #6294ff; --on-accent: #0b1222;
    background: var(--bg); color: var(--text); font-family: "Pretendard", system-ui, sans-serif; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .site a { color: var(--accent); }
  .site .container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .site .nav { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 85%, transparent); }
  .site .nav__inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .site .nav__brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 18px; font-weight: 700; text-decoration: none; }
  .site .nav__brand img { border-radius: 7px; }
  .site .nav__links { display: flex; align-items: center; gap: 4px; }
  .site .nav__links a { padding: 6px 12px; border-radius: 8px; color: var(--secondary); font-size: 15px; font-weight: 500; text-decoration: none; }
  .site .nav__links a:hover { background: var(--surface); color: var(--text); }
  .site .nav__links .nav__cta { background: var(--accent); color: var(--on-accent); }
  .site .policy { max-width: 820px; padding-top: 64px; padding-bottom: 96px; }
  .site .policy h1 { margin: 0 0 4px; font-size: 34px; font-weight: 800; }
  .site .policy h2 { margin: 44px 0 12px; font-size: 21px; font-weight: 700; }
  .site .policy p, .site .policy li { color: var(--secondary); }
  .site .policy ul, .site .policy ol { padding-left: 22px; } .site .policy li { margin: 6px 0; }
  .site .muted { color: var(--muted); font-size: 14px; }
  .site .lead { font-size: 17px; }
  .site .lead b { color: var(--text); }
  .site table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  .site th, .site td { padding: 12px 14px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
  .site th { background: var(--surface); font-weight: 600; }
  .site td:first-child { width: 58%; color: var(--text); font-weight: 500; }
  .site td { color: var(--secondary); }
  .site td.now { color: var(--text); }
  .site .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
  .site .scard { padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
  .site .scard h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .site .scard h3 svg { width: 22px; height: 22px; color: var(--accent); }
  .site .scard ol { margin: 0; } .site .scard li { font-size: 15px; }
  .site .scard li b { color: var(--text); font-weight: 600; }
  .site .scard .note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  .site .mail { margin-top: 16px; padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
  .site .mail dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 16px; margin: 0 0 20px; font-size: 15px; }
  .site .mail dt { color: var(--muted); } .site .mail dd { margin: 0; color: var(--text); }
  .site .mail dd code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .9em; }
  .site .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border: 1px solid transparent; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .site .button--primary { background: var(--accent); color: var(--on-accent) !important; }
  .site .button--ghost { border-color: var(--border); color: var(--text) !important; }
  .site .mail .acts { display: flex; gap: 10px; align-items: center; }
  .site .mail .acts span { color: var(--muted); font-size: 14px; }
  .site .warn { margin-top: 20px; padding: 14px 18px; border: 1px solid #5a3238; border-radius: 12px; background: #2a1c20; color: #f3afb5; font-size: 15px; }
  .site .footer { border-top: 1px solid var(--border); }
  .site .footer__inner { display: flex; flex-wrap: wrap; gap: 8px 24px; padding-top: 28px; padding-bottom: 28px; color: var(--muted); font-size: 14px; }
  .site .footer__inner a { color: var(--secondary); text-decoration: none; }
  .site .footer__inner a.cur { color: var(--text); }
  .site .gone { margin: 24px 0; }
</style>
</head>

// ---------- State ----------
// auth: identity check (A) · final: last confirmation (B) · who: which devices may delete (C).
// 'none' = today: the app has no way to delete the account.
const s = { auth: 'os', final: 'check', who: 'any', ack: false, mAck: false, pwMode: false, val: {} };
const ID = 'thread_user', EMAIL = 'user@example.com', CONTACT = 'shyunku.support@gmail.com';
const OWNER = 'Galaxy S24';
const noneKey = () => ['auth', 'final', 'who'].find(k => s[k] === 'none');
const gone = (text, cls = '') => `<div class="gone k-${noneKey()} ${cls}">${text}</div>`;
const v = k => s.val[k] || '';
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The red button turns on only when the confirmation and the identity field are filled.
function ready(p) {
  const finalOk = s.final === 'check' ? s[p === 'pc' ? 'ack' : 'mAck'] : v(p + 'Id').trim() === ID;
  let authOk = true;
  if (s.auth === 'type') authOk = v(p + 'Type').trim() === '계정 삭제';
  else if (s.auth === 'pw' || (s.auth === 'os' && p === 'pc' && s.pwMode)) authOk = v(p + 'Pw').length > 0;
  return finalOk && authOk;
}
function syncReady() { document.querySelectorAll('[data-del]').forEach(b => { b.disabled = !ready(b.dataset.del); }); }

  }

function verifyText(phone) {

  if (s.auth === 'type') return '"계정 삭제"를 입력해 확인';
  return phone ? '지문·PIN으로 본인 확인' : 'Windows Hello(없으면 보관함 비밀번호)로 본인 확인';
}

function render() {

  document.querySelectorAll('[data-sc]').forEach(el => { keep[el.dataset.sc] = el.scrollTop; });
  document.getElementById('stage').innerHTML = [
    fr('<b>① PC 설정 · 계정</b>맨 아래에 계정 삭제 줄을 더해요 (1440×960 창 기준 1080×800)', frame1(), 'f1'),
    notes(),
    '<div class="brk"></div>',
    fr('<b>② PC 확인 창</b>계정 삭제… 를 누르면 설정 위에 떠요. 체크·입력해야 빨간 버튼이 켜져요', frame2(), 'f2'),
    fr('<b>③ PC 삭제 뒤</b>로그인 화면(1280×900)으로 돌아가 짧게 알려요', frame3(), 'f3'),
    '<div class="brk"></div>',
    fr('<b>④ 모바일 설정 · 계정</b>계정 묶음 맨 아래', frame4(), 'f4'),
    fr('<b>⑤ 모바일 확인 화면</b>기기 해제처럼 전체 화면으로 열려요', frame5(), 'f5'),
    fr('<b>⑥ 사이트 · 계정 삭제 페이지</b>Google Play에 적을 주소. 앱이 없는 사람은 이메일로 요청', frame6(), 'f6'),
  ].join('');
  document.querySelectorAll('[data-sc]').forEach(el => {
    if (keep[el.dataset.sc] != null) el.scrollTop = keep[el.dataset.sc];
    else if (el.dataset.sc === 'm4') { const g = el.querySelector('#m-acc'); el.scrollTop = g.offsetTop - 300; }
  });
  markHot();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || e.target.closest('.opt-pop')) return;
  e.preventDefault();
  const act = a.dataset.act;
  if (act === 'ack') s.ack = !s.ack;
  else if (act === 'mAck') s.mAck = !s.mAck;
  else if (act === 'pwMode') { s.pwMode = !s.pwMode; s.val.pcPw = ''; }
  render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.v; if (!k) return;
  s.val[k] = e.target.value; syncReady();
});

// Choices shown on Shift + hover. at: where they sit; key: the state they set.
const OPTS = [
  { at: '.auth-slot, .k-auth', key: 'auth', title: '삭제 전 본인 확인', items: [['os', '이 기기 잠금 해제: Windows Hello·지문/PIN, 안 되면 보관함 비밀번호 (추천)'], ['pw', '계정 비밀번호 다시 입력 · Google 계정은 다시 로그인'], ['type', '"계정 삭제"를 직접 입력'], ['none', '기존(계정 삭제 없음)']] },
  { at: '.final-slot, .k-final', key: 'final', title: '마지막 확인', items: [['check', '"이해했어요" 체크 + 빨간 버튼 (추천)'], ['typeid', '아이디를 입력해야 버튼이 켜짐'], ['none', '기존(계정 삭제 없음)']] },
  { at: '.f1 .del-row, .f4 .del-row, .k-who', key: 'who', title: '계정을 지울 수 있는 기기', items: [['any', '로그인한 모든 기기 (추천 · Play 요건)'], ['owner', '처음 만든 기기만'], ['none', '기존(계정 삭제 없음)']] },
];
let shiftOn = false;
function markHot() {
  document.querySelectorAll('.win .hot').forEach(el => el.classList.remove('hot'));
  OPTS.forEach((o, i) => document.querySelectorAll(o.at).forEach(el => { el.dataset.opts = i; }));
  if (!shiftOn) return;
  document.querySelectorAll('.win *').forEach(el => { if (!el.dataset.opts && getComputedStyle(el).cursor === 'pointer' && getComputedStyle(el.parentElement).cursor !== 'pointer') el.classList.add('hot'); });
}
(() => {
  const pop = document.getElementById('optpop');
  let at = null, timer = 0;
  const hide = () => { pop.classList.remove('on'); at = null; };
  const show = el => {
    const o = OPTS[+el.dataset.opts]; at = el;
    pop.innerHTML = '<b>' + o.title + '</b>' + o.items.map(([v, l]) => '<button class="' + (s[o.key] === v ? 'on' : '') + '" data-v="' + v + '">' + l + '</button>').join('');
    const r = el.getBoundingClientRect(); pop.classList.add('on');
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
    pop.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
  };
  const setShift = on => { if (shiftOn === on) return; shiftOn = on; document.body.classList.toggle('shift-on', on); markHot(); };
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setShift(true); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setShift(false); });
  window.addEventListener('blur', () => setShift(false));
  document.addEventListener('mousemove', e => {
    if (pop.contains(e.target)) { clearTimeout(timer); return; }
    const el = e.shiftKey ? e.target.closest('.win [data-opts]') : null;
    if (el) { clearTimeout(timer); if (el !== at) show(el); return; }
    if (at && !at.contains(e.target)) { clearTimeout(timer); timer = setTimeout(hide, 300); }
  });
  pop.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !at) return;
    e.stopPropagation();
    s[OPTS[+at.dataset.opts].key] = b.dataset.v;
    hide(); render();
  });
})();
render();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread 새 계정 데이터 설정 시안 (#75)</title>
<style>
  :root {
    --canvas: #101216; --panel: #15181e; --surface: #1c2028; --hover: #252b36; --border: #2b303b;
    --text: #edf1f7; --secondary: #a0aaba; --muted: #8792a4; --accent: #6294ff; --selected: #253858;
    --success: #70d5a0; --warning: #edbc72; --danger: #f0838b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: var(--text); font: 14px/1.55 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
    .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 32px 16px 64px; flex-wrap: wrap; }

  /* The gate window in its "setup" size (528×820 in the app). */
  .window { position: relative; width: 528px; height: 780px; border-radius: 12px; background: var(--canvas); border: 1px solid #222731; overflow: hidden; display: flex; flex-direction: column; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 6px 0 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid #1d2129; flex: none; }
  .titlebar span:last-child { letter-spacing: 14px; }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.on { display: flex; }

  /* Step layout: head (title, progress), body, footer — same as settings StepDialog. */
  .head { padding: 22px 28px 0; flex: none; }
  .head .kicker { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 700; }
  .steps { display: flex; gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
  .steps li { flex: 1; height: 4px; border-radius: 2px; background: #2c3442; }
  .steps li.done { background: var(--accent); } .steps li.current { background: #9dbbff; }
  .step-label { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .body { flex: 1; min-height: 0; overflow: auto; padding: 18px 28px; }
  .body p { margin: 0 0 12px; color: var(--secondary); }
  .body b { color: var(--text); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 28px 18px; border-top: 1px solid var(--border); flex: none; }

  .btn { height: 36px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 600; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1222; }
  .btn.ghost { background: none; border-color: transparent; color: var(--secondary); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .btn.danger { background: #3a1d22; border-color: #5a2a31; color: #ffb3b9; }
  .btn.block { width: 100%; height: 40px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  /* Start screen */
  .start { flex: 1; display: flex; flex-direction: column; padding: 40px 28px 24px; }
  .start .hero-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: #1c2230; color: var(--accent); margin-bottom: 18px; }
  .start h1 { margin: 0 0 8px; font-size: 22px; }
  .start > p { margin: 0 0 24px; color: var(--secondary); }
  .account { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); font-size: 13px; color: var(--secondary); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #2f3a52; color: var(--text); font-weight: 700; font-size: 12px; flex: none; }
  .choice { display: flex; gap: 14px; align-items: flex-start; width: 100%; padding: 16px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-align: left; }
  .choice:hover { border-color: #3d4a62; background: #1f2430; }
  .choice .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #252c3a; color: var(--secondary); flex: none; }
  .choice.recommended .ico { background: #22314f; color: var(--accent); }
  .choice b { display: block; font-size: 15px; color: var(--text); }
  .choice span { color: var(--secondary); font-size: 13px; }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: #22314f; color: #9dbbff; font-size: 11px; font-weight: 600; vertical-align: 2px; }
  .chev { margin-left: auto; align-self: center; color: var(--muted); }
  .start .bottom { margin-top: auto; text-align: center; }

  /* Pieces shared with settings */
  .option, .choice, .check { user-select: none; }
  .option { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .option.on { border-color: #4b6db8; background: #1b2436; }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #4a5468; flex: none; margin-top: 2px; }
  .option.on .radio { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--panel); background: var(--accent); }
  .option b { display: block; color: var(--text); }
  .option span { color: var(--secondary); font-size: 13px; }
  .field { margin: 6px 0 12px; }
  .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--secondary); }
  .field input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: #10141a; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .field .hint { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .code-input { font-family: Consolas, "Cascadia Mono", monospace; letter-spacing: .05em; }
  .code { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: #10141a; font-family: Consolas, "Cascadia Mono", monospace; font-weight: 600; letter-spacing: .06em; text-align: center; font-size: 15px; line-height: 1.6; }
  .callout { margin: 12px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
  .callout.info { background: #1a2335; color: #b8cbf5; border: 1px solid #2a3a5a; }
  .callout.warn { background: #2b2417; color: #f1d39c; border: 1px solid #4a3c22; }
  .callout.danger { background: #2c1a1e; color: #f6b9be; border: 1px solid #4c2a30; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .check .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #4a5468; flex: none; margin-top: 2px; }
  .check.on { border-color: #4b6db8; } .check.on .box { background: var(--accent); border-color: var(--accent); }
  .tabs { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 14px; }
  .tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: none; color: var(--secondary); font-size: 13px; }
  .tabs button.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .qr { width: 196px; height: 196px; margin: 4px auto 14px; padding: 10px; border-radius: 12px; background: #fff; }
  .qr div { width: 100%; height: 100%; background:
    linear-gradient(90deg, #000 12%, transparent 12% 18%, #000 18% 22%, transparent 22% 40%, #000 40% 46%, transparent 46% 58%, #000 58% 64%, transparent 64% 82%, #000 82%),
    linear-gradient(#000 12%, transparent 12% 30%, #000 30% 36%, transparent 36% 52%, #000 52% 60%, transparent 60% 76%, #000 76% 82%, transparent 82%);
    background-blend-mode: difference; opacity: .85; }
  .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; }
  .steps-list { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: s; }
  .steps-list li { position: relative; padding: 8px 0 8px 34px; color: var(--secondary); font-size: 13.5px; }
  .steps-list li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #252c3a; color: var(--text); font-size: 12px; font-weight: 700; }
  .steps-list li.here::before { background: var(--accent); color: #0b1222; }
  .file-drop { display: grid; place-items: center; gap: 6px; padding: 26px 16px; border: 1.5px dashed #3a4456; border-radius: 12px; text-align: center; color: var(--secondary); }
  .file-drop b { color: var(--text); }
  .finish { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; }
  .finish .ok { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #1b3328; color: var(--success); font-size: 28px; margin-bottom: 16px; }
  .finish h1 { margin: 0 0 8px; font-size: 21px; } .finish p { color: var(--secondary); margin: 0 0 4px; }
  .progress { width: 220px; height: 6px; border-radius: 3px; background: #252c3a; margin: 18px 0 22px; overflow: hidden; }
  .progress div { width: 62%; height: 100%; background: var(--accent); }
  ul.plain { margin: 0 0 12px; padding-left: 18px; color: var(--secondary); } ul.plain li { margin: 4px 0; }
  .existing { width: 600px; }
  .settings-bg { position: relative; flex: 1; background: #151a23; display: grid; place-items: center; padding: 20px; }
  .dialog { display: none; width: 100%; border: 1px solid #3a4456; border-radius: 14px; background: #181d26; box-shadow: 0 24px 70px #000a; }
  .dialog.on { display: block; }
  .dhead { padding: 18px 22px 0; } .dhead h3 { margin: 0; font-size: 17px; }
  .dbody { padding: 16px 22px; } .dbody p { margin: 0 0 12px; color: var(--secondary); } .dbody p.ok { color: var(--success); font-weight: 600; } .dbody b { color: var(--text); }
  .dfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
  .path { display: flex; align-items: center; gap: 8px; margin: 6px 0 18px; color: var(--muted); }
  .path span { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px; }
  .waiting { display: flex; align-items: center; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--secondary); margin-bottom: 12px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #33405a; border-top-color: var(--accent); animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sas { margin: 10px 0 14px; padding: 18px; border: 1px solid #344670; border-radius: 12px; background: #141c2c; text-align: center; font: 700 40px/1 Consolas, "Cascadia Mono", monospace; letter-spacing: .12em; color: #dfe8ff; }
  .sas.small { font-size: 22px; padding: 10px; color: var(--secondary); border-color: var(--border); background: var(--panel); }
  .center { text-align: center; }
  .muted { color: var(--muted) !important; font-size: 13px; }

  html, body { height: 100%; }
  body { overflow: hidden; }
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: flex-start; height: 100%; padding: 24px; flex-wrap: nowrap; }
  /* The gate window at its setup size, 528×820. */
  .window { height: 820px; flex: none; }
  .titlebar span:last-child { letter-spacing: 14px; }
  .step-body-gap { height: 4px; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 12px; }
  .file-row .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #252c3a; color: var(--secondary); flex: none; }
  .file-row.done .ico { background: #1b3328; color: var(--success); }
  .file-row b { display: block; color: var(--text); }
  .file-row span { color: var(--secondary); font-size: 13px; }
  .file-row .btn { margin-left: auto; flex: none; }
  .codebox { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: #10141a; margin-bottom: 8px; }
  .codebox code { flex: 1; font: 600 15px/1.6 Consolas, "Cascadia Mono", monospace; letter-spacing: .06em; color: var(--text); }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  .part { margin: 0 0 18px; }
  .part h2 { margin: 0 0 6px; font-size: 14px; color: var(--text); }
  .part.off { opacity: .45; pointer-events: none; }
  .ok-line { color: var(--success); font-weight: 600; font-size: 13px; margin: 0 0 12px; }

  /* Notes (the user's mock rules). */
  .notes { display: flex; flex-direction: column; width: 400px; height: 100%; min-height: 0; flex: none; padding: 14px 0 0; border: 1px solid #2b303b; border-radius: 12px; background: #12151b; color: #a0aaba; font-size: 13px; }
  .notes .n-top { display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; border-bottom: 1px solid #242a35; }
  .notes .n-copy { flex: none; padding: 6px 12px; border: 0; border-radius: 8px; background: #3d6fe0; color: #fff; font-size: 12.5px; font-weight: 600; }
  .notes .n-copy.done { background: #2f9e6a; }
  .notes .hint { margin: 0; color: #8b95a7; font-size: 12px; line-height: 1.45; }
  .notes kbd { padding: 0 4px; border: 1px solid #3a4252; border-radius: 4px; font: inherit; font-size: 11px; color: #cfd6e2; }
  .notes .n-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px; }
  .notes .n-item { padding: 12px 0 10px; }
  .notes .n-item + .n-item { border-top: 1px solid #2a303c; }
  .notes h4 { margin: 2px 6px 4px; font-size: 13px; color: #edf1f7; font-weight: 600; }
  .notes .n-row { display: grid; gap: 2px; width: 100%; cursor: pointer; margin: 2px 0; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: #cfd6e2; text-align: left; font-size: 12.5px; }
  .notes .n-row:hover { background: #1c222c; }
  .notes .n-row.on { background: #22324f; color: #fff; }
  .notes .n-nm { font-weight: 600; }
  .notes .n-ds { color: #8b95a7; font-size: 12px; }
  .notes .n-row.on .n-ds { color: #b9c6dc; }
  .notes .n-cm { display: block; margin-top: 6px; width: 100%; min-height: 30px; padding: 5px 8px; border: 1px solid #3a4a66; border-radius: 6px; background: #151b26; color: #edf1f7; font-size: 12.5px; line-height: 1.5; outline: none; cursor: text; resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes .n-cm:focus { border-color: #6fa0ff; }
  .nbadge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 600; line-height: 17px; vertical-align: 1px; }
  .nbadge.old { background: #2c323d; color: #aab4c4; }
  .nbadge.rec { background: #1d4a35; color: #7fe0ae; }
  .notes .n-new { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid #242a35; cursor: pointer; user-select: none; }
  .notes .n-new input { accent-color: #3ddc84; }
  body.show-new .window :is(.logout, .steps, .step-label) { outline: 2px solid #3ddc84; outline-offset: 2px; }

  /* Shift + hover pickers. */
  body.shift-on .window .hot { outline: 1px dashed #9aa4b699; outline-offset: -1px; }
  body.shift-on .window [data-opts] { outline: 2px dashed #6fa0ff; outline-offset: -2px; }
  .opt-pop { position: fixed; z-index: 500; display: none; min-width: 180px; max-width: 420px; padding: 8px; border: 1px solid #3a5486; border-radius: 10px; background: #161b24f5; box-shadow: 0 12px 32px #000b; font-size: 12.5px; color: #cfd6e2; }
  .opt-pop.on { display: block; }
  .opt-pop b { display: block; margin: 0 4px 6px; font-size: 11.5px; color: #8b95a7; font-weight: 600; }
  .opt-pop button { display: block; width: 100%; margin: 2px 0; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .opt-pop button:hover { background: #222a38; }
  .opt-pop button.on { background: #22324f; color: #fff; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="opt-pop" id="optpop"></div>
<script>
const sv = (d, z = 18) => '<svg width="' + z + '" height="' + z + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const I = {
  shield: sv('<path d="M12 3l7 3v5.5c0 4.3-3 8-7 9.5-4-1.5-7-5.2-7-9.5V6z"/><path d="M9.2 12.2l2 2 3.8-4"/>', 26),
  file: sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  check: sv('<path d="M5 12l5 5 9-10"/>'),
  copy: sv('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>', 16),
};
// Synthetic code: what the app shows is a preview of the real one.
const CODE = 'K7QM-2XRA-91HT-PD4W-6NBC-E8VZ';

// The decisions; the first value is today's flow (기존).
const s = {
  intro: 'show', recovery: 'split', final: 'merged', lock: 'os',
  screen: null, fileSaved: false, copied: false, confirmed: false, registered: false, started: false, typed: '',
};
const steps = () => [
  ...(s.intro === 'show' ? ['start'] : []),
  'lock',
  ...(s.recovery === 'split' ? ['file', 'code', 'confirm'] : ['recovery']),
  ...(s.final === 'merged' ? ['finish'] : ['register', 'finish']),
];
const counted = () => steps().filter(x => x !== 'start');
const LABEL = { lock: '잠금 방법', file: '복구 파일', code: '복구 코드', confirm: '복구 코드 확인', recovery: '복구 자료', register: '서버 등록', finish: '시작' };
const TITLE = { lock: '이 기기의 잠금 방법', file: '복구 파일 저장', code: '복구 코드 저장', confirm: '복구 코드 확인', recovery: '복구 자료 준비', register: '서버에 등록', finish: '준비 끝' };

function head(id) {
  const list = counted(), i = list.indexOf(id);
  return '<div class="head"><div class="kicker">새 데이터 보호 설정</div><h1>' + TITLE[id] + '</h1>'
    + '<ol class="steps">' + list.map((_, k) => '<li class="' + (k < i ? 'done' : k === i ? 'current' : '') + '"></li>').join('') + '</ol>'
    + '<div class="step-label">' + (i + 1) + '/' + list.length + ' · ' + LABEL[id] + '</div></div>';
}
const foot = (next, label, disabled = false, back = true) => '<div class="foot">' + (back ? '<button class="btn ghost" data-act="back">이전</button>' : '<span></span>')
  + '<button class="btn primary" data-act="' + next + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button></div>';

const parts = {
  file: () => '<div class="part"><p>PC를 잃어버렸을 때 데이터를 되찾는 데 쓰는 파일이에요. 로그인 비밀번호와는 별개예요.</p>'
    + '<div class="file-row ' + (s.fileSaved ? 'done' : '') + '"><span class="ico">' + (s.fileSaved ? I.check : I.file) + '</span><span><b>' + (s.fileSaved ? '복구 파일을 저장했어요' : '복구 파일') + '</b><span>' + (s.fileSaved ? 'thread-recovery.json · 문서 폴더' : '암호화된 파일이에요. USB나 클라우드처럼 이 PC 밖에 두세요.') + '</span></span>'
    + '<button class="btn" data-act="save">' + (s.fileSaved ? '다른 곳에 또 저장' : '파일 저장') + '</button></div></div>',
  code: () => '<div class="part ' + (s.fileSaved ? '' : 'off') + '"><p>복구 코드는 파일과 <b>다른 곳</b>에 적어 두세요. 되찾을 때 파일과 코드가 둘 다 필요해요.</p>'
    + '<div class="codebox"><code>' + CODE + '</code><button class="btn" data-act="copy">' + I.copy + (s.copied ? ' 복사됨' : ' 복사') + '</button></div>'
    + '<p class="sub">클립보드는 30초 뒤 비워져요.</p></div>',
  confirm: () => '<div class="part ' + (s.copied ? '' : 'off') + '"><p>적어 둔 코드를 입력해서 제대로 저장했는지 확인해요.</p>'
    + '<div class="field"><label>복구 코드</label><input class="code-input" data-fk="code" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" value="' + s.typed + '" spellcheck="false" autocomplete="off"></div>'
    + (s.confirmed ? '<p class="ok-line">코드가 맞아요.</p>' : '<button class="btn" data-act="fill">(시안) 코드 채우기</button>') + '</div>',
};

function screen(id) {
  if (id === 'start') return '<div class="start"><div class="hero-icon">' + I.shield + '</div><h1>새 데이터 보호 설정</h1>'
    + '<p>새 계정의 할 일은 이 기기에서 암호화된 뒤 동기화돼요. 이 기기의 잠금 방법과, 기기를 잃어버렸을 때 쓸 복구 자료를 준비하면 시작할 수 있어요.</p>'
    + '<div class="account"><span class="avatar">J</span><span>shyunku · 로그인됨</span></div>'
    + '<ul class="steps-list">' + counted().map(x => '<li>' + LABEL[x] + '</li>').join('') + '</ul>'
    + '<button class="btn primary block" data-act="next">시작하기</button>'
    + '<div class="bottom"><button class="link logout">다른 계정으로 로그인</button></div></div>';
  if (id === 'lock') return head('lock') + '<div class="body"><p>앱을 열 때 이 방법으로 본인을 확인해요. 나중에 설정에서 바꿀 수 있어요.</p>'
    + '<div class="option ' + (s.lock === 'os' ? 'on' : '') + '" data-act="lock:os"><span class="radio"></span><span><b>Windows Hello</b><span>얼굴·지문·PIN으로 열어요.</span></span></div>'
    + '<div class="option ' + (s.lock === 'both' ? 'on' : '') + '" data-act="lock:both"><span class="radio"></span><span><b>Windows Hello + 비밀번호</b><span>Windows Hello를 쓸 수 없을 때 비밀번호로도 열 수 있어요.</span></span></div>'
    + (s.lock === 'both' ? '<div class="field"><label>비밀번호 (12자 이상)</label><input type="password" value="••••••••••••"></div><div class="field"><label>비밀번호 확인</label><input type="password" value="••••••••••••"></div>' : '')
    + '<div class="callout info">이 잠금은 이 기기에만 적용돼요. 로그인 비밀번호와는 별개예요.</div></div>'
    + foot('next', s.lock === 'os' ? 'Windows Hello로 설정' : '설정', false, s.intro === 'show');
  if (id === 'file') return head('file') + '<div class="body">' + parts.file() + '</div>' + foot('next', '다음', !s.fileSaved);
  if (id === 'code') return head('code') + '<div class="body">' + parts.code().replace(' off', '') + '</div>' + foot('next', '적어 뒀어요', !s.copied);
  if (id === 'confirm') return head('confirm') + '<div class="body">' + parts.confirm().replace(' off', '') + '</div>' + foot('next', '확인', !s.confirmed);
  if (id === 'recovery') return head('recovery') + '<div class="body"><div class="part"><h2>1. 복구 파일</h2></div>' + parts.file()
    + '<div class="part"><h2>2. 복구 코드</h2></div>' + parts.code() + '<div class="part"><h2>3. 확인</h2></div>' + parts.confirm() + '</div>'
    + foot('next', '다음', !s.confirmed);
  if (id === 'register') return head('register') + '<div class="body"><p>이 기기의 공개 연결 정보만 서버에 등록해요. 복구 코드와 데이터는 보내지 않아요.</p>'
    + (s.registered ? '<p class="ok-line">서버 연결을 확인했어요.</p>' : '<button class="btn" data-act="register">등록 확인</button>') + '</div>'
    + foot('next', '다음', !s.registered);
  if (id === 'finish') return head('finish') + '<div class="body"><p>잠금 방법과 복구 자료를 준비했어요. 이제 빈 암호화 저장소로 시작해요.</p>'
    + (s.final === 'merged' ? '<p class="sub">시작하면 이 기기의 공개 연결 정보를 서버에 등록해요. 복구 코드와 데이터는 보내지 않아요.</p>' : '')
    + '<div class="callout warn">복구 파일과 복구 코드는 둘 다 있어야 데이터를 되찾을 수 있어요. 한쪽만 있으면 열 수 없어요.</div></div>'
    + foot('start', s.started ? '시작하는 중…' : '시작하기', s.started);
  if (id === 'done') return '<div class="finish"><div class="ok">✓</div><h1>준비 끝</h1><p>이제 할 일을 추가해 보세요.</p><p class="muted">(시안: 실제 앱은 여기서 메인 화면으로 넘어가요)</p><button class="btn" data-act="restart" style="margin-top:18px">처음부터 다시 보기</button></div>';
  return '';
}

const OPTS = [
  { key: 'intro', title: '처음 화면', at: '.start, .head .kicker',
    items: [['none', '바로 잠금 방법', '지금처럼 첫 화면이 잠금 방법 고르기', 'old'], ['show', '안내 화면 먼저', '할 일 단계 미리보기 · 다른 계정으로 로그인 (기기 연결 첫 화면과 같은 모양)', 'rec']] },
  { key: 'recovery', title: '복구 자료 단계', at: '.steps, .file-row, .codebox',
    items: [['one', '한 단계 안에서 차례로', '지금처럼 파일 · 코드 · 확인을 한 화면에서', 'old'], ['split', '세 단계로 나눔', '파일 저장 → 코드 저장 → 코드 확인, 한 화면에 한 가지', 'rec']] },
  { key: 'final', title: '서버 등록과 시작', at: '.foot',
    items: [['separate', '따로 누름', '지금처럼 "등록 확인" 뒤 "시작하기"', 'old'], ['merged', '시작하기 한 번', '"시작하기"를 누르면 등록하고 바로 시작', 'rec']] },
];

function go(delta) { const list = steps(), i = list.indexOf(s.screen); s.screen = list[Math.max(0, Math.min(list.length - 1, i + delta))]; render(); }
function restart() { Object.assign(s, { fileSaved: false, copied: false, confirmed: false, registered: false, started: false, typed: '' }); s.screen = steps()[0]; render(); }

const comments = {};
let shiftOn = false, optAt = null;
function render() {
  if (!steps().includes(s.screen) && s.screen !== 'done') s.screen = steps()[0];
  const sc = document.querySelector('.n-scroll')?.scrollTop ?? 0;
  document.getElementById('stage').innerHTML = '<div class="window"><div class="titlebar"><span>Thread</span><span>– ×</span></div><section class="screen on">' + screen(s.screen) + '</section></div>'
    + '<aside class="notes"><div class="n-top"><button class="n-copy" data-ncopy>결과 복사</button><p class="hint"><kbd>Shift</kbd>+마우스로 파란 점선의 후보 보기</p></div><div class="n-scroll">'
    + OPTS.map((o, i) => '<section class="n-item"><h4>' + (i + 1) + '. ' + o.title + '</h4>' + o.items.map(([v, nm, ds, tag]) => {
        const on = s[o.key] === v;
        return '<div class="n-row ' + (on ? 'on' : '') + '" role="button" tabindex="0" data-no="' + i + '" data-v="' + v + '"><span class="n-nm">' + nm + (tag === 'old' ? '<span class="nbadge old">기존</span>' : tag === 'rec' ? '<span class="nbadge rec">추천</span>' : '') + '</span><span class="n-ds">' + ds + '</span>'
          + (on ? '<textarea class="n-cm" rows="1" data-cm="' + i + ':' + v + '" placeholder="추가 의견 (선택)" spellcheck="false">' + (comments[i + ':' + v] || '').replace(/</g, '&lt;') + '</textarea>' : '') + '</div>';
      }).join('') + '</section>').join('')
    + '</div><label class="n-new"><input type="checkbox" data-nnew ' + (document.body.classList.contains('show-new') ? 'checked' : '') + '>새로 생기는 부분 표시</label></aside>';
  document.querySelector('.n-scroll').scrollTop = sc;
  document.querySelectorAll('.n-cm').forEach(grow);
  markHot();
}
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };
function markHot() {
  document.querySelectorAll('.window .hot').forEach(el => el.classList.remove('hot'));
  document.querySelectorAll('.window [data-opts]').forEach(el => delete el.dataset.opts);
  OPTS.forEach((o, i) => document.querySelectorAll('.window ' + o.at.split(', ').join(', .window ')).forEach(el => { if (!el.dataset.opts) el.dataset.opts = i; }));
  if (!shiftOn) return;
  document.querySelectorAll('.window button, .window input, .window [data-act]').forEach(el => { if (!el.dataset.opts && !el.closest('[data-opts]')) el.classList.add('hot'); });
}
const optPop = document.getElementById('optpop');
const hideOpt = () => { optPop.classList.remove('on'); optAt = null; };
function showOpt(el, x, y) {
  const i = +el.dataset.opts, o = OPTS[i]; optAt = el;
  optPop.innerHTML = '<b>' + o.title + '</b>' + o.items.map(([v, nm, , tag]) => '<button class="' + (s[o.key] === v ? 'on' : '') + '" data-v="' + v + '">' + nm + (tag === 'old' ? '<span class="nbadge old">기존</span>' : tag === 'rec' ? '<span class="nbadge rec">추천</span>' : '') + '</button>').join('');
  optPop.dataset.o = i; optPop.classList.add('on');
  optPop.style.left = Math.max(8, Math.min(innerWidth - optPop.offsetWidth - 8, x - 12)) + 'px';
  optPop.style.top = Math.max(8, Math.min(innerHeight - optPop.offsetHeight - 8, y - 12)) + 'px';
}
function choose(i, v) {
  const o = OPTS[i]; s[o.key] = v;
  // Show where the choice applies.
  if (o.key === 'intro') s.screen = steps()[0];
  if (o.key === 'recovery') s.screen = v === 'split' ? 'file' : 'recovery';
  if (o.key === 'final') s.screen = 'finish';
  render();
}
const setShift = on => { if (shiftOn === on) return; shiftOn = on; document.body.classList.toggle('shift-on', on); markHot(); };
document.addEventListener('keydown', e => { if (e.key === 'Shift') setShift(true); if (e.key === 'Escape') hideOpt(); });
document.addEventListener('keyup', e => { if (e.key === 'Shift') setShift(false); });
window.addEventListener('blur', () => setShift(false));
document.addEventListener('mousemove', e => {
  if (!e.shiftKey || optPop.contains(e.target)) return;
  const el = e.target.closest('.window [data-opts]');
  if (el && el !== optAt) showOpt(el, e.clientX, e.clientY);
});
document.addEventListener('pointerdown', e => { if (optAt && !optPop.contains(e.target)) hideOpt(); }, true);
optPop.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +optPop.dataset.o, x = parseFloat(optPop.style.left) + 12, y = parseFloat(optPop.style.top) + 12;
  choose(i, b.dataset.v);
  const el = document.querySelector('.window [data-opts="' + i + '"]');
  if (el) showOpt(el, x, y); else hideOpt();
});
document.addEventListener('click', e => {
  if (document.body.classList.contains('shift-on') || e.target.closest('.opt-pop')) return;
  const a = e.target.closest('.window [data-act]');
  if (a && !a.disabled) {
    const k = a.dataset.act;
    if (k === 'next') go(1);
    else if (k === 'back') go(-1);
    else if (k.startsWith('lock:')) { s.lock = k.slice(5); render(); }
    else if (k === 'save') { s.fileSaved = true; render(); }
    else if (k === 'copy') { s.copied = true; render(); }
    else if (k === 'fill') { s.typed = CODE; s.confirmed = true; render(); }
    else if (k === 'register') { s.registered = true; render(); }
    else if (k === 'start') { s.started = true; render(); setTimeout(() => { s.screen = 'done'; render(); }, 700); }
    else if (k === 'restart') restart();
    return;
  }
  if (e.target.closest('.n-cm')) return;
  const row = e.target.closest('.n-row');
  if (row) {
    choose(+row.dataset.no, row.dataset.v);
    const f = document.querySelector('.n-cm[data-cm="' + row.dataset.no + ':' + row.dataset.v + '"]');
    if (f) { f.focus({ preventScroll: true }); f.setSelectionRange(f.value.length, f.value.length); }
    return;
  }
  const copy = e.target.closest('[data-ncopy]');
  if (copy) {
    const text = '#75 새 계정 데이터 설정 시안 선택\n' + OPTS.map((o, i) => { const k = o.items.find(([v]) => v === s[o.key]); const c = (comments[i + ':' + k[0]] || '').trim(); return (i + 1) + '. ' + o.title + ': ' + k[1] + (c ? ' (의견: ' + c + ')' : ''); }).join('\n');
    const done = () => { copy.textContent = '복사됨'; copy.classList.add('done'); setTimeout(() => { copy.textContent = '결과 복사'; copy.classList.remove('done'); }, 1400); };
    const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
});
document.addEventListener('input', e => {
  if (e.target.matches('.n-cm')) { comments[e.target.dataset.cm] = e.target.value; grow(e.target); }
  if (e.target.matches('[data-fk="code"]')) { s.typed = e.target.value; const ok = s.typed.trim().toUpperCase() === CODE; if (ok !== s.confirmed) { s.confirmed = ok; render(); const f = document.querySelector('[data-fk="code"]'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
});
document.addEventListener('change', e => { if (e.target.matches('[data-nnew]')) document.body.classList.toggle('show-new', e.target.checked); });
render();
</script>
</body>
</html>

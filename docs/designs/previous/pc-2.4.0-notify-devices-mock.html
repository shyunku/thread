const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- PC settings ----------
function pcShell(active, content, extra = '') {
  const tabs = [['general', '일반'], ...(s.pcPlace === 'tab' ? [['bell', '알림']] : []), ['data', '데이터'], ['system', '시스템'], ['account', '계정'], ['about', '정보']];
  return `<div class="win set">
    <button class="close" aria-label="닫기">${sv('<path d="M6 6l12 12M18 6 6 18"/>', 1.8)}</button>
    <aside class="side"><div class="st">설정</div><nav class="menu">${tabs.map(([k, l]) => `<button class="mi ${k === active ? 'on' : ''}" data-act="tab" data-k="${k}">${I[k]}<span>${l}</span></button>`).join('')}</nav></aside>
    <main class="mc" data-sc="${active}">${content}</main>${extra}</div>`;
}
const head = (t, d, a = '') => `<header class="sp-head"><div><h2>${t}</h2><p>${d}</p></div>${a}</header>`;
const srow = (lb, ds, ctl = '', ic = '', cls = '') => `<div class="srow ${cls}">${ic ? `<div class="ic">${ic}</div>` : ''}<div class="tx"><div class="lb">${lb}</div>${ds ? `<div class="ds">${ds}</div>` : ''}</div>${ctl ? `<div class="ctl">${ctl}</div>` : ''}</div>`;
const seg = (opts, on, extra = '') => `<div class="seg ${extra}">${opts.map(([v, l]) => `<button class="${v === on ? 'on' : ''}" ${extra.includes('min') ? `data-act="min" data-v="${v}"` : ''}>${l}</button>`).join('')}</div>`;
const tog = (on, k) => `<button class="tog ${on ? 'on' : ''}" ${k ? `data-act="tog" data-k="${k}"` : ''}></button>`;

function timeDisplay() {
  const due = [['묶음 맞춤', '오후 3:00 · 내일 오후 5:30 · 10월 26일', true], ['간단히', '오늘 · 내일 · 10월 26일'], ['자동', '오후 3:00 · 내일 오후 5:30 · 토 오후 3:00'], ['정확히', '10월 26일 오후 2:45'], ['자세히', '2026년 10월 26일 (일) 오후 2:45']];
  const rem = [['간단히', '1일 · 34일 · 1시간'], ['보통', '1일 4시간 · 34일 23시간 · 1시간'], ['자세히', '1일 4시간 12분 · 34일 23시간 2분'], ['모두', '1일 4시간 12분 8초']];
  const ch = (list, on) => `<div class="chs">${list.map(([n, ex, tag], i) => `<button class="ch ${i === on ? 'on' : ''}"><span class="rd"></span><span class="nm">${n}${tag ? '<em>새 기본값</em>' : ''}</span><span class="ex">${ex}</span></button>`).join('')}</div>`;
  const pr = (t, c, col, d, r, star) => `<div class="r"><span class="ck"></span><div class="t"><div class="tt">${t}</div><div class="mt"><i class="dot" style="background:${col}"></i>${c}</div></div><div class="tm">${d}<span class="rm">${r}</span></div><span class="star ${star ? 'on' : ''}">${star ? '★' : '☆'}</span></div>`;
  return `<div class="tdisp"><div class="tx"><div class="lb" style="font-size:14px;font-weight:600">시간 표시</div><div class="ds" style="color:var(--secondary);font-size:12.5px">할 일 목록 오른쪽 칸 위에는 기한, 아래에는 남은 시간을 연하게 보여 줘요.</div></div>
    <div class="lbl">미리 보기</div><div class="tprev">${pr('주간 보고서 제출', '업무', '#6294ff', '오전 11:10', '3시간 40분 지남', false)}${pr('분기 회고 자료 정리', '업무', '#6294ff', '오후 5:50', '2시간 59분', true)}${pr('운동 30분', '생활', '#44c98b', '내일 오후 7:02', '1일 4시간', false)}</div>
    <div class="lbl">기한</div>${ch(due, 0)}
    <div class="lbl">남은 시간<span class="sw">${tog(true)}<span>보이기</span></span></div>${ch(rem, 1)}</div>`;
}
function notifCard() {
  return `<div class="card">
    ${srow('기한 전에 알림', '기한이 다가오면 미리 Windows 알림으로 알려 줘요.', seg(MINS.map(m => [m, minText(m)]), s.min, 'min' + (s.before ? '' : ' off')) + tog(s.before, 'before'))}

}
function frame1() {

  const general = `<div class="card">
      ${srow('시작할 때 보기', '앱을 열면 처음 보여 줄 화면', seg([['list', '목록'], ['cal', '캘린더'], ['tl', '타임라인']], 'list'))}
      ${srow('주 시작 요일', '캘린더의 첫 번째 열', seg([[0, '일요일'], [1, '월요일']], 0))}

      ${srow('테마<span class="soon">준비 중</span>', '다크, 라이트, 시스템 설정 따르기', seg([['d', '다크'], ['l', '라이트'], ['s', '시스템']], 'd', 'off'))}
      ${srow('업데이트 후 변경 내용 보기', '새 버전으로 바뀐 뒤 처음 열 때 바뀐 점을 창으로 보여 줘요.', tog(true))}

  const sec = s.pcPlace === 'general' ? `<section class="sec notif-sec" id="notif-sec"><div class="sec-head"><h3>알림</h3></div>${notifCard()}</section>` : '';
  return pcShell('general', head('일반', '앱의 기본 동작을 정합니다.') + general + sec);

function devName(d) {
  const n = esc(nameOf(d));
  if (s.pcRename === 'inline') {
    if (s.pcEdit === d.id) return `<input class="nmin" data-id="${d.id}" value="${n}" placeholder="${d.model}" spellcheck="false"><span class="kbh"><kbd>Enter</kbd> 저장 · <kbd>Esc</kbd> 취소</span>`;
    return `<span class="dname"><button class="nmb" data-act="pcEdit" data-id="${d.id}" title="눌러서 이름 바꾸기">${n}${idTag(d)}${I.pen.replace('<svg', '<svg class="pen"')}</button></span>`;
  }
  return `<span class="dname"><span>${n}</span>${idTag(d)}</span>`;
}
function devRows() {
  const old = s.pcRename === 'none' || s.idShow === 'none';
  return DEV.map(d => {

    const ds = [d.role === 'read' ? '보기만 가능' : '편집 가능', own ? '현재 사용 중' : `${d.added} 연결`].join(' · ');
    if (old) return srow(own ? '이 PC' : `다른 기기 · ${d.id}`, ds, own ? '<span class="badge">이 기기</span>' : '<button class="btn danger">해제</button>', I.pc);
    let ctl = own ? '<span class="badge">이 기기</span>' : '<button class="btn danger">해제</button>';
    if (s.pcRename === 'menu') {
      ctl = (own ? '<span class="badge">이 기기</span>' : '') + `<button class="more ${s.pcMenu === d.id ? 'on' : ''}" data-act="pcMenu" data-id="${d.id}" title="더 보기">${I.dots}</button>`;
      if (s.pcMenu === d.id) ctl += `<div class="ctx" style="right:14px;top:46px"><button data-act="pcRen" data-id="${d.id}">${I.pen}이름 바꾸기</button>${own ? '' : `<button class="dg">${I.unlink}기기 해제</button>`}</div>`;
    }
    return `<div class="srow dev" style="position:relative" data-id="${d.id}"><div class="ic">${d.kind === 'pc' ? I.pc : I.phone}</div><div class="tx"><div class="lb">${devName(d)}</div><div class="ds">${ds}</div></div><div class="ctl">${ctl}</div></div>`;
  }).join('');
}

      ${srow('복구 키', '모든 기기를 잃었을 때 데이터를 되찾는 파일과 코드입니다.', '<button class="btn">새로 만들기</button>', I.key)}
    </div></section>`;

// ---------- Windows toasts ----------
const NOW = '오후 2:50';
function beforeBody(time) { return s.toast === 'b' ? `${time}까지 · ${minText(s.min)} 남음` : `${minText(s.min)} 뒤 기한 · ${time}`; }
const toast = (t, x) => `<div class="toast"><div class="th"><img src="${ICON}" alt=""><span>Thread</span><span class="sp"></span><span class="tb">···</span><span class="tb">✕</span></div><div class="tbd"><div class="tt">${t}</div>${x ? `<div class="tx">${x}</div>` : ''}</div></div>`;
const taskbar = () => `<div class="taskbar"><span class="tbi"><i style="background:#4cc2ff;border-radius:3px"></i></span><span class="tbi"><i></i></span><span class="tbi"><i></i></span><span class="tbi"><i></i></span><span class="sp"></span><span class="tray">⌃<img src="${ICON}" alt=""><span>📶</span></span><span class="clk">${NOW}<br>2026-10-24</span></div>`;
function frame2(kind) {
  let inner;
  if (s.toast === 'none') inner = `<div class="gone toast-slot">알림 없음 (지금 앱에는 기한 알림이 없어요)</div>`;
  else if (kind === 'plain') inner = `<div class="stack toast-slot">${toast('분기 회고 자료 정리', beforeBody('오후 3:00'))}${toast('주간 보고서 제출', `지금 기한이에요 · ${NOW}`)}</div>`;
  else inner = `<div class="stack toast-slot">${toast(`할 일 1개의 기한이 ${minText(s.min)} 남았어요`, '')}${toast(`할 일 1개의 기한이 ${minText(s.min)} 남았어요`, '앱 잠금을 풀면 볼 수 있어요')}</div>`;
  return `<div class="win desk">${inner}${taskbar()}</div>`;
}

  return `<div class="m-dev ${pressed ? 'pressed' : ''}" data-act="mTap" data-id="${d.id}">${d.kind === 'pc' ? I.mmon : I.mphone}<div class="g"><div class="t"><span class="dname">${esc(nameOf(d))}${idTag(d)}</span></div><div class="d">${own ? '이 휴대폰 · 처음 만든 기기' : `${d.added} 연결${d.role === 'read' ? ' · 보기만' : ''}`}</div></div>${I.chev.replace('<svg', '<svg class="chev"')}</div>`;

    const d = DEV.find(x => x.id === s.mSel) || DEV[1];
    const info = `<div class="m-it"><div class="g"><div class="t">연결</div></div><span class="v">${d.added || '—'}</span></div><div class="m-it" style="border-bottom:0"><div class="g"><div class="t">권한</div></div><span class="v">${d.role === 'read' ? '보기만' : '보기·편집'}</span></div>
      <p class="m-body">잃어버렸거나 더 안 쓰는 기기면 해제하세요. 해제하면 새 복구 키를 만들고 데이터를 새 키로 다시 잠가요.</p>
      <button class="m-btn danger">기기 해제</button><button class="m-btn ghost">닫기</button>`;
    if (old) ui = `<div class="m-scrim"></div><div class="m-sheet m-ui"><div class="grab"></div><h2>다른 기기 · ${d.raw}</h2>${info}</div>`;
    else if (s.mRename === 'sheet') ui = `<div class="m-scrim"></div><div class="m-sheet m-ui"><div class="grab"></div><h2>${esc(nameOf(d))}${idTag(d)}</h2>
      <div class="m-flabel">이름</div><input class="m-field" data-id="${d.id}" value="${esc(nameOf(d))}" placeholder="${d.model}" spellcheck="false">
      <p class="m-fhelp">비워 두면 모델 이름(${d.model})으로 보여요. 연결된 모든 기기에서 같은 이름으로 보여요.</p>
      <button class="m-btn primary" data-act="mSave">이름 저장</button>${info}</div>`;
    else ui = `<div class="m-pop m-ui" data-for="${d.id}"><button data-act="mRen">${I.pen}이름 바꾸기</button><button>${I.info}자세히 보기</button><button class="dg">${I.unlink}기기 해제</button></div>`;
  }
  return `<div class="win phone">${stbar()}${body}${ui}<div class="gesture"></div></div>`;
}

function frame5() {
  let list;
  if (s.toast === 'none') list = `<div class="gone toast-slot">알림 없음 (지금 앱에는 기한 알림이 없어요)</div>`;
  else {
    const card = (t, x, w = '지금') => `<div class="ncard"><div class="nh"><span class="ai">T</span><span>Thread</span><span>·</span><span>${w}</span><span class="sp"></span><span class="ex">${I.down}</span></div><div class="nt">${t}</div>${x ? `<div class="nx">${x}</div>` : ''}</div>`;
    list = `<div class="nlist toast-slot">${card('분기 회고 자료 정리', beforeBody('오후 3:00'))}${card('주간 보고서 제출', `지금 기한이에요 · ${NOW}`)}${card(`할 일 1개의 기한이 ${minText(s.min)} 남았어요`, '', '3분 전')}</div>`;
  }
  return `<div class="win phone shade"><div class="veil"></div>${stbar()}
    <div class="sh-top"><div class="date">10월 24일 토요일</div>
      <div class="qs"><div class="on">${I.wifi}<span>인터넷<small>Home-5G</small></span></div><div class="on">${I.bt}<span>블루투스<small>켜짐</small></span></div><div>${I.moon}<span>방해 금지<small>꺼짐</small></span></div><div>${I.torch}<span>손전등<small>꺼짐</small></span></div></div>
      <div class="bright"><i></i></div></div>
    ${list}
    ${s.toast === 'none' ? '' : '<div class="nfoot"><button>관리</button><button>모두 지우기</button></div>'}
    <div class="gesture"></div></div>`;
}

// ---------- Layout ----------
const fr = (cap, html, cls = '') => `<div class="fr ${cls}"><div class="cap">${cap}</div>${html}</div>`;
function notes() {
  return `<aside class="notes"><p class="hint"><kbd>Shift</kbd>를 누른 채 파란 점선에 마우스를 올리면 후보가 나와요. 열 때 보이는 것이 추천안이에요.</p>
    <h3>정할 것</h3><ul>
      <li>PC 알림 설정 위치: 일반 안 "알림" 묶음 / 따로 "알림" 탭 — ① 왼쪽 메뉴나 알림 묶음</li>
      <li>"N분 전" 알림 문구 — ② 토스트, ⑤ 안드로이드 알림</li>
      <li>PC 기기 이름 바꾸기: 이름 눌러 바로 고치기 / ⋯ 메뉴 → 창 — ③ 연결된 기기 목록</li>
      <li>모바일 기기 이름 바꾸기: 눌러서 시트 / 길게 눌러 메뉴 — ⑥ 기기 목록, 시트</li>
      <li>짧은 기기 id를 이름 옆에 언제 보일지(겹칠 때만 / 늘) — ③⑥ 기기 이름</li>
    </ul></aside>`;
}
function render() {
  const keep = {};
  document.querySelectorAll('[data-sc]').forEach(el => { keep[el.dataset.sc] = el.scrollTop; });
  document.getElementById('stage').innerHTML = [
    fr('<b>① PC 설정 · 알림</b>설정 창 실제 크기(1440×960 창 기준 1080×800)', frame1(), 'f1'),
    notes(),
    '<div class="brk"></div>',
    `<div class="fr f2"><div class="cap"><b>② Windows 알림</b>왼쪽: 일반 할 일(10분 전 · 기한 시각) / 오른쪽: 위 비밀 카테고리, 아래 앱이 잠겨 있을 때. 누르면 앱이 열리고 그 할 일을 골라요.</div><div class="pair">${frame2('plain')}${frame2('hidden')}</div></div>`,
    fr('<b>③ PC 설정 · 데이터 → 연결된 기기</b>모든 PC에서 보여요. 이름을 고치는 중(회사 노트북)', frame3(), 'f3'),
    '<div class="brk"></div>',
    `<div class="fr f4"><div class="cap"><b>④ 모바일 설정 · 알림</b>왼쪽: 알림 권한이 꺼진 상태 / 오른쪽: "얼마나 전에" 고르기</div><div class="pair">${mSettings(false)}${mSettings(true)}</div></div>`,
    fr('<b>⑤ 안드로이드 알림</b>N분 전 · 기한 시각 · 비밀 카테고리', frame5(), 'f5'),
    `<div class="fr f6"><div class="cap"><b>⑥ 모바일 데이터 → 연결된 기기</b>왼쪽: 목록 / 오른쪽: 이름 바꾸기(회사 노트북)</div><div class="pair">${mData(false)}${mData(true)}</div></div>`,
  ].join('');
  document.querySelectorAll('[data-sc]').forEach(el => {
    if (keep[el.dataset.sc] != null) el.scrollTop = keep[el.dataset.sc];
    else if (el.dataset.sc === 'general') { const sec = el.querySelector('#notif-sec'); el.scrollTop = sec ? sec.offsetTop - 260 : el.scrollHeight; }
    else if (el.dataset.sc.startsWith('m4')) { const g = el.querySelector('#m-notif'); el.scrollTop = g.offsetTop - 150; }
  });
  // Long-press menu sits just under the pressed row.
  document.querySelectorAll('.m-pop[data-for]').forEach(p => {
    const ph = p.closest('.phone'), row = ph.querySelector('.m-dev[data-id="' + p.dataset.for + '"]');
    if (row) p.style.top = Math.round(row.getBoundingClientRect().bottom - ph.getBoundingClientRect().top - 10 + 4) + 'px';
  });
  markHot();
  const inp = document.querySelector('.nmin, .dlg .in');
  if (inp && render.focus) { inp.focus(); inp.select(); render.focus = false; }
}
function saveName(id, v) { v = v.trim(); const d = DEV.find(x => x.id === id); if (!v || v === d.model) delete s.names[id]; else s.names[id] = v.slice(0, 40); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || e.target.closest('.opt-pop')) return;
  const { act, k, v, id } = a.dataset;
  if (act === 'tog') s[k] = !s[k];
  else if (act === 'min') { if (!s.before) return; s.min = +v; }
  else if (act === 'mMinOpen') { if (!s.before) return; }
  else if (act === 'tab') return;
  else if (act === 'pcEdit') { s.pcEdit = id; render.focus = true; }
  else if (act === 'pcMenu') s.pcMenu = s.pcMenu === id ? null : id;
  else if (act === 'pcRen') { s.pcMenu = null; s.pcDialog = id; render.focus = true; }
  else if (act === 'dlgX') s.pcDialog = null;
  else if (act === 'dlgOk') { saveName(s.pcDialog, document.querySelector('.dlg .in').value); s.pcDialog = null; }
  else if (act === 'mTap') s.mSel = id;
  else if (act === 'mSave') saveName(s.mSel, document.querySelector('.m-field').value);
  else if (act === 'mRen') return;
  else if (act === 'mPerm') s.mPerm = true;
  render();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches?.('.nmin')) {
    if (e.key === 'Enter') { saveName(t.dataset.id, t.value); s.pcEdit = null; render(); }
    else if (e.key === 'Escape') { s.pcEdit = null; render(); }
  } else if (t.matches?.('.dlg .in')) {
    if (e.key === 'Enter') { saveName(s.pcDialog, t.value); s.pcDialog = null; render(); }
    else if (e.key === 'Escape') { s.pcDialog = null; render(); }
  } else if (t.matches?.('.m-field') && e.key === 'Enter') { saveName(s.mSel, t.value); render(); }
});

// Choices shown on Shift + hover. at: where they sit; key: the state they set.
const OPTS = [
  { at: '.f1 .menu, .f1 .notif-sec', key: 'pcPlace', title: 'PC 알림 설정 위치', items: [['general', '설정 > 일반 안 "알림" 묶음 (추천)'], ['tab', '따로 "알림" 탭'], ['none', '기존(없음)']] },
  { at: '.toast-slot', key: 'toast', title: '"N분 전" 알림 문구', items: [['a', '"10분 뒤 기한 · 오후 3:00" (추천)'], ['b', '"오후 3:00까지 · 10분 남음"'], ['none', '기존(알림 없음)']] },
  { at: '.f3 .dev-card', key: 'pcRename', title: 'PC 기기 이름 바꾸기', items: [['inline', '이름 눌러 바로 고치기 · Enter 저장, Esc 취소 (추천)'], ['menu', '⋯ 메뉴 → "이름 바꾸기" 창'], ['none', '기존("다른 기기 · 4D6B", 못 바꿈)']] },
  { at: '.f6 .m-devs, .f6 .m-ui', key: 'mRename', title: '모바일 기기 이름 바꾸기', items: [['sheet', '눌러서 아래 시트에서 고치기 (추천)'], ['long', '길게 눌러 메뉴 → 이름 바꾸기'], ['none', '기존("다른 기기 · 7be0…a1c2", 못 바꿈)']] },
  { at: '.dname', key: 'idShow', title: '짧은 기기 id', items: [['dup', '이름이 겹칠 때만 (기록된 결정)'], ['always', '늘 작게'], ['none', '기존(이름 없이 id만)']] },
];
let shiftOn = false;
function markHot() {
  document.querySelectorAll('.win .hot').forEach(el => el.classList.remove('hot'));
  OPTS.forEach((o, i) => document.querySelectorAll(o.at).forEach(el => { el.dataset.opts = i; }));
  if (!shiftOn) return;
  document.querySelectorAll('.win *').forEach(el => { if (!el.dataset.opts && getComputedStyle(el).cursor === 'pointer' && getComputedStyle(el.parentElement).cursor !== 'pointer') el.classList.add('hot'); });
}
(() => {
  const pop = document.getElementById('optpop');
  let at = null, timer = 0;
  const hide = () => { pop.classList.remove('on'); at = null; };
  const show = el => {
    const o = OPTS[+el.dataset.opts]; at = el;
    pop.innerHTML = '<b>' + o.title + '</b>' + o.items.map(([v, l]) => '<button class="' + (s[o.key] === v ? 'on' : '') + '" data-v="' + v + '">' + l + '</button>').join('');
    const r = el.getBoundingClientRect(); pop.classList.add('on');
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
    pop.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
  };
  const setShift = on => { if (shiftOn === on) return; shiftOn = on; document.body.classList.toggle('shift-on', on); markHot(); };
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setShift(true); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setShift(false); });
  window.addEventListener('blur', () => setShift(false));
  document.addEventListener('mousemove', e => {
    if (pop.contains(e.target)) { clearTimeout(timer); return; }
    const el = e.shiftKey ? e.target.closest('.win [data-opts]') : null;
    if (el) { clearTimeout(timer); if (el !== at) show(el); return; }
    if (at && !at.contains(e.target)) { clearTimeout(timer); timer = setTimeout(hide, 300); }
  });
  pop.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !at) return;
    e.stopPropagation();
    const o = OPTS[+at.dataset.opts], raw = b.dataset.v, v = typeof o.items[0][0] === 'number' ? +raw : raw;
    s[o.key] = v;
    hide(); render();
  });
})();
render();
</script>
</body>
</html>

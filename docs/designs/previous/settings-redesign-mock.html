<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread 설정 개편 시안 (#70)</title>
<style>
  :root {
    --canvas: #101216; --panel: #15181e; --surface: #1c2028; --hover: #252b36; --border: #2b303b;
    --text: #edf1f7; --secondary: #a0aaba; --muted: #8792a4; --accent: #6294ff; --selected: #253858;
    --success: #70d5a0; --warning: #edbc72; --danger: #f0838b; --radius: 10px;
    /* Sync pending: warning shifted slightly toward orange */
    --pending: #f0a65e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: var(--text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .toolbar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 10px 16px; background: #0b0d10ee; border-bottom: 1px solid var(--border); backdrop-filter: blur(6px); }
  .toolbar strong { margin-right: 8px; font-size: 13px; color: var(--secondary); }
  .toolbar button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); font-size: 12px; color: var(--secondary); }
  .toolbar button.on { background: var(--selected); border-color: #3a5486; color: var(--text); }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  .stage { display: flex; gap: 24px; align-items: flex-start; justify-content: center; padding: 32px 16px 64px; }
  .notes { width: 300px; flex: 0 0 300px; padding: 16px 18px; border: 1px dashed #3a4252; border-radius: 12px; color: var(--secondary); font-size: 13px; }
  .notes h3 { margin: 0 0 8px; font-size: 13px; color: var(--text); }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 4px 0; }

  /* Window frame that simulates the app window width */
  .window { position: relative; height: 760px; border-radius: 12px; background: var(--canvas); border: 1px solid #222731; overflow: hidden; flex: 0 0 auto; }
  .window.w1280 { width: 1080px; } .window.w900 { width: 760px; }
  .window::before { content: "Thread"; position: absolute; inset: 0 0 auto 0; height: 34px; padding: 8px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid #1d2129; }

  /* Settings modal */
  .settings { position: absolute; inset: 60px 28px 28px; display: flex; border: 1px solid #354051; border-radius: 14px; background: #151a23; overflow: hidden; box-shadow: 0 20px 60px #0008; }
  .side { width: 196px; flex: 0 0 196px; padding: 18px 10px; background: #12161d; border-right: 1px solid #262d39; }
  .side .title { padding: 2px 10px 14px; font-size: 15px; font-weight: 700; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; gap: 10px; align-items: center; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--secondary); text-align: left; }
  .nav button:hover { background: var(--hover); color: var(--text); }
  .nav button.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .nav svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .main { position: relative; flex: 1; min-width: 0; overflow: auto; padding: 22px 28px 28px; }
  .close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--secondary); font-size: 18px; }
  .close:hover { background: var(--hover); }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 40px 18px 0; }
  .page-head h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .page-head p { margin: 2px 0 0; color: var(--secondary); font-size: 13px; }

  .section { margin-top: 18px; }
  .section > h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .grow { flex: 1; min-width: 0; }
  .row .label { font-weight: 600; color: var(--text); }
  .row .desc { color: var(--secondary); font-size: 12.5px; }
  .row .icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: #252b36; color: var(--secondary); flex: 0 0 30px; }
  .row .icon svg { width: 16px; height: 16px; }

  .btn { height: 32px; padding: 0 12px; border: 1px solid #39414f; border-radius: 8px; background: #232a35; color: var(--text); font-size: 13px; white-space: nowrap; }
  .btn:hover { background: #2b3441; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1222; font-weight: 600; }
  .btn.primary:hover { background: #79a5ff; }
  .btn.danger { background: none; border-color: #5a3238; color: var(--danger); }
  .btn.ghost { background: none; border-color: transparent; color: var(--secondary); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); }
  .summary > div { padding: 14px 18px 18px; }
  .summary > div + div { border-left: 1px solid var(--border); }
  .summary .k { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid #262c37; color: var(--muted); font-size: 12px; font-weight: 600; }
  .summary .k svg { width: 14px; height: 14px; }
  .summary .v { font-size: 18px; font-weight: 700; line-height: 1.3; display: flex; align-items: center; gap: 6px; }
  .summary .s { margin-top: 4px; color: var(--secondary); font-size: 12px; }
  .avatar { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; display: grid; place-items: center;
    background: #2d3a55; color: #cfe0ff; font-weight: 700; }
  .ok { color: var(--success); } .warn { color: var(--warning); } .bad { color: var(--danger); }
  .link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; }

  .sync { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .bar { flex: 1; height: 8px; display: flex; gap: 3px; }
  .bar i { display: block; height: 100%; }
  /* Confirmed variant E: thin gap (thinner than the bar) reads as one divided bar. */
  .bar i:first-child { border-radius: 4px 2px 2px 4px; } .bar i:last-child { border-radius: 2px 4px 4px 2px; } .bar i:only-child { border-radius: 4px; }
  .bar .done { background: var(--success); } .bar .pend { background: var(--pending); }
  .bar .idle { background: #3a4250; }
  .sync .meta { font-size: 12.5px; color: var(--secondary); white-space: nowrap; }
  .sync .meta.dim { opacity: .5; }
  .sync .meta .pending { color: var(--pending); font-weight: 600; }
  .sync .refresh { width: 34px; height: 34px; padding: 0; font-size: 19px; line-height: 1; }
  .badge { padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: #1f3a2d; color: var(--success); }
  .badge.gray { background: #2a303b; color: var(--secondary); }
  .badge.warn { background: #3d3220; color: var(--warning); }

  .toggle { width: 38px; height: 22px; border-radius: 11px; border: 0; background: #39414f; position: relative; flex: 0 0 38px; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #c9d1dd; transition: left .15s; }
  .toggle.on { background: var(--accent); } .toggle.on::after { left: 19px; background: #fff; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: #161a21; }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--secondary); font-size: 12.5px; }
  .seg button.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .soon { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: #2a303b; color: var(--muted); font-size: 11px; font-weight: 500; }

  details.adv { margin-top: 18px; color: var(--secondary); }
  details.adv summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }

  /* Child modal */
  .scrim { position: absolute; inset: 0; z-index: 10; background: #05070acc; display: grid; place-items: center; }
  .dialog { width: min(540px, calc(100% - 40px)); max-height: calc(100% - 40px); display: flex; flex-direction: column; border: 1px solid #3a4456; border-radius: 14px; background: #181d26; box-shadow: 0 24px 70px #000a; }
  .dialog header { padding: 18px 22px 0; }
  .dialog h4 { margin: 0; font-size: 17px; }
  .steps { display: flex; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
  .steps li { flex: 1; height: 4px; border-radius: 2px; background: #2c3442; }
  .steps li.done { background: var(--accent); } .steps li.cur { background: #9dbbff; }
  .steplabel { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .dialog .body { padding: 16px 22px; overflow: auto; }
  .dialog .body p { margin: 0 0 12px; color: var(--secondary); }
  .dialog footer { display: flex; justify-content: space-between; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
  .code { padding: 14px; border-radius: 10px; background: #10141a; border: 1px solid var(--border); text-align: center; font: 600 22px/1.3 Consolas, monospace; letter-spacing: .08em; }
  .callout { padding: 10px 12px; border-radius: 9px; background: #2a2418; border: 1px solid #4a3c22; color: #f2d7a6; font-size: 12.5px; }
  .callout.info { background: #182234; border-color: #2b3d5d; color: #c7d7f5; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 13px; }
  .qr { width: 132px; height: 132px; margin: 0 auto 10px; border-radius: 8px;
    background: repeating-conic-gradient(#e9edf3 0 25%, #10141a 0 50%) 0 0 / 12px 12px; border: 6px solid #e9edf3; }
  .choice { display: grid; gap: 8px; }
  .choice button { text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .choice button.on { border-color: var(--accent); background: #1b2740; }
  .choice b { display: block; } .choice span { color: var(--secondary); font-size: 12.5px; }
  .progress { height: 6px; border-radius: 3px; background: #2a313d; overflow: hidden; } .progress i { display: block; height: 100%; width: 35%; background: var(--accent); }

  /* Narrow window: icon rail + floating panel */
  .window.w900 .side { width: 56px; flex-basis: 56px; padding: 18px 8px; }
  .window.w900 .side .title, .window.w900 .side .nav span { display: none; }
  .window.w900 .side .nav button { justify-content: center; padding: 0; }

  table.terms { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.terms th, table.terms td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.terms th { color: var(--muted); font-weight: 600; font-size: 12px; }
  table.terms td:first-child { color: var(--muted); text-decoration: line-through; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="stage">
  <div class="window w1280" id="window"></div>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const I = {
  general: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6z"/></svg>',
  custom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14v7M14 17.5h7"/></svg>',
  account: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  about: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  pc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M16 7l3 3M14 9l2 2"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};
const TABS = [["general","일반"],["data","데이터"],["custom","사용자 맞춤"],["account","계정"],["system","시스템"],["about","정보"]];

const nav = (active, floating) => `<nav class="nav">${TABS.map(([k,l]) => `<button class="${k===active?"on":""}" title="${l}">${I[k]}<span>${l}</span></button>`).join("")}</nav>`;
const shell = (active, content, extra = "") => `
  <div class="settings">
    <aside class="side"><div class="title">설정</div>${nav(active)}</aside>
    <main class="main"><button class="close" aria-label="닫기">✕</button>${content}</main>
    ${extra}
  </div>`;
const head = (title, desc, action = "") => `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`;

const syncRow = pending => `
  <div class="card sync">
    <span class="badge">온라인</span>
    <div class="bar">${pending ? '<i class="done" style="flex:82"></i><i class="pend" style="flex:18"></i>' : '<i class="idle" style="flex:1"></i>'}</div>
    <span class="meta ${pending ? "" : "dim"}">${pending ? '<span class="pending">보낼 변경 2개</span> · 5분 전 동기화' : "보낼 변경 0개 · 방금 동기화"}</span>
    <button class="btn ghost refresh" title="지금 동기화">↻</button>
  </div>`;

const deviceRows = `
  <div class="row"><div class="icon">${I.pc}</div><div class="grow"><div class="label">이 PC</div><div class="desc">편집 가능 · 현재 사용 중</div></div><span class="badge gray">이 기기</span></div>
  <div class="row"><div class="icon">${I.pc}</div><div class="grow"><div class="label">다른 기기 · 7BE0</div><div class="desc">편집 가능 · 9월 24일 연결</div></div><button class="btn danger" data-go="remove-1">해제</button></div>
  <div class="row"><div class="icon">${I.phone}</div><div class="grow"><div class="label">다른 기기 · C90D</div><div class="desc">보기만 가능 · 9월 27일 연결</div></div><button class="btn danger" data-go="remove-1">해제</button></div>`;

const dataTab = (warn) => shell("data", `
  ${head("데이터", "내 데이터는 기기에서 암호화되어 저장·동기화됩니다.", `<button class="btn" data-go="locked">${I.lock.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:6px"')}앱 잠금</button>`)}
  <div class="card summary">
    <div><div class="k">${I.key}복구 키</div><div class="v ${warn ? "warn" : "ok"}">${warn ? "⚠ 확인 필요" : "✓ 보관됨"}</div><div class="s">${warn ? "모든 기기를 잃으면 되찾을 수 없어요 · <button class=link data-go=recovery-1>지금 설정</button>" : "9월 22일 확인"}</div></div>
    <div><div class="k">${I.pc}연결된 기기</div><div class="v">3대</div><div class="s">이 PC 포함</div></div>
    <div><div class="k">${I.box}마지막 백업</div><div class="v ${warn ? "warn" : ""}">${warn ? "⚠ 없음" : "9월 29일"}</div><div class="s">${warn ? "<button class=link data-go=backup-1>백업 만들기</button>" : "42개 항목"}</div></div>
  </div>
  <div class="section"><h3>동기화</h3>${syncRow(!warn)}</div>
  <div class="section"><h3 style="display:flex;justify-content:space-between;align-items:center">연결된 기기 <button class="btn" data-go="pair-1">+ 새 기기 추가</button></h3><div class="card">${deviceRows}</div></div>
  <div class="section"><h3>백업과 복구</h3><div class="card">
    <div class="row"><div class="icon">${I.box}</div><div class="grow"><div class="label">데이터 백업</div><div class="desc">할 일 전체를 암호화된 파일로 내보내거나 불러옵니다.</div></div><button class="btn" data-go="backup-1">백업 관리</button></div>
    <div class="row"><div class="icon">${I.key}</div><div class="grow"><div class="label">복구 키</div><div class="desc">모든 기기를 잃었을 때 데이터를 되찾는 파일과 코드입니다.</div></div><button class="btn" data-go="recovery-1">${warn ? "설정하기" : "새로 만들기"}</button></div>
  </div></div>
  <details class="adv"><summary>고급</summary><div class="card" style="margin-top:8px"><div class="row"><div class="grow"><div class="label">이전 버전 데이터 검토</div><div class="desc">업데이트 전에 보내지 못한 변경이 남아 있을 때만 표시됩니다.</div></div><button class="btn">검토</button></div></div></details>
`);

const dialog = (title, step, total, label, body, back, next, nextClass = "primary") => `
  <div class="scrim"><div class="dialog">
    <header><h4>${title}</h4><ol class="steps">${Array.from({length: total}, (_, i) => `<li class="${i < step - 1 ? "done" : i === step - 1 ? "cur" : ""}"></li>`).join("")}</ol><div class="steplabel">${step}/${total} · ${label}</div></header>
    <div class="body">${body}</div>
    <footer>${back === "none" ? "<span></span>" : `<button class="btn ghost" data-go="${back || "data"}">${back ? "이전" : "취소"}</button>`}${next}</footer>
  </div></div>`;
const withDialog = d => dataTab(false).replace(/<\/div>\s*$/, d + "</div>");

const screens = {
  "data": { group: "데이터", label: "데이터 탭", html: () => dataTab(false), notes: [
    "제목 1단: 페이지 제목 + 한 줄 설명. 상단 '환경설정' 헤더 바는 없애고 사이드바 위 작은 '설정'으로 대체",
    "보호 상태 요약 3칸: 복구 키, 연결된 기기, 마지막 백업. 조치가 필요하면 경고색 + 바로가기",

let current = screens[location.hash.slice(1)] ? location.hash.slice(1) : "data", width = new URLSearchParams(location.search).get("w") === "900" ? "w900" : "w1280";
function render() {
  const s = screens[current];
  const win = document.getElementById("window");
  win.className = "window " + (s.narrow ? "w900" : width);
  win.innerHTML = s.html();
  document.getElementById("notes").innerHTML = `<h3>${s.group} · ${s.label}</h3><ul>${s.notes.map(n => `<li>${n}</li>`).join("")}</ul>`;
  const groups = {};
  for (const [k, v] of Object.entries(screens)) (groups[v.group] ||= []).push([k, v.label]);
  document.getElementById("toolbar").innerHTML = `<strong>설정 개편 시안 #70</strong>` +
    Object.entries(groups).map(([g, items]) => items.map(([k, l]) => `<button class="${k === current ? "on" : ""}" data-go="${k}">${items.length > 1 ? g + ": " : ""}${l}</button>`).join("")).join('<span class="sep"></span>') +
    `<span class="sep"></span><button class="${width === "w1280" ? "on" : ""}" data-width="w1280">1280px</button><button class="${width === "w900" ? "on" : ""}" data-width="w900">900px</button>`;
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); const w = e.target.closest("[data-width]");
  if (go && screens[go.dataset.go]) { current = go.dataset.go; render(); }
  if (w) { width = w.dataset.width; render(); }
});
render();
</script>

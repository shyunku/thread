  :root { --page: #0b0d10; --ui-border: #2b303b; --ui-text: #edf1f7; --ui-muted: #8792a4; --ui-panel: #15181e; --ui-sel: #253858;
    --canvas: #101216; --panel: #14171d; --surface: #1a1e25; --raise: #222731; --hover: #1d2129; --line: #232831; --text: #edf1f7;
    --secondary: #a3acbb; --muted: #7f8a9c; --faint: #5f697a; --accent: #6294ff; --accent-soft: #1b2741; --danger: #f0838b; --success: #70d5a0; --star: #f2c14e;
    /* Spacing: 4px grid. Edges every block shares (see "정렬선"). */
    --side-x: 20px;   /* sidebar content edge */
    --main-x: 32px;   /* list pane gutter: title, checkbox column, right edge */
    --ck: 20px;       /* checkbox column */
    --ck-gap: 12px;   /* checkbox to text: text column = main-x + 32 */
    --panel-x: 20px;  /* right panel gutter */
    --in: 12px;       /* padding inside a filled box */ }
  * { box-sizing: border-box; }
  body { word-break: keep-all; overflow-wrap: break-word; margin: 0; background: var(--page); color: var(--ui-text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .toolbar { position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 6px; padding: 10px 16px; background: #0b0d10f2; border-bottom: 1px solid var(--ui-border); }
  .toolbar .line { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .toolbar strong { margin-right: 4px; font-size: 12px; color: var(--ui-muted); min-width: 60px; font-weight: 600; }
  .toolbar button { padding: 4px 9px; border: 1px solid var(--ui-border); border-radius: 7px; background: var(--ui-panel); font-size: 12px; color: #a0aaba; cursor: pointer; }
  .toolbar button.on { background: var(--ui-sel); border-color: #3a5486; color: var(--ui-text); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--ui-border); margin: 0 6px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 28px 16px 64px; flex-wrap: wrap; }
  .fit .win { zoom: .7; }
  .notes { width: 460px; padding: 16px 18px; border: 1px dashed #3a4252; border-radius: 12px; color: #a0aaba; font-size: 13px; }
  .notes h3 { margin: 14px 0 6px; font-size: 13px; color: var(--ui-text); } .notes h3:first-child { margin-top: 0; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 4px 0; }
  .notes .q { color: #edbc72; } .notes .new { color: #70d5a0; }
  .notes .now { padding: 8px 10px; border-radius: 8px; background: #161b24; color: #cfd6e2; margin-bottom: 10px; }
  .mark .chg { outline: 2px dashed #edbc72; outline-offset: -2px; }

  /* ---------- Window ---------- */
  /* App font (user decision): Oxanium for Latin and digits, Noto Sans KR for Korean. */
  .win, .win button, .win input { font-family: "Oxanium", "Noto Sans KR", sans-serif; }
  .win { position: relative; display: flex; flex-direction: column; border: 1px solid #2b303b; border-radius: 10px; overflow: hidden; background: var(--canvas); color: var(--text); flex: none; }
  /* Top bar: unchanged from the current app (TopBar.scss, constants.scss). */
  .top { height: 42px; flex: none; display: flex; align-items: center; background: #13161b; border-bottom: 1px solid #2b303b; position: relative; }
  .top .brand { display: flex; align-items: center; gap: 9px; padding: 0 12px; }
  .top .brand img { width: 26px; height: 26px; object-fit: contain; }
  .top .ver { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .top .search { position: absolute; left: 50%; transform: translateX(-50%); min-width: 140px; height: 28px; border-radius: 8px; border: 1px solid #2b303b; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--secondary); font-size: 12px; }
  .top .search .ph { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .top .search.on { border-color: var(--accent); }
  .top .search.on .ph { color: var(--text); }
  .top kbd { font: inherit; font-size: 11px; white-space: nowrap; color: var(--muted); border: 1px solid #2b303b; border-radius: 4px; padding: 3px 5px; line-height: 1; }
  .top .wc { display: flex; align-self: stretch; margin-left: auto; }
  .top .wc span { width: 44px; display: grid; place-items: center; color: var(--secondary); }
  .narrow .top kbd { display: none; }
  .narrow .top .wc span { width: 36px; }
  .body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* Sidebar: every row starts at --side-x (icon column 18px, label at side-x + 28). */
  .side { width: 232px; flex: none; display: flex; flex-direction: column; background: var(--panel); padding: 12px calc(var(--side-x) - 10px) 10px; overflow: hidden; }
  .side.rail { width: 56px; padding: 12px 9px 10px; }
  .row-s { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--secondary); font-size: 13.5px; white-space: nowrap; cursor: pointer; position: relative; }
  .row-s:hover { background: var(--hover); }
  .row-s.on { background: var(--raise); color: var(--text); }
  .row-s .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .row-s.on .ic { color: var(--text); }
  /* Category rows sit their name 3px closer to the colour dot / icon. */
  .row-s.cat-row { gap: 7px; }
  .row-s .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row-s .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 16px; text-align: right; }
  .row-s .n.due { color: var(--danger); }
  /* Date and time at the top of the menu (user decision), on the 20px edge. */
  .clock { margin: 0 0 14px; padding: 12px 14px 9px; border-radius: 10px; background: var(--surface); }
  .clock .cd { display: block; font-size: 12px; line-height: 18px; color: var(--muted); }
  .clock b { display: block; margin-top: 6px; font-size: 24px; line-height: 30px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .clock b small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 1px; }
  .clock .cr { display: none; }
  .rail .clock { padding: 8px 0; text-align: center; }
  .rail .clock .cd, .rail .clock b { display: none; }
  .rail .clock .cr { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .add-s { margin: 0 0 16px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; }
  .add-s:hover { background: #7aa5ff; }
  .add-s .ic { color: #fff; }
  .add-s kbd { font: inherit; font-size: 11px; opacity: .75; }
  .rail .row-s { justify-content: center; padding: 0; }
  .rail .row-s .lbl, .rail .row-s .n, .rail .foot .who { display: none; }
  .rail .grp { display: block; height: 1px; margin: 12px 10px; padding: 0; font-size: 0; background: var(--line); }
  .rail .grp span { display: none; }
  .row-s .badge { display: none; }
  .rail .row-s .badge { display: block; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
  .grp { display: flex; align-items: center; height: 28px; margin-top: 16px; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .grp span { margin-left: auto; width: 16px; display: grid; justify-items: end; cursor: pointer; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* Account section: its own band, ruled off from the menu above. */
  .foot { margin: auto calc(10px - var(--side-x)) -10px; display: flex; align-items: center; gap: 5px; height: 56px; padding: 0 var(--side-x) 0 calc(var(--side-x) - 5px); border-top: 1px solid var(--line); background: #0e1014; }
  .foot .av { width: 28px; height: 28px; border-radius: 50%; background: #2a3242; display: grid; place-items: center; font-size: 12px; color: var(--secondary); flex: none; }
  .foot .who { flex: 1; font-size: 12.5px; line-height: 1.3; } .foot .who small { display: block; color: var(--muted); font-size: 11.5px; }
  .foot .gear { width: 28px; height: 28px; margin-right: -5px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .foot .gear:hover { background: var(--raise); }
  .rail .foot { flex-direction: column; height: auto; gap: 8px; padding: 10px 0; margin: auto -9px -10px; }
  .rail .foot .gear { margin: 0; }
  .rail .foot .av { margin: 0; }

  /* Panes */
  .panes { flex: 1; min-width: 0; display: flex; }
  .pane { position: relative; min-width: 0; display: flex; flex-direction: column; }
  .pane.main { flex: 1; }
  .pane.aside { flex: none; background: var(--panel); }
  .splitter { width: 1px; flex: none; background: var(--line); position: relative; cursor: col-resize; }
  .splitter::after { content: ""; position: absolute; left: -3px; right: -3px; top: 0; bottom: 0; }

  /* List pane: title, quick-add icon, checkboxes and section arrows share the main-x edge;
     titles, the quick-add text and section names share main-x + 32; the right edge is main-x too. */
  .head { padding: 20px var(--main-x) 0; }
  .head .row1 { display: flex; align-items: center; gap: 8px; height: 32px; }
  .head h1 { margin: 0; font-size: 22px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .head .finding { margin: 2px 0 0; font-size: 13px; line-height: 20px; color: var(--secondary); }
  .head .finding b { color: var(--danger); font-weight: 600; }
  .seg { display: flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--surface); height: 32px; }
  .seg span { display: grid; place-items: center; width: 32px; padding: 0; border-radius: 6px; font-size: 12.5px; color: var(--secondary); cursor: pointer; white-space: nowrap; }
  .seg span.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .ghost { height: 32px; min-width: 32px; justify-content: center; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 6px; color: var(--secondary); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .ghost:hover { background: var(--hover); }
  .ghost.on { background: var(--raise); color: var(--text); }
  .push { margin-left: auto; }
  /* Movement eases in (no back-swing); the fade runs on its own linear curve so it reaches 0 smoothly. */
  @keyframes done-fall { from { transform: translateY(0); } to { transform: translateY(80px); } }
  @keyframes done-fade { 0% { opacity: 1; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .task.fall, .tl-task.fall { position: fixed; z-index: 200; margin: 0; pointer-events: none; border-radius: 10px; box-shadow: 0 12px 28px #0008; animation: done-fall 408ms cubic-bezier(.32, 0, .67, 0) forwards, done-fade 408ms linear forwards; }
  .task.fall::before { display: none; }
  .task.closing, .tl-task.closing { overflow: hidden; transition: height 153ms ease, min-height 153ms ease, padding 153ms ease; min-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; }
  .ck.pop { animation: ck-pop 220ms ease-out; }
  @keyframes ck-pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .fall { animation: none; opacity: 0; transition: opacity 200ms; } }
  /* Korean text (Noto Sans KR) sits about 1.5px high in its line box; nudge labels that sit beside icons. */
  .nt { position: relative; top: 0; }
  .ghost.sq { width: 32px; min-width: 32px; padding: 0; }
  /* The last header button's icon ends on the 32px edge, like the stars below. */
  .head .row1 > .ghost:last-child { margin-right: -8px; }
  .menu-b { margin-left: -8px; }
  .head.has-menu .finding { padding-left: 32px; }
  /* Quick add sits at the bottom of the list pane, always in reach. */
  .quick { flex: none; margin: 12px calc(var(--main-x) - 14px) 20px; border-radius: 10px; background: var(--surface); padding: 0 14px; position: relative; }
  .quick .in kbd { margin-left: auto; font: inherit; font-size: 11px; line-height: 1; color: var(--muted); border: 1px solid #2b303b; border-radius: 4px; padding: 3px 5px; }
  .quick .in { display: flex; align-items: center; gap: var(--ck-gap); height: 44px; color: var(--muted); font-size: 13.5px; }
  .quick .in .plus { width: var(--ck); display: grid; place-items: center; color: var(--accent); }
  .quick .chip[data-dpopen], .quick .chip[data-pkopen] { cursor: pointer; }
  .quick .chips { display: flex; gap: 6px; padding: 0 0 12px calc(var(--ck) + var(--ck-gap)); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--raise); color: var(--secondary); font-size: 12px; white-space: nowrap; }
  .chip.on { background: var(--accent-soft); color: #a9c3ff; }
  .chip .dot { width: 7px; height: 7px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2b303b transparent; padding: 0 calc(var(--main-x) - 14px) 80px; }
  /* Date groups: the heading sits on the canvas, its rows inside one filled box below it. */
  .sec { display: flex; align-items: center; gap: 8px; height: 36px; margin-top: 20px; padding: 0 14px; font-size: 13.5px; font-weight: 700; color: var(--text); cursor: pointer; }
  .sec:first-child { margin-top: 4px; }
  .sec .c { min-width: 22px; height: 20px; padding: 0 7px; display: grid; place-items: center; border-radius: 10px; background: var(--raise); color: var(--secondary); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sec .tog { margin-left: auto; width: 28px; height: 28px; margin-right: -6px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .sec:hover .tog { background: var(--raise); color: var(--text); }
  .sec.over { color: var(--danger); }
  .sec.over .c { background: #3a2226; color: var(--danger); }
  .sec.plain { cursor: default; font-size: 12.5px; font-weight: 600; color: var(--secondary); }
  .gbox { border-radius: 10px; background: var(--surface); overflow: hidden; }
  .gbox .task { border-radius: 0; }
  .gbox .task:hover { background: var(--raise); }
  .gbox .task.sel { background: var(--accent-soft); }
  .task { display: flex; align-items: flex-start; gap: var(--ck-gap); min-height: 64px; padding: 12px 14px; border-radius: 8px; cursor: pointer; position: relative; }
  .task:hover, .task.hov { background: var(--hover); }
  .task.sel { background: var(--accent-soft); }
  .task + .task::before { content: ""; position: absolute; left: calc(14px + var(--ck) + var(--ck-gap)); right: 14px; top: 0; height: 1px; background: var(--line); }
  .task:hover::before, .task.hov::before, .task.sel::before, .task:hover + .task::before, .task.hov + .task::before, .task.sel + .task::before { display: none; }
  .ck { width: var(--ck); height: var(--ck); border-radius: 50%; border: 2px solid #5a6475; flex: none; display: grid; place-items: center; }
  .ck.done { background: var(--accent); border-color: var(--accent); color: #fff; }
  .task .tx { flex: 1; min-width: 0; }
  .task .t { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.done .t { color: var(--muted); text-decoration: line-through; }

  /* Calendar (main view) */

  /* Timeline: day columns 240px or wider, 12px apart, inside the same 32px gutter. */

  /* Overlays */

  .nc-in { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--canvas); border: 1px solid var(--accent); margin-bottom: 4px; }

function notes() {
  const mode = s.w >= 1280 ? '넓은 창: 메뉴 + 목록 + 패널' : s.w >= 1000 ? '중간 창: 메뉴는 아이콘만, 패널 320px' : s.w >= 800 ? '좁은 창: 패널은 위에 겹쳐 열림' : '아주 좁은 창: 메뉴는 ☰ 버튼으로';
  return '<div class="notes"><div class="now">' + s.w + '×' + SIZES[s.w] + ' · ' + mode + '</div><h3 class="q">정할 것</h3><ul class="q">' + [
    '<b>오른쪽 시간 칸과 "시간 표시" 설정</b>: 다른 것 다 정한 뒤 따로 시안.',
  ].map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
}

function render() {

  if (d.set) { const [k, v] = d.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v; if (k === 'state') { s.tab = null; if (v === 'picker') s.dpAt = 'ctx'; if (s.nav === 'diary') s.nav = 'all'; } if (k === 'panel') s.tab = null; if (k === 'w') { s.drawer = false; s.sideOpen = false; } }

// Tooltips for [data-tip] inside the app window.
(() => {
  const tip = document.getElementById('tip');

  const hide = () => { clearTimeout(timer); target = null; tip.classList.remove('on'); };

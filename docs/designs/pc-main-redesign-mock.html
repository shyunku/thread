<style>

  .st { width: 28px; height: 28px; margin-right: -6px; display: grid; place-items: center; color: #4d5666; border-radius: 7px; flex: none; }

  /* Calendar (main view) */

  .cal .grid .wd { background: var(--panel); text-align: center; color: var(--muted); padding: 0; line-height: 28px; cursor: default; }
  .cal .grid .out { color: #4d5666; }

  .cal .d { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; margin: 0 0 4px 0; border-radius: 6px; font-variant-numeric: tabular-nums; }

<script>

  }
  return `<section class="pane main chg">
    <div class="head"><div class="row1"><h1>2026년 10월</h1><span class="ghost" style="margin-left:8px">‹</span><span class="ghost">오늘</span><span class="ghost">›</span><span class="push"></span>${viewSeg()}</div>
      <p class="finding">이번 달 남은 할 일 ${TASKS.filter(t => t.due && open(t) && new Date(t.due).getMonth() === 9).length}개 · 날짜를 누르면 오른쪽에 그날 할 일</p></div>
    <div class="cal"><div class="grid">${cells}</div></div></section>`;
}
function timelinePane() {
  return `<section class="pane main"><div class="head"><div class="row1"><h1>타임라인</h1><span class="push"></span>${viewSeg()}</div>
    <p class="finding">타임라인은 목록·캘린더가 정해진 뒤 같은 규칙으로 그려요.</p></div></section>`;
}

// ---------- Right panel ----------
function detailBody(t) {
  const c = cat(t.cat), r = t.due ? remain(t.due) : null, subsDone = t.subs ? t.subs.filter(x => x[1]).length : 0, dd = t.due ? new Date(t.due) : null;
  return `<div class="dt-title"><span class="ck ${s.done[t.id] ? 'done' : ''}" data-check="${t.id}">${s.done[t.id] ? I.check : ''}</span><h2>${t.t}</h2><span class="st ${s.imp[t.id] ? 'on' : ''}" data-star="${t.id}">${I.star(s.imp[t.id])}</span></div>
    <div class="box">
      <div class="prop"><span class="k">기한</span><span class="v">${dd ? `${dd.getMonth() + 1}월 ${dd.getDate()}일 (${WD[dd.getDay()]}) ${clock(dd)}<span class="sub" style="${r.over ? 'color:var(--danger)' : ''}">${r.text}</span>` : '<span class="sub">없음</span>'}</span></div>
      <div class="prop"><span class="k">반복</span><span class="v">${t.repeat || '<span class="sub">안 함</span>'}</span></div>
      <div class="prop"><span class="k">카테고리</span><span class="v">${c ? `<span class="chip"><span class="dot" style="background:${c.color}"></span>${c.name}</span>` : ''}<span class="chip">＋</span></span></div>
    </div>
    <div class="block-h">하위 할 일<span>${t.subs ? `${subsDone}/${t.subs.length}` : ''}</span></div>
    <div class="box">${t.subs ? `<div class="bar"><i style="width:${subsDone / t.subs.length * 100}%"></i></div>` : ''}
      ${(t.subs || []).map(([n, d]) => `<div class="subt ${d ? 'done' : ''}"><span class="ck ${d ? 'done' : ''}">${d ? I.check : ''}</span><span>${n}</span></div>`).join('')}
      <div class="subt add"><i>＋</i>하위 할 일 추가</div></div>
    <div class="block-h">메모</div><div class="box memo">${t.memo || '<span style="color:var(--faint)">메모를 적어 두세요</span>'}</div>
    <div class="stamp">만든 날 10월 14일 · 마지막 수정 오늘 오전 10:12</div>`;
}
function dayList(rowsAsAgenda) {
  const pd = new Date(NOW); pd.setDate(pd.getDate() + s.picked);
  const day = TASKS.filter(t => t.due && dayDiff(t.due) === s.picked).sort((a, b) => s.done[a.id] - s.done[b.id] || a.due - b.due);
  const head = `<div class="block-h">${pd.getMonth() + 1}월 ${pd.getDate()}일 (${WD[pd.getDay()]})${s.picked === 0 ? ' · 오늘' : ''}<span>${day.filter(open).length}개 남음</span></div>`;
  return head + `<div class="box agenda">${day.length ? day.map(t => { const c = cat(t.cat); return `<div class="ai" data-task="${t.id}" style="${s.done[t.id] ? 'opacity:.5' : ''}"><span class="tm ${overdue(t) ? 'over' : ''}">${clock(new Date(t.due))}</span><span class="dot" style="background:${c ? c.color : 'var(--faint)'};width:7px;height:7px"></span><span class="nm">${t.t}</span></div>`; }).join('') : '<div class="none">이날은 할 일이 없어요</div>'}</div>`;
}
function calendarBody() {
  const first = new Date(2026, 9, 1), start = new Date(first); start.setDate(1 - first.getDay());
  let g = WD.split('').map(w => `<span class="w">${w}</span>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const n = Math.round((d - new Date(2026, 9, 21)) / D);
    const evs = TASKS.filter(t => t.due && dayDiff(t.due) === n && open(t));
    g += `<span class="c ${d.getMonth() !== 9 ? 'out' : ''} ${n === 0 ? 'today' : ''} ${n === s.picked ? 'picked' : ''}" data-pick="${n}"><b>${d.getDate()}</b>${evs.length ? `<i class="${evs.some(overdue) ? 'over' : ''}"></i>` : ''}</span>`;
  }
  return `<div class="box mini"><div class="mh">2026년 10월<span><i>‹</i><i>›</i></span></div><div class="mg">${g}</div></div>` + dayList();
}
function panelTab() {
  if (s.view === 'calendar') return 'day';
  if (s.panel === 'calendar') return 'calendar';
  if (s.tab) return s.tab;
  return s.selected && ['selected', 'hover', 'context'].includes(s.state) ? 'detail' : 'calendar';
}
function panel(L, cls = '') {
  const tab = panelTab(), t = TASKS.find(x => x.id === s.selected);
  const tabs = s.view === 'calendar' ? [['day', '선택한 날']] : [['detail', '할 일 상세'], ['calendar', '캘린더']];
  const body = tab === 'day' ? dayList() : tab === 'detail' && t ? detailBody(t) : calendarBody();
  return `<aside class="pane aside ${cls} chg" style="width:${L.panelW}px">
    <div class="ptabs">${tabs.map(([k, l]) => `<span class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}</span>`).join('')}<span class="x" data-closepanel="1" title="패널 닫기">✕</span></div>
    <div class="pbody">${body}</div></aside>`;
}

// ---------- Window ----------
function guides(L) {
  if (!s.guides) return '';
  const sideW = L.hideSide ? 0 : L.rail ? 56 : 232;
  const mainL = sideW, panelW = s.panel !== 'off' && !L.overlayPanel ? L.panelW : 0, mainR = s.w - 2 - panelW - (panelW ? 1 : 0);
  const xs = [L.hideSide || L.rail ? null : 20, mainL + 32, mainL + 64, mainR - 32, panelW ? mainR + 1 + 20 : null, panelW ? mainR + 1 + 32 : null, panelW ? s.w - 2 - 20 : null].filter(x => x != null);
  return xs.map(x => `<i class="guide" style="left:${x}px"></i>`).join('');
}
function win() {
  const L = layout(), H = SIZES[s.w];
  const main = s.view === 'calendar' ? calendarPane() : s.view === 'timeline' ? timelinePane() : listPane(L);
  const showPanel = s.panel !== 'off' && !L.overlayPanel;
  const panes = main + (showPanel ? '<div class="splitter" title="끌어서 너비 조절"></div>' + panel(L) : '');
  const drawer = L.overlayPanel && s.drawer && s.panel !== 'off' ? `<div class="scrim" data-drawer="0"></div>${panel(L, 'drawer')}` : '';
  const sideDrawer = L.hideSide && s.sideOpen ? `<div class="scrim" data-sideopen="0"></div><div class="sidedrawer">${sidebar(L, true)}</div>` : '';
  return `<div class="win" style="width:${s.w}px;height:${H}px">
    <div class="top"><div class="lead">${L.hideSide ? `<span class="ham" data-sideopen="1">${I.menu}</span>` : ''}<span class="logo">T</span>${!L.rail || L.hideSide ? '<span class="name">Thread</span>' : ''}</div>
      <div class="mid"><span class="search ${s.state === 'search' ? 'on' : ''}">${I.search}${s.state === 'search' ? '리뷰' : '할 일, 메모, 카테고리 검색'}<kbd>${s.state === 'search' ? 'Esc' : 'Ctrl K'}</kbd></span></div>
      ${s.w >= 960 ? '<span class="sync"><i></i>모두 동기화됨</span>' : ''}<span class="wc"><span>—</span><span>▢</span><span>✕</span></span></div>
    <div class="body">${L.hideSide ? '' : sidebar(L)}<div class="panes">${panes}</div>${drawer}${sideDrawer}${guides(L)}</div>
  </div>`;
}

function notes() {
  const mode = s.w >= 1280 ? '넓은 창: 메뉴 + 목록 + 패널' : s.w >= 1000 ? '중간 창: 메뉴는 아이콘만, 패널 320px' : s.w >= 800 ? '좁은 창: 패널은 위에 겹쳐 열림' : '아주 좁은 창: 메뉴도 ☰ 버튼으로';
  return `<div class="notes"><div class="now">${s.w}×${SIZES[s.w]} · ${mode}</div>
    <h3>2차에서 바꾼 것</h3><ul class="new">
    <li><b>정렬 기준선을 정함</b> (툴바 "정렬선"으로 확인): 메뉴는 20px, 목록은 32px(제목 · 체크 · 빠른 추가 ＋ · 묶음 화살표 · 오른쪽 끝 별), 그 32px 뒤(할 일 제목 · 입력칸 글자 · 묶음 이름 · 아래 줄 구분선 시작), 오른쪽 패널은 20px, 상자 안은 12px. 크기는 4px 단위.</li>
    <li><b>오른쪽 시간 칸</b>: 위에 기한 시각, 그 아래 연하게 남은 시간. "보기 > 남은 시간 보이기"로 끌 수 있음. 아래 줄에서는 남은 시간을 뺌(카테고리 · 반복 · 하위 할 일 · 메모 표시만).</li>
    <li>사이드바: 위쪽 시계 줄을 빼고 "할 일 추가"를 맨 위로. 모든 줄 높이 34px, 아이콘 칸 18px. 앱 이름은 위쪽 막대 왼쪽(메뉴와 같은 20px 선).</li>
    <li>오른쪽 패널: 하위 할 일 · 메모 · 그날 할 일도 상자 안에 넣어 상자 모양을 통일. 진행 막대는 하위 할 일 상자 위쪽 테두리로.</li>
    <li>목록 머리글: 제목 · 보기 전환 · "보기" 버튼 높이를 32px로 맞춤.</li>
    <li>새 상태: 우클릭 메뉴, 검색 중, 빈 목록, 비밀 카테고리 잠김. 툴바 "상태"로.</li>
    <li>패널 옮기기는 뺌(1차 결정).</li></ul><h3>2차 결정</h3><ul><li>마우스를 올리면 배경만 바뀜(빠른 버튼 없음). 줄 메뉴는 우클릭으로.</li><li>오른쪽 시간 칸의 시각 문구는 "시간 표시" 설정의 기한 형식을 따름(시안의 문구는 "자동" 예시). 남은 시간 줄과 함께 설정을 어떻게 합칠지는 따로 시안.</li></ul>
    <h3>1차 결정</h3><ul><li>"다음 7일" 넣기 · 상세는 오른쪽 패널 · 목록 화면 옆은 미니 달력 + 그날 목록 · 패널 옮기기 안 함.</li></ul>
    <h3>그대로인 것</h3><ul><li>색 · 글꼴 · 다크 테마, 카테고리 색, 노란 별, 비밀 카테고리, 설정 창. 기존 "시간 표시" 설정(남은 시간/기한 방식)은 이번 시안에서 안 건드림 — 오른쪽 시간 칸과 어떻게 합칠지는 따로 시안.</li></ul>
    <h3 class="q">정할 것 (세부)</h3><ul class="q">
    
    
    <li><b>우클릭 메뉴 항목</b>: 열기 · 기한(오늘/내일/날짜 고르기/없애기) · 중요 · 카테고리 · 복제 · 삭제. 더하거나 뺄 것.</li>
    <li><b>완료한 할 일</b>: 목록 맨 아래 "완료됨"에 접어 둠(지금 앱과 같음). "오늘" 보기에선 오늘 끝낸 것만.</li>
    <li><b>빠른 추가</b>: 보고 있는 목록에 맞춰 칩이 미리 골라짐(오늘 → 오늘, 카테고리 → 그 카테고리, 중요 → 중요). "내일 오후 3시" 같은 글을 날짜로 알아듣게 할지는 따로(구현 범위가 큼).</li>
    <li><b>묶음 이름</b>: 기한 지남 · 오늘 · 내일 · 이번 주 · 나중에 · 기한 없음. "이번 주"는 2~6일 뒤(시간 표시 "자동"과 같은 범위).</li>
    <li><b>검색</b>: 위쪽 막대에서 입력하면 가운데가 검색 결과로 바뀜(제목 · 메모 · 카테고리). Esc로 돌아감.</li>
    <li><b>캘린더 화면</b>: 칸마다 3개까지, 나머지는 "+N개 더". 끝낸 건 줄 긋고 아래로.</li></ul></div>`;
}
function toolbar() {
  const b = (k, v, l) => `<button class="${s[k] === v ? 'on' : ''}" data-set="${k}:${v}">${l}</button>`;
  return `<div class="line"><strong>창 크기</strong>${b('w', 1440, '1440×960')}${b('w', 1180, '1180×800')}${b('w', 960, '960×720')}${b('w', 760, '760×640')}<span class="sep"></span>
      <strong>가운데</strong>${b('view', 'list', '목록')}${b('view', 'calendar', '캘린더')}</div>
    <div class="line"><strong>상태</strong>${b('state', 'selected', '할 일 선택')}${b('state', 'nosel', '선택 없음')}${b('state', 'context', '우클릭 메뉴')}${b('state', 'search', '검색 중')}${b('state', 'empty', '빈 목록')}${b('nav', 'diary', '비밀 카테고리')}</div>
    <div class="line"><strong>오른쪽 패널</strong>${b('panel', 'auto', '자동(선택하면 상세)')}${b('panel', 'calendar', '캘린더 고정')}${b('panel', 'off', '끔')}<span class="sep"></span>
      <strong>왼쪽 메뉴</strong>${b('rail', 'auto', '창 크기에 맞춤')}${b('rail', 'full', '펼침')}${b('rail', 'rail', '아이콘만')}<span class="sep"></span>
      <strong>남은 시간</strong>${b('left', true, '보임')}${b('left', false, '숨김')}</div>
    <div class="line"><strong>묶기</strong>${b('group', 'date', '날짜별')}${b('group', 'none', '묶지 않기')}<span class="sep"></span>
      <strong>줄</strong>${b('density', 'normal', '보통')}${b('density', 'compact', '촘촘')}<span class="sep"></span>
      <strong>표시</strong>${b('guides', true, '정렬선')}${b('guides', false, '끔')}<span class="sep"></span>${b('mark', true, '바뀌는 부분')}${b('mark', false, '끔')}<span class="sep"></span>${b('fit', false, '실제 크기')}${b('fit', true, '맞춤(70%)')}</div>`;
}
function render() {
  document.getElementById('toolbar').innerHTML = toolbar();
  const st = document.getElementById('stage');
  st.className = 'stage' + (s.mark ? ' mark' : '') + (s.fit ? ' fit' : '');
  st.innerHTML = win() + notes();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-set],[data-nav],[data-task],[data-check],[data-star],[data-sec],[data-view],[data-tab],[data-pick],[data-closepanel],[data-viewmenu],[data-drawer],[data-sideopen]');
  if (!el) { if (s.viewMenu) { s.viewMenu = false; render(); } return; }
  const d = el.dataset;
  if (!d.viewmenu && !(d.set && /^(group|density|left):/.test(d.set))) s.viewMenu = false;
  if (d.set) { const [k, v] = d.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v; if (k === 'state') { s.tab = null; if (s.nav === 'diary') s.nav = 'all'; } if (k === 'panel') s.tab = null; if (k === 'w') { s.drawer = false; s.sideOpen = false; } }
  else if (d.check) { s.done[d.check] = !s.done[d.check]; }
  else if (d.star) { s.imp[d.star] = !s.imp[d.star]; }
  else if (d.task) { s.selected = d.task; s.state = 'selected'; s.tab = null; if (s.view === 'calendar') s.view = 'list'; if (layout().overlayPanel) s.drawer = true; }
  else if (d.nav) { s.nav = d.nav; s.sideOpen = false; if (s.state === 'search' || s.state === 'empty') s.state = 'selected'; }
  else if (d.sec) { s.closed[d.sec] = !s.closed[d.sec]; }
  else if (d.view) { s.view = d.view; s.tab = null; }
  else if (d.tab) { s.tab = d.tab; }
  else if (d.pick) { s.picked = +d.pick; if (s.view !== 'calendar') s.tab = 'calendar'; }
  else if (d.closepanel) { if (layout().overlayPanel) s.drawer = false; else if (panelTab() === 'detail') s.tab = 'calendar'; else s.panel = 'off'; }
  else if (d.viewmenu) { s.viewMenu = !s.viewMenu; }
  else if (d.drawer) { s.drawer = d.drawer === '1'; }
  else if (d.sideopen) { s.sideOpen = d.sideopen === '1'; }
  render();
});
render();
</script>
</body>

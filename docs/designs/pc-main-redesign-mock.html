<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread PC 메인 개편 시안 (#102)</title>
<style>
  :root { --page: #0b0d10; --ui-border: #2b303b; --ui-text: #edf1f7; --ui-muted: #8792a4; --ui-panel: #15181e; --ui-sel: #253858;
    --canvas: #101216; --panel: #14171d; --surface: #1a1e25; --raise: #20252e; --hover: #232833; --line: #262b34; --text: #edf1f7;
    --secondary: #a3acbb; --muted: #7f8a9c; --accent: #6294ff; --accent-soft: #1d2a44; --danger: #f0838b; --success: #70d5a0; --star: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ui-text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  .toolbar { position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 6px; padding: 10px 16px; background: #0b0d10f2; border-bottom: 1px solid var(--ui-border); }
  .toolbar .line { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .toolbar strong { margin-right: 4px; font-size: 12px; color: var(--ui-muted); min-width: 60px; font-weight: 600; }
  .toolbar button { padding: 4px 9px; border: 1px solid var(--ui-border); border-radius: 7px; background: var(--ui-panel); font-size: 12px; color: #a0aaba; cursor: pointer; }

  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 28px 16px 64px; flex-wrap: wrap; }
  .fit .win { zoom: .7; }
  .notes { width: 440px; padding: 16px 18px; border: 1px dashed #3a4252; border-radius: 12px; color: #a0aaba; font-size: 13px; }
  .notes h3 { margin: 14px 0 6px; font-size: 13px; color: var(--ui-text); } .notes h3:first-child { margin-top: 0; }

  /* ---------- Window ---------- */
  .win { position: relative; display: flex; flex-direction: column; border: 1px solid #2b303b; border-radius: 10px; overflow: hidden; background: var(--canvas); color: var(--text); flex: none; }

  .top .search { margin: 0 auto; width: min(460px, 46%); height: 28px; border-radius: 8px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); font-size: 12.5px; }
  .top .search kbd { margin-left: auto; font: inherit; font-size: 11px; padding: 0 6px; border-radius: 5px; background: var(--raise); color: var(--muted); }

  .top .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .top .wc { display: flex; height: 100%; }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* Sidebar */
  .side { width: 228px; flex: none; display: flex; flex-direction: column; background: var(--panel); padding: 10px 8px 8px; overflow: hidden; }

  .nav { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--secondary); font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .nav:hover { background: var(--hover); }
  .nav.on { background: var(--raise); color: var(--text); }
  .nav .ic { width: 18px; display: grid; place-items: center; color: var(--muted); }
  .nav.on .ic { color: var(--text); }
  .nav .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav .n.due { color: var(--danger); }
  .nav .lbl { overflow: hidden; text-overflow: ellipsis; }
  .rail .nav { justify-content: center; padding: 0; position: relative; }
  .rail .nav .lbl, .rail .nav .n, .rail .grp, .rail .today-line, .rail .addbtn span, .rail .addbtn kbd, .rail .foot .who { display: none; }
  .rail .nav .badge { position: absolute; top: 4px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
  .grp { display: flex; align-items: center; margin: 16px 10px 4px; font-size: 12px; color: var(--muted); }
  .grp span { margin-left: auto; font-size: 15px; cursor: pointer; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .side .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 6px 2px; }
  .side .foot .av { width: 28px; height: 28px; border-radius: 50%; background: #2a3242; display: grid; place-items: center; font-size: 12px; color: var(--secondary); flex: none; }
  .side .foot .who { font-size: 12.5px; line-height: 1.3; } .side .foot .who small { display: block; color: var(--muted); font-size: 11.5px; }
  .side .foot .gear { margin-left: auto; color: var(--muted); }
  .rail .foot { flex-direction: column; } .rail .foot .gear { margin: 0; }

  /* Panes */
  .panes { flex: 1; min-width: 0; display: flex; }
  .pane { position: relative; min-width: 0; display: flex; flex-direction: column; }
  .pane.main { flex: 1; }
  .pane.aside { flex: none; background: var(--panel); }
  .splitter { width: 6px; flex: none; cursor: col-resize; position: relative; }
  .splitter::after { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .edit .splitter::after { background: var(--accent); width: 2px; }

  /* List pane */
  .head { padding: 18px 28px 0; }
  .head .row1 { display: flex; align-items: center; gap: 12px; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .head .finding { margin: 4px 0 0; font-size: 13px; color: var(--secondary); }
  .head .finding b { color: var(--danger); font-weight: 600; }
  .seg { display: flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--surface); }
  .seg span { padding: 4px 12px; border-radius: 6px; font-size: 12.5px; color: var(--secondary); cursor: pointer; white-space: nowrap; }
  .seg span.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .ghost { height: 30px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; color: var(--secondary); font-size: 12.5px; cursor: pointer; white-space: nowrap; }

  .push { margin-left: auto; }
  .quick { margin: 14px 28px 6px; border-radius: 10px; background: var(--surface); }

  .quick .in .plus { color: var(--accent); font-size: 18px; }
  .quick .chips { display: flex; gap: 6px; padding: 0 12px 10px 40px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--raise); color: var(--secondary); font-size: 12px; white-space: nowrap; }
  .chip.on { background: var(--accent-soft); color: #a9c3ff; }
  .scroll { flex: 1; min-height: 0; overflow: hidden; padding: 4px 20px 20px; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 14px 8px 6px; font-size: 12.5px; font-weight: 600; color: var(--secondary); cursor: pointer; }
  .sec .c { color: var(--muted); font-weight: 400; }

  .sec .tri { width: 10px; color: var(--muted); font-size: 10px; }
  .task { display: flex; align-items: center; gap: 12px; padding: 9px 8px 9px 10px; border-radius: 9px; cursor: pointer; position: relative; }
  .task:hover { background: var(--hover); }
  .task.sel { background: var(--accent-soft); }
  .task + .task::before { content: ""; position: absolute; left: 44px; right: 10px; top: 0; height: 1px; background: var(--line); }
  .task:hover::before, .task.sel::before, .task:hover + .task::before, .task.sel + .task::before { display: none; }
  .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #5a6475; flex: none; display: grid; place-items: center; }
  .ck.done { background: var(--accent); border-color: var(--accent); color: #fff; }
  .task .tx { flex: 1; min-width: 0; }
  .task .t { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.done .t { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .meta > * { flex: none; }
  .meta .over { color: var(--danger); }
  .cat { display: inline-flex; align-items: center; gap: 5px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .cat .dot { width: 7px; height: 7px; flex: none; }
  .right { display: flex; align-items: center; gap: 10px; flex: none; }
  .when { font-size: 12.5px; color: var(--secondary); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  .when.over { color: var(--danger); }
  .st { width: 26px; height: 26px; display: grid; place-items: center; color: #4d5666; border-radius: 6px; }
  .st.on { color: var(--star); }
  .compact .task { padding: 5px 8px 5px 10px; }
  .compact .task .meta { display: none; }
  .compact .task .t { font-size: 13.5px; }
  .compact .task .inline-cat { display: inline-flex; }
  .inline-cat { display: none; margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 400; }
  .empty { margin: 60px auto; text-align: center; color: var(--secondary); max-width: 320px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* Calendar (main view) */
  .cal { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 28px 20px; }
  .cal .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 28px repeat(5, 1fr); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; }
  .cal .grid > div { background: var(--canvas); padding: 6px 7px; font-size: 12px; color: var(--secondary); min-width: 0; overflow: hidden; }
  .cal .grid .wd { background: var(--panel); text-align: center; color: var(--muted); padding: 5px; }
  .cal .grid .out { color: #4d5666; }
  .cal .grid .today .d { background: var(--accent); color: #fff; border-radius: 6px; padding: 0 6px; }
  .cal .grid .picked { background: #151b27; }
  .cal .d { display: inline-block; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .ev { display: flex; align-items: center; gap: 5px; margin-top: 3px; padding: 1px 6px; border-radius: 5px; background: var(--surface); color: var(--text); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .dot { width: 6px; height: 6px; flex: none; }
  .ev.over { color: var(--danger); }
  .more { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Right panel */
  .ptabs { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px 0 14px; }
  .ptabs .tab { padding: 5px 10px; border-radius: 7px; font-size: 12.5px; color: var(--secondary); cursor: pointer; }
  .ptabs .tab.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .ptabs .x { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); cursor: pointer; }

  .prop .k { width: 64px; flex: none; color: var(--muted); font-size: 12.5px; }
  .prop .v { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prop .v .sub { color: var(--muted); font-size: 12px; }
  .block-h { margin: 18px 2px 8px; font-size: 12.5px; color: var(--secondary); font-weight: 600; display: flex; }
  .block-h span { margin-left: auto; color: var(--muted); font-weight: 400; }
  .bar { height: 4px; border-radius: 2px; background: var(--raise); margin: 0 2px 8px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
  .subt { display: flex; align-items: center; gap: 10px; padding: 6px 4px; font-size: 13px; }
  .subt .ck { width: 16px; height: 16px; border-width: 2px; }
  .subt.done span { color: var(--muted); text-decoration: line-through; }
  .subt.add { color: var(--muted); }
  .memo { padding: 10px 12px; border-radius: 10px; background: var(--surface); font-size: 13px; color: var(--secondary); line-height: 1.6; min-height: 64px; }
  .stamp { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .mini { border-radius: 10px; background: var(--surface); padding: 10px 10px 8px; }
  .mini .mh { display: flex; align-items: center; font-size: 13px; font-weight: 600; padding: 0 4px 6px; }
  .mini .mh span { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: 4px; }
  .mini .mg { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  .mini .mg .w { color: var(--muted); font-size: 11px; padding: 2px 0; }
  .mini .mg .c { position: relative; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--secondary); cursor: pointer; }
  .mini .mg .c.out { color: #4d5666; }

  .mini .mg .c i { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
  .mini .mg .c i.over { background: var(--danger); }
  .agenda .ai { display: flex; align-items: center; gap: 10px; padding: 8px 6px; font-size: 13px; border-radius: 8px; cursor: pointer; }
  .agenda .ai:hover { background: var(--hover); }
  .agenda .ai .tm { width: 62px; flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .agenda .ai .tm.over { color: var(--danger); }
  .agenda .ai .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Overlay drawer (narrow windows) */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; background: var(--panel); box-shadow: -16px 0 40px #0009; z-index: 20; display: flex; flex-direction: column; }
  .drawer.left { right: auto; left: 0; box-shadow: 16px 0 40px #0009; }
  .scrim { position: absolute; inset: 0; background: #0006; z-index: 15; }
  .sidedrawer { position: absolute; top: 0; bottom: 0; left: 0; z-index: 25; box-shadow: 16px 0 40px #0009; display: flex; }

  /* Layout edit mode */
  .editbar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 10px; background: #1e2633; box-shadow: 0 10px 30px #0008; font-size: 12.5px; white-space: nowrap; }
  .editbar .b { padding: 4px 10px; border-radius: 7px; background: var(--raise); cursor: pointer; }
  .editbar .b.p { background: var(--accent); color: #fff; font-weight: 600; }
  .handle { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 7px; background: #2a3550; color: #c9d8ff; font-size: 12px; cursor: grab; white-space: nowrap; }
  .edit .pane, .edit .side { outline: 2px dashed #3d5687; outline-offset: -4px; }
  .drop { position: absolute; top: 46px; bottom: 12px; width: 120px; z-index: 29; border: 2px dashed var(--accent); border-radius: 10px; background: #131c2e; display: grid; place-items: center; text-align: center; color: #a9c3ff; font-size: 12px; padding: 8px; }
  .menu-pop { position: absolute; z-index: 35; width: 230px; padding: 6px; border-radius: 10px; background: #1e2430; box-shadow: 0 14px 36px #000a; font-size: 13px; }
  .menu-pop .mi { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--secondary); }
  .menu-pop .mi:hover { background: var(--hover); color: var(--text); }
  .menu-pop .mi.on { color: var(--text); }
  .menu-pop .mi .ok { margin-left: auto; color: var(--accent); }
  .menu-pop .hd { padding: 6px 10px 2px; font-size: 11.5px; color: var(--muted); }
</style>

function panelTab() {
  if (s.panel === 'calendar') return 'calendar';
  if (s.tab) return s.tab;
  return s.selected && s.state !== 'nosel' && s.view !== 'calendar' ? 'detail' : 'calendar';
}
function panel(L, cls = '') {
  const tab = panelTab(), t = TASKS.find(x => x.id === s.selected);
  const tabs = s.view === 'calendar' ? [['calendar', '선택한 날']] : [['detail', '할 일 상세'], ['calendar', '캘린더']];
  return `<aside class="pane aside ${cls} chg" style="width:${L.panelW}px">${s.edit ? `<div class="handle">${I.grip} 오른쪽 패널</div>` : ''}
    <div class="ptabs">${tabs.map(([k, l]) => `<span class="tab ${tab === k || tabs.length === 1 ? 'on' : ''}" data-tab="${k}">${l}</span>`).join('')}<span class="x" data-closepanel="1" title="패널 닫기">✕</span></div>
    <div class="pbody">${s.view === 'calendar' ? dayOnly() : tab === 'detail' && t && s.state !== 'nosel' ? detailBody(t) : calendarBody()}</div></aside>`;
}
function dayOnly() {
  const pd = new Date(NOW); pd.setDate(pd.getDate() + s.picked);
  const day = TASKS.filter(t => t.due && dayDiff(t.due) === s.picked);
  return `<div class="block-h" style="margin-top:4px">${pd.getMonth() + 1}월 ${pd.getDate()}일 (${WD[pd.getDay()]})<span>${day.length}개</span></div><div style="margin:0 -8px">${day.map(taskRow).join('') || '<div style="color:var(--muted);font-size:13px;padding:8px">이날은 할 일이 없어요</div>'}</div>`;
}
function win() {
  const L = layout(), H = SIZES[s.w];
  const main = s.view === 'calendar' ? calendarPane() : s.view === 'timeline' ? timelinePane() : listPane(L);
  const showPanel = s.panel !== 'off' && !L.overlayPanel;
  const p = showPanel ? panel(L) : '';
  const split = showPanel ? '<div class="splitter" title="끌어서 너비 조절"></div>' : '';
  const panes = s.pos === 'left' ? p + split + main : main + split + p;
  const drawer = L.overlayPanel && s.drawer && s.panel !== 'off' ? `<div class="scrim" data-drawer="0"></div>${panel(L, 'drawer ' + (s.pos === 'left' ? 'left' : ''))}` : '';
  const sideDrawer = L.hideSide && s.sideOpen ? `<div class="scrim" data-sideopen="0"></div><div class="sidedrawer">${sidebar(L, true)}</div>` : '';
  const drops = s.edit && showPanel ? `<div class="drop" style="${s.pos === 'right' ? 'left:' + ((L.hideSide ? 0 : L.rail ? 56 : 228) + 16) + 'px' : 'right:16px'}">오른쪽 패널을<br>여기로 끌어 놓기</div>` : '';
  return `<div class="win ${s.edit ? 'edit' : ''}" style="width:${s.w}px;height:${H}px">
    <div class="top">${L.hideSide ? `<span class="ham" data-sideopen="1">${I.menu}</span>` : ''}<span class="mark-t">T</span><span class="search">${I.search} 할 일, 메모, 카테고리 검색<kbd>Ctrl K</kbd></span>
      ${s.w >= 960 ? '<span class="sync"><i></i>모두 동기화됨</span>' : ''}<span class="wc"><span>—</span><span>▢</span><span>✕</span></span></div>
    <div class="body">${L.hideSide ? '' : sidebar(L)}<div class="panes">${panes}</div>${drawer}${sideDrawer}${drops}
      ${s.edit ? `<div class="editbar">레이아웃 편집 중 · 패널 이름을 끌어 옮기고, 가운데 선을 끌어 너비를 바꿔요<span class="b" data-reset="1">기본값으로</span><span class="b p" data-set="edit:false">완료</span></div>` : ''}</div>
  </div>`;
}

function notes() {
  const L = layout();
  const mode = s.w >= 1280 ? '넓은 창: 메뉴 + 목록 + 패널' : s.w >= 1000 ? '중간 창: 메뉴는 아이콘만, 패널 320px' : s.w >= 800 ? '좁은 창: 패널은 위에 겹쳐 열림' : '아주 좁은 창: 메뉴도 ☰ 버튼으로';
  return `<div class="notes"><div class="now">${s.w}×${SIZES[s.w]} · ${mode}</div>
    <h3>바꾸는 것</h3><ul class="new">
    <li><b>세 칸 구조</b>: 왼쪽 메뉴 · 가운데 목록(창 크기에 맞춰 늘어남) · 오른쪽 패널. 지금은 목록이 560px로 고정이고 캘린더가 늘 옆에 붙어 있음.</li>
    <li><b>할 일을 누르면 오른쪽에 상세</b>: 기한·반복·카테고리·하위 할 일·메모를 한곳에서. 지금처럼 목록 안에서 펼쳐지며 아래 줄이 밀리지 않음. 선택이 없으면 패널은 캘린더(미니 달력 + 그날 할 일).</li>
    <li><b>날짜별 묶음</b>: 기한 지남 · 오늘 · 내일 · 이번 주 · 나중에 · 기한 없음. 묶음은 접을 수 있음. "보기"에서 지금처럼 하나로(기한 순)도 고를 수 있음.</li>
    <li><b>할 일 줄</b>: 왼쪽 체크 · 제목 · 아래 줄(카테고리 점과 이름 · 남은 시간 · 반복 · 하위 할 일) · 오른쪽 끝에 짧은 시각(오후 5:30, 내일 오전 11시, 금 오후 7시)과 별. 카드 상자 대신 얇은 구분선이라 한 화면에 더 많이 보임.</li>
    <li><b>머리글 한 줄 요약</b>: "남은 할 일 10개 · 기한 지남 1개". 기한 지난 게 있으면 메뉴의 "오늘" 숫자도 빨강.</li>
    <li><b>빠른 추가</b>: 목록 위 입력칸에 날짜·반복·카테고리·중요 칩. 보고 있는 목록에 맞춰 미리 골라짐(오늘 목록이면 "오늘"). 왼쪽 "할 일 추가" 버튼(Ctrl N)은 어디서든 같은 칸으로.</li>
    <li><b>정렬·필터 정리</b>: 지금 위에 늘어선 정렬 버튼 3개와 전체/진행 중/완료됨 탭을 "보기" 메뉴 하나로. 완료한 할 일은 맨 아래 "완료됨"에 접어 둠.</li>
    <li><b>사용자 맞춤</b>: 오른쪽 패널 왼쪽/오른쪽 옮기기, 가운데 선 끌어 너비 바꾸기, 패널 끄기, 메뉴 아이콘만 보기, 줄 간격(두 줄/한 줄). 툴바 "편집 모드"로 모습 확인. 설정 > 사용자 맞춤에도 같은 항목.</li>
    <li><b>반응형</b>: 1280 이상 세 칸, 1000~1279 메뉴 아이콘만(56px)·패널 320px, 800~999 패널은 "패널" 버튼이나 할 일 클릭 때 위에 겹쳐 열림, 800 미만 메뉴도 ☰로. 툴바 "창 크기"로 확인.</li>
    <li>위쪽 막대: 검색(Ctrl K)과 동기화 상태만. 메뉴 위의 큰 시계는 날짜 한 줄 + "할 일 N개 남음"으로.</li></ul>
    <h3>그대로인 것</h3><ul>
    <li>색·글꼴·다크 테마, 카테고리 색, 노란 별, 남은 시간 표시 설정(#101), 비밀 카테고리(열쇠), 검색, 설정 창, 타임라인 화면.</li></ul>
    <h3 class="q">정할 것</h3><ul class="q">
    <li><b>"다음 7일" 메뉴</b> 새로 넣을지 (오늘 + 앞으로 6일). 빼면 지금처럼 오늘 · 중요 · 모든 할 일.</li>
    <li><b>할 일 상세</b>를 오른쪽 패널로 옮기는 게 맞는지, 지금처럼 목록 안에서 펼치기도 남겨 둘지(설정으로 고르기).</li>
    <li><b>캘린더</b>: 목록 화면 오른쪽 패널에서는 미니 달력 + 그날 목록, 큰 달력은 "캘린더" 화면에서만. 지금처럼 목록 옆에 큰 달력을 늘 두고 싶은지.</li>
    <li><b>패널 옮기기 방식</b>: 이 시안처럼 편집 모드에서 끌어 놓기 vs 설정 > 사용자 맞춤에서 고르기만.</li>
    <li>오른쪽 끝 짧은 시각과 아래 줄 남은 시간이 둘 다 보이는데, 하나만 둘지(예: 오른쪽은 시각만, 아래 줄은 남은 시간 대신 빼기).</li></ul></div>`;
}
function toolbar() {
  const b = (k, v, l) => `<button class="${s[k] === v ? 'on' : ''}" data-set="${k}:${v}">${l}</button>`;
  return `<div class="line"><strong>창 크기</strong>${b('w', 1440, '1440×960')}${b('w', 1180, '1180×800')}${b('w', 960, '960×720')}${b('w', 760, '760×640')}<span class="sep"></span>
      <strong>가운데</strong>${b('view', 'list', '목록')}${b('view', 'calendar', '캘린더')}<span class="sep"></span>
      <strong>상태</strong>${b('state', 'selected', '할 일 선택')}${b('state', 'nosel', '선택 없음')}${b('state', 'empty', '빈 목록')}</div>
    <div class="line"><strong>오른쪽 패널</strong>${b('panel', 'auto', '자동(선택하면 상세)')}${b('panel', 'calendar', '캘린더 고정')}${b('panel', 'off', '끔')}<span class="sep"></span>
      <strong>패널 위치</strong>${b('pos', 'right', '오른쪽')}${b('pos', 'left', '왼쪽')}<span class="sep"></span>
      <strong>왼쪽 메뉴</strong>${b('rail', 'auto', '창 크기에 맞춤')}${b('rail', 'full', '펼침')}${b('rail', 'rail', '아이콘만')}</div>
    <div class="line"><strong>묶기</strong>${b('group', 'date', '날짜별')}${b('group', 'none', '하나로')}<span class="sep"></span>
      <strong>줄 간격</strong>${b('density', 'normal', '보통')}${b('density', 'compact', '촘촘')}<span class="sep"></span>
      <strong>편집 모드</strong>${b('edit', true, '켬')}${b('edit', false, '끔')}<span class="sep"></span>
      <strong>표시</strong>${b('mark', true, '바뀌는 부분')}${b('mark', false, '끔')}<span class="sep"></span>${b('fit', false, '실제 크기')}${b('fit', true, '맞춤(70%)')}</div>`;
}
function render() {
  document.getElementById('toolbar').innerHTML = toolbar();
  const st = document.getElementById('stage');
  st.className = 'stage' + (s.mark ? ' mark' : '') + (s.fit ? ' fit' : '');
  st.innerHTML = win() + notes();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-set],[data-nav],[data-task],[data-check],[data-star],[data-sec],[data-view],[data-tab],[data-pick],[data-closepanel],[data-viewmenu],[data-drawer],[data-sideopen],[data-reset]');
  if (!el) { if (s.viewMenu) { s.viewMenu = false; render(); } return; }
  const d = el.dataset;
  if (!d.viewmenu && !(d.set && /^(group|density):/.test(d.set))) s.viewMenu = false;
  if (d.set) { const [k, v] = d.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v; if (k === 'state' || k === 'panel') s.tab = null; if (k === 'w') { s.drawer = false; s.sideOpen = false; } }
  else if (d.check) { s.done[d.check] = !s.done[d.check]; }
  else if (d.star) { s.imp[d.star] = !s.imp[d.star]; }
  else if (d.task) { s.selected = d.task; s.state = 'selected'; s.tab = null; if (s.view === 'calendar') s.view = 'list'; if (layout().overlayPanel) s.drawer = true; }
  else if (d.nav) { s.nav = d.nav; s.sideOpen = false; }
  else if (d.sec) { s.closed[d.sec] = !s.closed[d.sec]; }
  else if (d.view) { s.view = d.view; s.tab = null; }
  else if (d.tab) { s.tab = d.tab; }
  else if (d.pick) { s.picked = +d.pick; if (s.view !== 'calendar') s.tab = 'calendar'; }
  else if (d.closepanel) { if (layout().overlayPanel) s.drawer = false; else if (panelTab() === 'detail') s.tab = 'calendar'; else s.panel = 'off'; }
  else if (d.viewmenu) { s.viewMenu = !s.viewMenu; }
  else if (d.drawer) { s.drawer = d.drawer === '1'; }
  else if (d.sideopen) { s.sideOpen = d.sideopen === '1'; }
  else if (d.reset) { Object.assign(s, { panel: 'auto', pos: 'right', rail: 'auto', group: 'date', density: 'normal' }); }
  render();
});
render();
</script>
</body>
</html>

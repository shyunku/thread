function render() {
  document.getElementById('toolbar').innerHTML = toolbar();
  const st = document.getElementById('stage');
  st.className = 'stage' + (s.mark ? ' mark' : '');
  const view = { settings, plist: phoneList, pset: () => phoneSettings(false), psheet: () => phoneSettings(true) }[s.screen] || mainWindow;
  st.innerHTML = view() + notes();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-fmt],[data-due],[data-mode],[data-h24]'); if (!t) return;
  if (t.dataset.set) { const [k, v] = t.dataset.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v; }
  if (t.dataset.fmt) s.fmt = +t.dataset.fmt;
  if (t.dataset.due) s.dueFmt = t.dataset.due;
  if (t.dataset.mode) s.mode = t.dataset.mode;
  if (t.dataset.h24) s.h24 = t.dataset.h24 === 'true';
  render();
});
render();
</script>
</body>
</html>

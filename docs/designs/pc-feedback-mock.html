<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread PC 피드백 시안 (#101)</title>
<style>
  :root { --page: #0b0d10; --border-ui: #2b303b; --ui-text: #edf1f7; --ui-muted: #8792a4; --ui-panel: #15181e; --ui-selected: #253858;
    --canvas: #101216; --panel: #15181e; --surface: #1c2028; --hover: #252b36; --border: #2b303b; --text: #edf1f7; --secondary: #a0aaba; --muted: #8792a4;
    --accent: #6294ff; --selected: #253858; --success: #70d5a0; --danger: #f0838b; --star: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ui-text); font: 14px/1.5 Pretendard, "Malgun Gothic", "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  svg { display: block; }
  .toolbar { position: sticky; top: 0; z-index: 50; display: flex; flex-direction: column; gap: 6px; padding: 10px 16px; background: #0b0d10ee; border-bottom: 1px solid var(--border-ui); }
  .toolbar .line { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .toolbar strong { margin-right: 4px; font-size: 12px; color: var(--ui-muted); min-width: 52px; }
  .toolbar button { padding: 4px 9px; border: 1px solid var(--border-ui); border-radius: 7px; background: var(--ui-panel); font-size: 12px; color: #a0aaba; cursor: pointer; }
  .toolbar button.on { background: var(--ui-selected); border-color: #3a5486; color: var(--ui-text); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--border-ui); margin: 0 4px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 28px 16px 64px; flex-wrap: wrap; }
  .notes { width: 420px; padding: 16px 18px; border: 1px dashed #3a4252; border-radius: 12px; color: #a0aaba; font-size: 13px; }
  .notes h3 { margin: 14px 0 6px; font-size: 13px; color: var(--ui-text); } .notes h3:first-child { margin-top: 0; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 4px 0; }
  .notes .q { color: #edbc72; }
  .notes .now { padding: 8px 10px; border-radius: 8px; background: #161b24; color: #cfd6e2; margin-bottom: 10px; }
  .mark .chg { outline: 2px dashed #edbc72; outline-offset: 2px; border-radius: 8px; }

  /* Main window 1440x960 */
  .desk-wrap.fit { zoom: .7; }
  .desk { position: relative; width: 1440px; height: 960px; display: flex; flex-direction: column; border: 1px solid #2b303b; border-radius: 10px; overflow: hidden; background: var(--canvas); color: var(--text); }
  .topbar { height: 42px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--secondary); }
  .topbar .search { margin: 0 auto; width: 470px; height: 28px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-size: 12px; }
  .dbody { flex: 1; display: flex; min-height: 0; }
  .side { width: 232px; flex: none; padding: 18px 12px; background: var(--panel); border-right: 1px solid var(--border); position: relative; }
  .side .clock { padding: 0 8px 18px; color: var(--muted); font-size: 11px; } .side .clock b { display: block; font-size: 22px; color: var(--text); font-weight: 500; }
  .side h5 { display: flex; align-items: center; margin: 12px 8px 8px; font-size: 12px; color: var(--secondary); }
  .side h5 .plus { margin-left: auto; color: var(--muted); font-size: 16px; }
  .menu { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; color: var(--secondary); font-size: 14px; }
  .menu .ic { width: 18px; flex: none; display: grid; place-items: center; color: var(--muted); }
  .menu .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  .menu.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .menu .dot { width: 9px; height: 9px; border-radius: 50%; }
  .main { width: 560px; flex: none; padding: 24px 28px; overflow: hidden; }
  .main h1 { margin: 0; font-size: 28px; display: flex; align-items: center; gap: 10px; }
  .main h1 .cnt { font-size: 14px; padding: 1px 9px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--secondary); }
  .main .sub { font-size: 11px; color: var(--muted); margin: 6px 0 18px; }
  .btns { display: flex; gap: 6px; margin-bottom: 14px; }
  .btns .b { flex: none; white-space: nowrap; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--secondary); font-size: 12px; display: flex; align-items: center; }
  .btns .b.on { border-color: var(--accent); color: var(--accent); background: #1b2740; }
  .btns .gap { flex: 1; }
  .add { height: 50px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--muted); margin: 14px 0 22px; }
  .grp { font-size: 13px; color: var(--secondary); margin-bottom: 10px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 10px 0 14px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .row .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .row .meta > * { flex: none; }
  .row .meta .over { color: var(--danger); }
  .cbadge { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; }
  .star { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .star.on { color: var(--star); }
  .star.ghost { opacity: 0; }
  .cal { flex: 1; padding: 24px 28px; border-left: 1px solid var(--border); color: var(--muted); }
  .cal h2 { margin: 0 0 18px; color: var(--text); font-size: 24px; }
  .calgrid { height: 560px; border: 1px solid var(--border); border-radius: 10px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 30px repeat(5, 1fr); }
  .calgrid div { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 12px; padding: 6px 8px; }
  .calgrid .today { outline: 2px solid var(--accent); outline-offset: -2px; background: #1b2740; }
  .daylist { margin-top: 18px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .daylist h4 { margin: 0 0 10px; color: var(--text); font-size: 15px; }
  .dayrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12.5px; color: var(--secondary); }
  .dayrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .dayrow .r { margin-left: auto; color: var(--muted); }
  .dayrow .r.over { color: var(--danger); }

  /* Category popup (CustomContextMenu default style + SubmitInput) */
  .ctx { position: absolute; left: 196px; top: 250px; width: 218px; border: 1px solid var(--border); border-radius: 10px; background: rgba(25,29,37,.96); box-shadow: 0 12px 30px #0007; z-index: 5; }
  .ctx input { width: 100%; border: 0; background: transparent; color: var(--text); padding: 5px 8px; }
  .ctx input::placeholder { color: var(--muted); }
  .ctx.before { padding: 15px; } .ctx.before input { font-size: 11px; outline: 2px solid #6294ff; outline-offset: 0; border-radius: 6px; }
  .ctx.after { padding: 13px; } .ctx.after input { font-size: 13px; outline: none; }

  /* Settings modal */
  .backdrop { position: absolute; inset: 42px 0 0; background: #080a10cc; display: grid; place-items: center; z-index: 10; }
  .set { width: 1080px; height: 760px; display: flex; border: 1px solid #354051; border-radius: 14px; background: #151a23; overflow: hidden; }
  .set-nav { width: 196px; padding: 18px 10px; background: #12161d; border-right: 1px solid #262d39; }
  .set-nav h4 { margin: 0 10px 12px; font-size: 15px; font-weight: 700; }
  .mi { height: 34px; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; color: var(--secondary); font-size: 14px; }
  .mi.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .set-content { flex: 1; padding: 22px 28px 32px; overflow-y: auto; }
  .set-content h2 { margin: 0 0 2px; font-size: 19px; }
  .set-content .pd { margin: 0 0 18px; font-size: 13px; color: var(--secondary); }
  .scard { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .srow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .srow:first-child { border-top: 0; }
  .srow .tx { flex: 1; min-width: 0; }
  .srow .lb { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .srow .ds { font-size: 12.5px; color: var(--secondary); line-height: 1.5; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg span { padding: 4px 12px; border-radius: 6px; font-size: 12px; color: var(--secondary); cursor: pointer; }
  .seg span.on { background: var(--selected); color: var(--text); font-weight: 600; }
  .tog { width: 38px; height: 22px; border-radius: 11px; background: var(--accent); position: relative; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 19px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .fmt { display: block; padding: 12px 14px 14px; border-top: 1px solid var(--border); }
  .fmt .head { display: flex; align-items: center; gap: 12px; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .opt { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: #181c24; cursor: pointer; }
  .opt.on { border-color: var(--accent); background: #1b2740; }
  .opt .nm { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .opt .radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  .opt.on .radio { border-color: var(--accent); box-shadow: inset 0 0 0 3px #1b2740; background: var(--accent); }
  .opt .ex { margin-top: 8px; font-size: 12px; color: var(--secondary); line-height: 1.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="stage" id="stage"></div>
<script>
const P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const STAR = (size, filled) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${filled ? P.replace('fill="none"', 'fill="currentColor"') : P}><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>`;
const S = 1000, M = 60 * S, H = 60 * M, D = 24 * H, MO = 30 * D, Y = 365 * D;
const UNITS = [[Y, '년'], [MO, '개월'], [D, '일'], [H, '시간'], [M, '분'], [S, '초']];
const FORMATS = [
  { id: 1, name: '간단히', desc: '가장 큰 단위 하나' },
  { id: 2, name: '보통', desc: '큰 단위부터 두 개' },
  { id: 3, name: '자세히', desc: '큰 단위부터 세 개' },
  { id: 9, name: '모두', desc: '초 단위까지 전부' },
];
// From the largest non-zero unit, up to `layers` consecutive units; zero units at the end are dropped.
function remain(ms, layers) {
  const neg = ms < 0; let rest = Math.abs(ms); const parts = []; let started = false;
  for (const [size, unit] of UNITS) {
    const v = Math.floor(rest / size); rest -= v * size;
    if (!started && v === 0) continue;
    started = true; parts.push([v, unit]);
    if (parts.length >= layers) break;
  }
  while (parts.length > 1 && parts.at(-1)[0] === 0) parts.pop();
  const text = parts.length ? parts.map(([v, u]) => v + u).join(' ') : '0초';
  return { text: `${text} ${neg ? '지남' : '남음'}`, over: neg };
}
const TASKS = [
  { t: '분기 회고 자료 정리', cat: '업무', color: '#6294ff', ms: 2 * H + 59 * M + 55 * S, imp: true, sub: '2/3', today: true },
  { t: '운동 30분', cat: '생활', color: '#44c98b', ms: 4 * H + 12 * M + 8 * S, imp: false, repeat: '매일', today: true },
  { t: '주간 보고서 제출', cat: '업무', color: '#6294ff', ms: -(3 * H + 40 * M + 2 * S), imp: false, today: true },
  { t: '디자인 리뷰 피드백 반영', cat: '업무', color: '#6294ff', ms: 20 * H + 5 * M + 3 * S, imp: true, sub: '0/2' },
  { t: '여행 숙소 알아보기', cat: null, ms: D + 9 * M + 13 * S, imp: false },
  { t: '알고리즘 문제 2개 풀기', cat: '공부', color: '#b58cff', ms: 2 * D + 6 * H + 30 * M, imp: false },
  { t: '토익 단어 50개', cat: '자격증 및 어학 시험 준비 (2026 하반기)', color: '#f0838b', ms: 3 * D + 23 * H + 2 * M + 8 * S, imp: false, repeat: '매일' },
  { t: '치과 예약', cat: '생활', color: '#44c98b', ms: MO + 4 * D + 23 * H + 2 * M + 8 * S, imp: true },
];
const s = { screen: 'main', fmt: 1, popup: 'after', mark: false, fit: false };

function sidebar(withPopup) {
  return `<div class="side"><div class="clock">2026년 10월 07일 (수요일)<b>오후 2:58:19</b></div>
    <h5>내 작업</h5>
    <div class="menu on"><span class="ic">≡</span>모든 할 일<span class="n">8</span></div>
    <div class="menu"><span class="ic">▣</span>오늘<span class="n">3</span></div>
    <div class="menu"><span class="ic" style="color:var(--star)">${STAR(16, true)}</span>중요<span class="n">3</span></div>
    <h5 style="margin-top:22px">카테고리<span class="plus">＋</span></h5>
    ${[['업무', '#6294ff', 3], ['공부', '#b58cff', 1], ['생활', '#44c98b', 2]].map(([n, c, k]) => `<div class="menu"><span class="ic"><span class="dot" style="background:${c}"></span></span>${n}<span class="n">${k}</span></div>`).join('')}
    ${withPopup ? `<div class="ctx ${s.popup} chg"><input placeholder="새로운 카테고리 생성" value="${s.popup === 'after' ? '독서' : ''}"></div>` : ''}
  </div>`;
}
function rows() {
  return TASKS.map(t => {
    const r = remain(t.ms, s.fmt);
    const badge = t.cat ? `<span class="cbadge chg" style="color:${t.color};background:${t.color}26">${t.cat}</span>` : '';
    const meta = [badge, `<span class="${r.over ? 'over' : ''}">${r.text}</span>`, t.repeat ? `<span>·</span><span>↻ ${t.repeat}</span>` : '', t.sub ? `<span>·</span><span>${t.sub}</span>` : ''].join('');
    return `<div class="row"><span class="chk"></span><div class="body"><div class="t">${t.t}</div><div class="meta">${meta}</div></div><span class="star chg ${t.imp ? 'on' : ''}">${STAR(16, t.imp)}</span></div>`;
  }).join('');
}
function calendar() {
  const day = TASKS.filter(t => t.today).sort((a, b) => a.ms - b.ms);
  return `<div class="cal"><h2>2026년 10월</h2><div class="calgrid">${['일', '월', '화', '수', '목', '금', '토'].map(d => `<div style="text-align:center">${d}</div>`).join('')}
    ${Array.from({ length: 35 }, (_, i) => { const d = i - 3; return `<div class="${d === 7 ? 'today' : ''}">${d > 0 && d <= 31 ? d : ''}</div>`; }).join('')}</div>
    <div class="daylist chg"><h4>10월 7일 (수)</h4>${day.map(t => { const r = remain(t.ms, s.fmt); return `<div class="dayrow"><span class="dot" style="background:${t.color}"></span>${t.t}<span class="r ${r.over ? 'over' : ''}">${r.text}</span></div>`; }).join('')}</div></div>`;
}
function mainWindow(overlay = '') {
  return `<div class="desk-wrap ${s.fit ? 'fit' : ''}"><div class="desk"><div class="topbar"><b style="color:var(--text)">Thread</b><span class="search">⌕ 할 일, 메모, 카테고리 검색…</span></div>
    <div class="dbody">${sidebar(s.screen === 'popup')}
    <div class="main"><h1>모든 할 일 <span class="cnt">8</span></h1><div class="sub">9개의 할 일 · 1개 완료</div>
      <div class="btns"><span class="b on">리스트</span><span class="b">캘린더</span><span class="b">타임라인</span><span class="gap"></span><span class="b on">기한 순</span><span class="b">남은 기한 순</span><span class="b">생성일 순</span></div>
      <div class="add">＋ 할 일을 추가하세요…</div><div class="grp">▾ 해야할 일 (8)</div>${rows()}</div>
    ${calendar()}</div>${overlay}</div></div>`;
}
function settings() {
  const sample = [10 * H + 5 * M + 3 * S, MO + 4 * D + 23 * H + 2 * M + 8 * S, 9 * M + 13 * S];
  const opts = FORMATS.map(f => `<div class="opt ${s.fmt === f.id ? 'on' : ''}" data-fmt="${f.id}"><div class="nm"><span class="radio"></span>${f.name}</div>
    ${sample.map(ms => `<div class="ex">${remain(ms, f.id).text}</div>`).join('')}</div>`).join('');
  return mainWindow(`<div class="backdrop"><div class="set"><div class="set-nav"><h4>설정</h4>${['일반', '데이터', '사용자 맞춤', '계정', '시스템', '정보'].map((x, i) => `<div class="mi ${i === 0 ? 'on' : ''}">${x}</div>`).join('')}</div>
    <div class="set-content"><h2>일반</h2><p class="pd">앱의 기본 동작을 정합니다.</p><div class="scard">
      <div class="srow"><div class="tx"><div class="lb">시작할 때 보기</div><div class="ds">앱을 열면 처음 보여 줄 화면</div></div><div class="seg"><span class="on">리스트</span><span>캘린더</span><span>타임라인</span></div></div>
      <div class="srow"><div class="tx"><div class="lb">주 시작 요일</div><div class="ds">캘린더의 첫 번째 열</div></div><div class="seg"><span class="on">일요일</span><span>월요일</span></div></div>
      <div class="srow"><div class="tx"><div class="lb">시간 표시</div><div class="ds">오후 3시 / 15시</div></div><div class="seg"><span class="on">12시간</span><span>24시간</span></div></div>
      <div class="fmt chg"><div class="head"><div class="tx" style="flex:1"><div class="lb" style="font-size:14px;font-weight:600">남은 시간 표시</div><div class="ds" style="font-size:12.5px;color:var(--secondary)">할 일 목록과 캘린더 아래 목록에 남은 시간을 얼마나 자세히 보여 줄지 정해요.</div></div></div>
        <div class="opts">${opts}</div></div>
      <div class="srow"><div class="tx"><div class="lb">테마 <span style="font-size:10px;padding:1px 6px;border-radius:5px;background:#252b36;color:var(--muted)">준비 중</span></div><div class="ds">다크, 라이트, 시스템 설정 따르기</div></div><div class="seg"><span class="on">다크</span><span>라이트</span><span>시스템</span></div></div>
      <div class="srow"><div class="tx"><div class="lb">업데이트 후 변경 내용 보기</div><div class="ds">새 버전으로 바뀐 뒤 처음 열 때 바뀐 점을 창으로 보여 줘요.</div></div><span class="tog"></span></div>
    </div></div></div></div>`);
}

function notes() {
  return `<div class="notes"><div class="now">${{ main: '할 일 목록 + 캘린더', popup: '카테고리 추가 창', settings: '설정 > 일반' }[s.screen]} · 남은 시간 "${FORMATS.find(f => f.id === s.fmt).name}"</div>
    <h3>바뀌는 것</h3><ul>
      <li><b>1. 카테고리</b>: 제목 앞 → 아래 줄 맨 앞(색 입힌 이름, 최대 120px 말줄임).</li>
      <li><b>2. 캘린더 아래 목록</b>: 남은 시간이 짧은 순(지난 일이 맨 위).</li>
      <li><b>3. 별</b>: 모든 할 일에 항상 보임. 꺼진 별은 회색 테두리, 켜진 별은 노랑.</li>
      <li><b>4. 카테고리 추가 창</b>: 입력칸 포커스 테두리 없앰, 글자 11 → 13px, 바깥 여백 15 → 13px. 툴바 "추가 창"으로 지금/바뀐 뒤 비교.</li>
      <li><b>5. 남은 시간 표시</b>(설정 > 일반, 테마 위): 간단히 · 보통 · 자세히 · 모두. 카드마다 같은 세 시간(10시간 5분 3초 / 1개월 4일 23시간 2분 8초 / 9분 13초)을 그 방식으로 보여 줌. 고르면 목록·캘린더 아래 목록이 바로 바뀜(툴바 "남은 시간"으로도 확인).</li>
    </ul>
    <h3>그대로인 것</h3><ul><li>펼친 할 일의 "남은 시간 2시간 59분 55초"(초 단위 카운트다운)는 지금처럼 항상 자세히.</li><li>캘린더 칸, 타임라인.</li></ul>
    <h3 class="q">정할 것</h3><ul class="q">
      <li>방식 이름: 간단히 · 보통 · 자세히 · 모두(시안) / 1단위 · 2단위 · 3단위 · 전체 / 다른 이름.</li>
      <li>중간이 0인 단위: "1시간 0분 5초"처럼 보일지, "1시간 5초"로 건너뛸지(시안은 끝의 0만 뺌: "2일 0시간" → "2일").</li>
      <li>"자세히"·"모두"는 초가 바뀔 때마다 목록이 다시 그려져서, 할 일이 많으면 조금 무거워질 수 있음. 괜찮은지.</li>
      <li>폰에도 같은 설정을 넣을지(이번 피드백은 PC만).</li>
    </ul></div>`;
}
function toolbar() {
  const b = (k, v, l) => `<button class="${s[k] === v ? 'on' : ''}" data-set="${k}:${v}">${l}</button>`;
  return `<div class="line"><strong>화면</strong>${b('screen', 'main', '할 일 목록')}${b('screen', 'popup', '카테고리 추가 창')}${b('screen', 'settings', '설정 > 일반')}<span class="sep"></span><strong>추가 창</strong>${b('popup', 'before', '지금')}${b('popup', 'after', '바뀐 뒤')}</div>
    <div class="line"><strong>남은 시간</strong>${FORMATS.map(f => b('fmt', f.id, f.name)).join('')}<span class="sep"></span><strong>표시</strong>${b('mark', true, '바뀌는 부분 표시')}${b('mark', false, '끔')}<span class="sep"></span><strong>크기</strong>${b('fit', false, '실제 1440×960')}${b('fit', true, '맞춤(70%)')}</div>`;
}
function render() {
  document.getElementById('toolbar').innerHTML = toolbar();
  const st = document.getElementById('stage');
  st.className = 'stage' + (s.mark ? ' mark' : '');
  st.innerHTML = (s.screen === 'settings' ? settings() : mainWindow()) + notes();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-fmt]'); if (!t) return;
  if (t.dataset.set) { const [k, v] = t.dataset.set.split(':'); s[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v; }
  if (t.dataset.fmt) s.fmt = +t.dataset.fmt;
  render();
});
render();
</script>
</body>
</html>

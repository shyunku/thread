// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 33
        kotlinVersion = "1.9.22"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.3.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

// Preserve AGP 7 behavior for existing RN native libraries under AGP 8.
subprojects { nativeProject ->
    nativeProject.plugins.withId("com.android.library") {
        def androidLibrary = nativeProject.extensions.getByName("android")
        androidLibrary.buildFeatures.buildConfig = true
        if (!androidLibrary.namespace) {
            def manifest = nativeProject.file("src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def declaredPackage = new XmlSlurper(false, false).parse(manifest).getProperty("@package").text()
                if (declaredPackage) androidLibrary.namespace = declaredPackage
            }
        }
    }
}

// Keychain v10 compiles Java 17; keep its Kotlin bytecode target identical.
project(":react-native-keychain") {
    plugins.withId("org.jetbrains.kotlin.android") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "17"
        }
    }
}

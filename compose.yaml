name: memorial

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-memorial}
      MYSQL_USER: ${MYSQL_USER:-memorial}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-memorial-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-memorial-dev-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./memorial_app_server/memorial.ddl:/docker-entrypoint-initdb.d/10-memorial.sql:ro
      - ./memorial_rms/scheme.ddl:/docker-entrypoint-initdb.d/20-memorial-rms.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 600s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-server:
    build:
      context: ./memorial_app_server
    restart: unless-stopped
    environment:
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID:-local-google-oauth-disabled}
      GOOGLE_OAUTH2_CLIENT_SECRET: ${GOOGLE_OAUTH2_CLIENT_SECRET:-local-google-oauth-disabled}
      GOOGLE_OAUTH2_REDIRECT_URL: ${GOOGLE_OAUTH2_REDIRECT_URL:-http://localhost:4033/v1/google-auth/login_callback}
      DB_USER: ${MYSQL_USER:-memorial}
      DB_PASSWORD: ${MYSQL_PASSWORD:-memorial-dev-password}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-memorial}
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-a-long-random-access-secret}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-3h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-a-different-long-random-refresh-secret}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      STATE_SCHEME_VERSION: 2
      DEBUG: "true"
    ports:
      - "${APP_SERVER_PORT:-4033}:4033"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4033/ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rms:
    build:
      context: .
      dockerfile: memorial_rms/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 4034
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-memorial}
      DB_DATABASE: ${MYSQL_DATABASE:-memorial}
      DB_PASSWORD: ${MYSQL_PASSWORD:-memorial-dev-password}
      DB_PORT: 3306
      APP_SERVER_ENTRY: http://app-server:4033
    ports:
      - "${RMS_PORT:-4034}:4034"
    volumes:
      - rms-releases:/app/releases
    depends_on:
      mysql:
        condition: service_healthy
      app-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4034/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  site:
    build:
      context: .
      dockerfile: memorial_site/Dockerfile
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-3000}:80"

  admin-site:
    build:
      context: .
      dockerfile: memorial_admin_site/Dockerfile
      args:
        REACT_APP_APP_SERVER_ENTRY: http://localhost:${APP_SERVER_PORT:-4033}
        REACT_APP_RMS_ENTRY: http://localhost:${RMS_PORT:-4034}
    restart: unless-stopped
    ports:
      - "${ADMIN_SITE_PORT:-3001}:80"
    depends_on:
      app-server:
        condition: service_healthy
      rms:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rms-releases:

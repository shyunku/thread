# Unsigned macOS build of the desktop app (#63) for testing on a Mac: open it
# the first time with right-click -> Open (ad-hoc signed so Apple Silicon runs it). No in-app updates on macOS yet; signed
# and notarized builds need the Apple Developer credentials and come later.
name: Desktop macOS (unsigned)

# Manual only: run it from the Actions tab when a Mac build is wanted.
on:
  workflow_dispatch:

concurrency:
  group: desktop-mac
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bash ../../.github/scripts/logged.sh "pnpm install" pnpm install --frozen-lockfile

      # Production endpoints, the same values as a packaged Windows build.
      - name: Production env file
        run: |
          printf 'REACT_APP_APP_SERVER_ENDPOINT=https://api.threadapp.kr\nRMS_ENTRY=https://rms.threadapp.kr\n' > .env.production

      - name: Build renderer
        env:
          CI: 'false'
        run: bash ../../.github/scripts/logged.sh "react build" pnpm build

      - name: Package (universal, no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          bash ../../.github/scripts/logged.sh "electron-builder" pnpm exec electron-builder build \
            --mac --universal --publish never \
            -c.extraMetadata.main=build/electron/core/main.js \
            -c.mac.identity=-
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Thread-mac-unsigned
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          retention-days: 14
